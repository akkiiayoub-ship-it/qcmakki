<script>
&quot;use strict&quot;;
var DATA={&quot;cards&quot;: [{&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Flavell (1976-79)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateur du concept : la métacognition est la connaissance que l'on a de ses propres processus cognitifs et le contrôle que l'on exerce sur eux. Il distingue les connaissances métacognitives (sur la personne, la tâche, les stratégies) et les expériences métacognitives (sentiments conscients pendant la tâche : « je ne comprends pas »).&quot;, &quot;m&quot;: &quot;Penser sur sa propre pensée ; connaissances (soi – tâche – stratégies) ; expériences métacognitives&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Brown (1978)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Met l'accent sur la régulation : planifier, contrôler (monitoring), évaluer, réviser son action. Elle oppose la connaissance de la cognition à la régulation de la cognition ; les experts régulent mieux que les novices.&quot;, &quot;m&quot;: &quot;Régulation métacognitive ; planifier – contrôler – évaluer ; contrôle exécutif&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Nelson &amp; Narens (1990)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Modèle à deux niveaux : le niveau objet (la tâche en cours) et le niveau méta, qui contient un modèle de l'objet. L'information remonte par le monitoring (évaluer où j'en suis) et la décision redescend par le contrôle (poursuivre, relire, changer de stratégie).&quot;, &quot;m&quot;: &quot;Niveau objet / niveau méta ; monitoring ; contrôle ; jugement de savoir&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Schraw &amp; Dennison (1994)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Auteurs du MAI (Metacognitive Awareness Inventory), outil d'auto-évaluation. Deux composantes : la connaissance de la cognition (déclarative, procédurale, conditionnelle) et la régulation (planification, gestion de l'information, débogage, évaluation).&quot;, &quot;m&quot;: &quot;MAI ; connaissance vs régulation ; savoir déclaratif / procédural / conditionnel ; débogage&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Zimmerman (années 1990-2000)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Apprentissage autorégulé en trois phases cycliques : anticipation (analyse de la tâche, buts, auto-efficacité), contrôle volitionnel (autocontrôle, auto-observation) et auto- réflexion (auto-jugement, attributions). L'apprenant boucle ensuite sur la tâche suivante.&quot;, &quot;m&quot;: &quot;Anticipation ; contrôle volitionnel ; auto-réflexion ; autorégulation ; buts&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Le langage extériorisé devient langage intérieur, qui sert d'instrument de planification et de contrôle de l'action. Faire verbaliser le geste (à voix haute) aide donc l'apprenant à l'organiser et à le réguler.&quot;, &quot;m&quot;: &quot;Langage intérieur ; internalisation ; médiation ; verbalisation&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bandura&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;L'auto-observation du geste, suivie d'un auto-jugement, nourrit le sentiment d'auto- efficacité, qui soutient les buts fixés et la persévérance face aux difficultés. Une observation guidée (grille, vidéo) renforce cette boucle.&quot;, &quot;m&quot;: &quot;Auto-observation ; auto- jugement ; auto-efficacité ; persévérance&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Piaget&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Réussir n'est pas comprendre : la réussite pratique précède la compréhension conceptuelle. La prise de conscience se construit par abstraction réfléchissante, en revenant sur ses propres actions pour en extraire les coordinations.&quot;, &quot;m&quot;: &quot;Réussir ≠ comprendre ; abstraction réfléchissante ; prise de conscience&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vermersch · Pastré&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Vermersch : l'entretien d'explicitation donne accès au vécu de l'action, en bonne partie implicite. Pastré : la conceptualisation se fait dans l'action même ; le geste repose sur une structure conceptuelle de la situation que l'on peut rendre explicite.&quot;, &quot;m&quot;: &quot;Explicitation ; vécu de l'action ; implicite ; conceptualisation dans l'action&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Flavell ≠ Brown : Flavell définit le concept, Brown insiste sur la régulation.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 1, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Avant d'enregistrer une station, le stagiaire énonce son plan de contrôle (fermeture angulaire, hauteur de prisme, aller-retour).&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Miller (1956)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;L'empan de la mémoire immédiate est d'environ 7 ± 2 éléments, extensible par le regroupement en unités (chunking). Cowan (2001) a révisé cette limite à 4 ± 1 éléments.&quot;, &quot;m&quot;: &quot;7 ± 2 ; chunking ; empan ; capacité limitée&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Baddeley &amp; Hitch (1974)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Modèle multi-composants de la mémoire de travail : un administrateur central coordonne la boucle phonologique et le calepin visuo-spatial (buffer épisodique ajouté en 2000). On ne retient pas tout simultanément.&quot;, &quot;m&quot;: &quot;Mémoire de travail ; administrateur central ; boucle phonologique ; calepin visuo-spatial&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Sweller (1988)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateur de la théorie de la charge cognitive : mémoire de travail limitée, mémoire à long terme riche en schémas, qui s'automatisent. Trois charges : intrinsèque (complexité du contenu), extrinsèque (liée à la mauvaise présentation, à réduire) et essentielle / germane (effort utile à la construction des schémas, à favoriser).&quot;, &quot;m&quot;: &quot;Charge intrinsèque / extrinsèque / essentielle ; schémas ; automatisation&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Chandler &amp; Sweller&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Effet d'attention partagée : quand le texte est séparé du schéma, l'apprenant doit les intégrer mentalement, ce qui coûte de la mémoire de travail. Solution : intégrer l'information (légendes sur le schéma).&quot;, &quot;m&quot;: &quot;Attention partagée ; coût d'intégration ; format intégré&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kalyuga (2003)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Effet d'inversion de l'expertise : l'étayage utile au novice devient redondant et gêne l'expert. Le guidage doit donc s'adapter au niveau et diminuer avec la progression.&quot;, &quot;m&quot;: &quot;Inversion de l'expertise ; novice / expert ; redondance ; étayage dégressif&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kirschner, Sweller &amp; Clark (2006)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Le guidage minimal (apprentissage par découverte pure) échoue chez les novices, car il surcharge la mémoire de travail. Un enseignement explicite et guidé est plus efficace au début.&quot;, &quot;m&quot;: &quot;Guidage minimal ; découverte ; enseignement explicite ; novices&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Paas&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Échelle d'effort mental perçu en 9 points : mesure subjective de la charge cognitive, croisée avec la performance pour estimer l'efficience de la formation.&quot;, &quot;m&quot;: &quot;Effort mental ; échelle à 9 points ; mesure subjective ; efficience&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Mayer (2001)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Apprentissage multimédia : double canal (visuel / auditif), capacité limitée, traitement actif. Supports non redondants : cohérence (rien d'inutile), contiguïté (texte près de l'image), modalité (voix + image), signalement.&quot;, &quot;m&quot;: &quot;Double canal ; cohérence ; contiguïté ; modalité ; redondance&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;van Merriënboer (4C/ID)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Pour les tâches complexes : tâches d'apprentissage entières, informations de soutien, informations procédurales délivrées juste-à-temps et entraînement des routines. Complexité croissante, étayage dégressif.&quot;, &quot;m&quot;: &quot;4C/ID ; tâches complexes ; juste-à-temps ; étayage dégressif&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;ZPD : le curseur du dosage de la difficulté. La tâche doit dépasser un peu le niveau actuel, avec étayage, pour rester ni trop facile ni trop lourde.&quot;, &quot;m&quot;: &quot;ZPD ; étayage ; dosage de la difficulté&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Intrinsèque = difficulté de la tâche (séquençable) ; extrinsèque = mauvaise présentation (à réduire) ; essentielle = effort utile (à favoriser).&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 2, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Mise en station en 3 temps isolés (centrage / calage / visée) puis fusion par étayage dégressif.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vermersch (1994)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateur de l'entretien d'explicitation : accès au vécu de l'action, par un questionnement non inductif centré sur un moment singulier, daté et précis. Il privilégie le « comment » (déroulé) plutôt que le « pourquoi » (justification). L'interviewé est amené à évoquer la situation, et l'intervieweur relance et reformule.&quot;, &quot;m&quot;: &quot;Explicitation ; vécu de l'action ; moment singulier ; comment ≠ pourquoi ; évocation&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Schön (1983)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Praticien réflexif : le savoir est caché dans l'agir (savoir tacite). Il distingue la réflexion dans l'action (en cours) et sur l'action (après coup) pour mettre au jour ce savoir.&quot;, &quot;m&quot;: &quot;Praticien réflexif ; savoir dans l'agir ; réflexion dans / sur l'action&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Argyris &amp; Schön (1974-78)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Théorie professée (ce que je dis faire) vs théorie d'usage (ce que je fais vraiment). Apprentissage en simple boucle (corriger l'action) et en double boucle (remettre en cause valeurs et présupposés).&quot;, &quot;m&quot;: &quot;Théorie professée / d'usage ; simple / double boucle&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Pastré&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Didactique professionnelle : analyser le travail pour former. Elle met au jour les concepts pragmatiques, qui organisent l'action, et la structure conceptuelle de la situation.&quot;, &quot;m&quot;: &quot;Didactique professionnelle ; concepts pragmatiques ; structure conceptuelle de la situation&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Clot&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Clinique de l'activité : l'activité réalisée n'est qu'une part du réel de l'activité (celle qui est empêchée, non faite, compte aussi). Autoconfrontation simple et croisée : le professionnel se voit agir, commente avec un pair ; cela développe son pouvoir d'agir.&quot;, &quot;m&quot;: &quot;Clinique de l'activité ; autoconfrontation ; activité empêchée ; pouvoir d'agir&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Flanagan (1954)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Technique des incidents critiques : on recueille des faits observables, réussis ou ratés, pour identifier les comportements décisifs dans une activité. Basée sur des situations réelles et précises, pas sur des opinions.&quot;, &quot;m&quot;: &quot;Incident critique ; faits observables ; situation réelle&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Rogers&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Écoute active : reformulation, empathie, considération positive et congruence. Le formateur n'interprète pas, il aide la personne à clarifier elle-même (non-directivité).&quot;, &quot;m&quot;: &quot;Écoute active ; reformulation ; empathie ; non-directivité&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Piaget&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;La prise de conscience n'est pas donnée avec la réussite : elle va des résultats (périphérie) vers les mécanismes de l'action (centre). Il faut donc questionner pour passer du savoir-faire à sa conceptualisation.&quot;, &quot;m&quot;: &quot;Prise de conscience ; réussite pratique ; conceptualisation&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Altet · Paquay · Perrenoud&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Analyse des pratiques en formation des enseignants : dispositifs de groupe visant une posture réflexive durable. Altet propose une analyse plurielle (plusieurs regards sur la même pratique).&quot;, &quot;m&quot;: &quot;Analyse de pratiques ; analyse plurielle ; posture réflexive&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Vermersch = explicitation (le comment) ≠ Schön = réflexivité (dans / sur l'action). Le « pourquoi » déclenche la rationalisation.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 3, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Expliciter une erreur de fermeture : reconstituer le déroulé réel du cheminement, ne pas livrer la cause d'emblée.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Tyler (1949)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Racine de l'ingénierie curriculaire. Quatre questions : quels objectifs, quelles expériences d'apprentissage, comment les organiser, comment évaluer. Logique : objectifs → expériences → évaluation.&quot;, &quot;m&quot;: &quot;Objectifs ; expériences d'apprentissage ; organisation ; évaluation&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bloom (1956) · Anderson &amp; Krathwohl (2001)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Taxonomie des objectifs cognitifs, de la mémorisation à la création. La version révisée de 2001 : se souvenir, comprendre, appliquer, analyser, évaluer, créer, croisés avec des types de connaissances. Elle sert à choisir le niveau visé.&quot;, &quot;m&quot;: &quot;Taxonomie ; niveaux cognitifs ; verbes d'action ; mémoriser → créer&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Mager (1962)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Objectif opérationnel : décrire un comportement observable, la condition de réalisation et le critère de réussite. Ex. : « avec la station totale, implanter un point à ±5 mm ».&quot;, &quot;m&quot;: &quot;Comportement ; condition ; critère ; observable / mesurable&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Biggs (1996)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateur de l'alignement constructif : les objectifs, les activités d'apprentissage et l'évaluation sont conçus ensemble, à partir de ce que l'apprenant doit être capable de faire. Il propose la taxonomie SOLO, qui classe la qualité de la compréhension (de la simple information à l'abstraction).&quot;, &quot;m&quot;: &quot;Alignement constructif ; taxonomie SOLO ; cohérence objectifs – activités – évaluation&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Wiggins &amp; McTighe (1998)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Conception à rebours (backward design) : on part des résultats attendus, puis on définit les preuves acceptables (évaluation), et enfin les activités. Vise une compréhension durable, par des tâches authentiques.&quot;, &quot;m&quot;: &quot;Backward design ; résultats ; preuves ; tâche authentique&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Le Boterf&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;La compétence est un savoir-agir en situation : mobiliser et combiner des ressources (internes et externes). Elle suppose savoir-agir (savoirs, capacités), vouloir-agir (motivation) et pouvoir-agir (contexte, moyens).&quot;, &quot;m&quot;: &quot;Savoir-agir ; vouloir-agir ; pouvoir-agir ; mobiliser des ressources ; situation&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Perrenoud&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;La compétence est la capacité de mobiliser des ressources pour faire face à une famille de situations ; elle ne se manifeste et ne s'évalue qu'en situation, donc pas par un simple QCM.&quot;, &quot;m&quot;: &quot;Mobilisation de ressources ; famille de situations ; évaluation en situation&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Tardif&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Compétence = savoir-agir complexe, qui combine des ressources variées pour une famille de situations. Elle se développe selon une trajectoire, avec des paliers d'évaluation tout au long de la formation.&quot;, &quot;m&quot;: &quot;Savoir-agir complexe ; trajectoire de développement ; paliers&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;De Ketele &amp; Roegiers&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Pédagogie de l'intégration : après l'acquisition des ressources, on propose des situations d'intégration significatives et complexes pour les mobiliser ensemble ; évaluation par critères.&quot;, &quot;m&quot;: &quot;Pédagogie de l'intégration ; situation d'intégration ; ressources ; critères&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Biggs ≠ Bloom : Biggs = cohérence de la chaîne ; Bloom = niveaux d'objectifs.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 4, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Compétence : « réaliser un levé rattaché au système de coordonnées national », évaluée sur la situation réelle, pas par QCM.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Dewey&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Apprendre en faisant, à condition que le faire soit problématisé : l'expérience n'éduque que si elle est suivie de réflexion à partir d'une situation problématique (enquête).&quot;, &quot;m&quot;: &quot;Learning by doing ; expérience ; problématisation ; enquête&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski · Bruner (Wood, Bruner &amp; Ross, 1976)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;ZPD : l'apprenant réussit avec aide ce qu'il ne réussit pas seul. Étayage (scaffolding) : l'adulte réduit la complexité, maintient l'orientation, démontre, puis retire progressivement son aide.&quot;, &quot;m&quot;: &quot;ZPD ; étayage ; guidage ; retrait progressif&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Gagné (1965)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Neuf événements de l'instruction, comme trame de séquence : attention, objectif, rappel des prérequis, présentation, guidage, performance, feedback, évaluation, rétention / transfert.&quot;, &quot;m&quot;: &quot;Événements de l'instruction ; prérequis ; guidage ; feedback ; transfert&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kolb (1984)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Cycle expérientiel : expérience concrète → observation réfléchie → conceptualisation → expérimentation. La théorie arrive après l'expérience et est testée à nouveau en pratique. Il décrit aussi quatre styles d'apprentissage.&quot;, &quot;m&quot;: &quot;Expérience concrète ; observation réfléchie ; conceptualisation ; expérimentation&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Meirieu&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Situation-problème : un obstacle réel, franchissable avec des ressources, crée le besoin d'apprendre. La consigne est une tâche à réaliser, la théorie est une réponse à un problème déjà éprouvé.&quot;, &quot;m&quot;: &quot;Situation-problème ; obstacle ; besoin d'apprendre ; ressources&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Pastré&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Simulation en didactique professionnelle : on s'appuie sur une situation de référence (réelle) et sur sa structure conceptuelle, puis on la simule pour apprendre avec un débriefing.&quot;, &quot;m&quot;: &quot;Simulation ; situation de référence ; structure conceptuelle ; débriefing&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Collins, Brown &amp; Newman (1989)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Cognitive apprenticeship : l'expert modèle son geste (modeling), guide (coaching), étaye (scaffolding), fait verbaliser (articulation), réfléchir et explorer, puis estompe son aide (fading).&quot;, &quot;m&quot;: &quot;Modeler ; guider ; estomper ; articulation ; réflexion ; exploration&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Lave &amp; Wenger (1991)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Cognition située : on apprend dans l'activité, en communauté. La participation périphérique légitime : le novice participe à des tâches réelles, d'abord simples, vers une pleine participation.&quot;, &quot;m&quot;: &quot;Cognition située ; participation périphérique légitime ; communauté de pratique&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Malglaive&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Savoirs en usage : savoirs théoriques, procéduraux et pratiques s'articulent dans l'action. Alternance intégrative théorie / pratique : chacune éclaire l'autre.&quot;, &quot;m&quot;: &quot;Savoirs en usage ; alternance intégrative ; savoirs théoriques / procéduraux / pratiques&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Savoir inerte = mémorisé mais jamais mobilisé. Alternance intégrative ≠ juxtaposition.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 5, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Cubature déclenchée par une commande réelle de terrassement : la formule arrive comme réponse à un problème déjà éprouvé.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Thorndike &amp; Woodworth (1901)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Transfert par éléments identiques : on transfère d'une situation à l'autre dans la mesure où elles partagent des éléments communs. Le transfert est surtout proche, lié à la ressemblance.&quot;, &quot;m&quot;: &quot;Éléments identiques ; ressemblance des situations ; transfert proche&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Judd (1908)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Transfert par généralisation de principes : comprendre le principe sous-jacent (expérience sur la réfraction et le tir sur cible immergée) permet de l'appliquer à des situations nouvelles.&quot;, &quot;m&quot;: &quot;Généralisation ; principes ; compréhension ; transfert lointain&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Baldwin &amp; Ford (1988)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateurs du modèle de transfert de formation : trois facteurs, caractéristiques de l'apprenant (aptitudes, motivation), design de la formation (principes d'apprentissage, contenus) et environnement de travail (soutien, occasion d'appliquer), qui conditionnent généralisation et maintien.&quot;, &quot;m&quot;: &quot;Apprenant ; design de formation ; environnement de travail ; généralisation ; maintien&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Tardif (1999)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Le transfert est un processus enseignable et non spontané : il faut travailler la contextualisation, la décontextualisation et la recontextualisation, en variant les situations d'une même famille.&quot;, &quot;m&quot;: &quot;Transfert enseignable ; contextualisation / décontextualisation ; familles de situations&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Perkins &amp; Salomon (1988-92)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Voie basse : automatismes très exercés, déclenchés par une situation similaire. Voie haute : abstraction consciente et délibérée, par rapprochement (bridging) de principes entre situations différentes.&quot;, &quot;m&quot;: &quot;Voie basse / voie haute ; automatismes ; abstraction consciente&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bransford &amp; Schwartz (1999)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Préparation à l'apprentissage futur : on évalue la capacité à apprendre dans une situation nouvelle (avec accès à des ressources), plutôt que la réutilisation directe de ce qui a été appris.&quot;, &quot;m&quot;: &quot;Préparation à l'apprentissage futur ; transfert dynamique&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kirkpatrick (1959)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Quatre niveaux d'évaluation : réaction, apprentissage, comportement, résultats. Le niveau 3 (comportement) correspond au transfert en situation de travail.&quot;, &quot;m&quot;: &quot;Réaction ; apprentissage ; comportement ; résultats ; niveau 3 = transfert&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Holton (1996)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Climat de transfert : soutien des collègues et du supérieur, occasion d'appliquer, feedback sur le travail. Il est mesuré par le LTSI.&quot;, &quot;m&quot;: &quot;Climat de transfert ; soutien ; opportunité ; LTSI&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Lave &amp; Wenger · Bandura&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Lave &amp; Wenger : apprentissage situé, lié à son contexte d'usage. Bandura : l'auto- efficacité conditionne l'oser-faire sur le poste.&quot;, &quot;m&quot;: &quot;Apprentissage situé ; auto- efficacité ; contexte&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Transfert proche vs lointain ; voie basse vs voie haute. Évaluer s'arrête trop souvent aux niveaux 1-2 de Kirkpatrick.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 6, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Même implantation en station totale puis en GNSS RTK avec contrôle croisé : l'apprenant abstrait le principe.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Knowles (1970-84)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Fondateur de l'andragogie. Six principes : besoin de savoir pourquoi apprendre, concept de soi autonome, expérience comme ressource, disposition à apprendre liée aux rôles sociaux, orientation vers la résolution de problèmes, motivation intrinsèque. Le formateur est facilitateur.&quot;, &quot;m&quot;: &quot;Andragogie ; autonomie ; expérience ; besoin de savoir ; rôles sociaux ; problèmes ; motivation interne&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Rogers (1969)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Approche centrée sur l'apprenant : le formateur facilite par la congruence (authenticité), l'empathie et la considération positive inconditionnelle. L'apprentissage est significatif lorsqu'il est personnellement impliquant.&quot;, &quot;m&quot;: &quot;Congruence ; empathie ; considération positive ; apprentissage significatif&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Carré (2005)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Apprenance : disposition durable à apprendre dans toutes les situations de vie. Il distingue des motifs d'engagement (épistémiques, socio-affectifs, hédoniques, identitaires, économiques…) que le formateur doit repérer.&quot;, &quot;m&quot;: &quot;Apprenance ; disposition durable ; motifs d'engagement&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Mezirow (1978-91)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Apprentissage transformateur : un dilemme désorientant conduit l'adulte à une réflexion critique sur ses cadres de référence (perspectives de sens) et à leur révision.&quot;, &quot;m&quot;: &quot;Cadres de référence ; dilemme désorientant ; réflexion critique ; transformation&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Lindeman&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Précurseur de l'éducation des adultes (1926) : l'expérience est le « livre vivant » de l'adulte ; l'éducation part des situations de vie, pas de matières scolaires.&quot;, &quot;m&quot;: &quot;Expérience ; livre vivant ; situations de vie&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bandura&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Auto-efficacité dégradée par un échec scolaire antérieur : l'adulte peut douter de sa capacité. Elle se reconstruit par expériences de réussite, modèles proches, encouragements.&quot;, &quot;m&quot;: &quot;Auto-efficacité ; échec antérieur ; expériences de maîtrise&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Deci &amp; Ryan (1985)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Autodétermination : la motivation intrinsèque est soutenue par trois besoins, autonomie (choix), compétence (réussite visible) et affiliation (lien aux autres).&quot;, &quot;m&quot;: &quot;Autodétermination ; autonomie ; compétence ; affiliation&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Meirieu · Dumazedier&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dumazedier : éducation permanente et autoformation tout au long de la vie. Meirieu : le formateur ne peut pas apprendre à la place de l'autre ; l'apprenant doit s'engager, choisir d'apprendre.&quot;, &quot;m&quot;: &quot;Engagement ; autoformation ; éducation permanente&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Andragogie (adultes) ≠ pédagogie (enfants) ; l'expérience est ressource ET obstacle.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 7, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Séquence sur les tolérances construite à partir d'une litige de bornage rapporté par un stagiaire.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Perrenoud (1997)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Pédagogie différenciée : différencier, c'est multiplier les situations d'apprentissage (variété de tâches, de supports, d'organisations), pas les niveaux d'exigence. Il rattache la différenciation à la lutte contre les inégalités et à une régulation continue des apprentissages.&quot;, &quot;m&quot;: &quot;Différenciation ; variété de situations ; régulation ; inégalités ; même exigence&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bloom&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Pédagogie de maîtrise : faire varier le temps et l'aide, pas l'objectif. Évaluation formative, puis correctifs et enrichissements pour que la plupart des apprenants atteignent la maîtrise.&quot;, &quot;m&quot;: &quot;Pédagogie de maîtrise ; évaluation formative ; temps et aide ; remédiation&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Meirieu&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Différenciation successive (variée pour tous : on change de méthode au fil du temps) vs simultanée (des activités distinctes au même moment pour des groupes). La différenciation reste liée à un projet commun.&quot;, &quot;m&quot;: &quot;Différenciation successive / simultanée ; variété des méthodes ; groupes&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski · Bruner&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;ZPD : l'écart entre ce que l'apprenant réussit seul et avec aide. Étayage différencié : le niveau d'aide s'ajuste à chacun, puis se réduit.&quot;, &quot;m&quot;: &quot;ZPD ; étayage différencié ; médiation&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Astolfi (1997)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;L'erreur est un outil de diagnostic : elle révèle les représentations et obstacles de l'apprenant. Il propose une typologie des erreurs pour décider de la remédiation.&quot;, &quot;m&quot;: &quot;Erreur ; diagnostic ; typologie des erreurs ; obstacle&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Rosenthal &amp; Jacobson (1968)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Effet Pygmalion : les attentes de l'enseignant influencent les résultats, par une prophétie auto-réalisatrice. Le formateur doit contrôler ses biais envers les stagiaires jugés faibles.&quot;, &quot;m&quot;: &quot;Effet Pygmalion ; attentes ; prophétie auto-réalisatrice&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Legrand · Przesmycki&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Pédagogie différenciée en France : Legrand en pose le cadre, Przesmycki propose une démarche (diagnostic, contrat, groupes de besoin, évaluation).&quot;, &quot;m&quot;: &quot;Pédagogie différenciée ; groupes de besoin ; contrat ; démarche&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Tomlinson&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Differentiated instruction : on différencie les contenus, les processus, les productions et l'environnement, selon le niveau de préparation, les intérêts et le profil des apprenants.&quot;, &quot;m&quot;: &quot;Contenus ; processus ; productions ; environnement&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Différenciation abaissante = baisser l'exigence ; équité ≠ égalité ; groupes de besoin temporaires.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 8, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Chantier-école : rôles (opérateur, carnetier, calculateur, contrôleur) avec rotation obligatoire.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Modèle social du handicap · CIF-OMS&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Le handicap n'est pas une propriété de la personne : il naît de l'interaction entre une déficience (altération d'une fonction) et un environnement non accessible (barrières physiques, pédagogiques, organisationnelles, attitudinales). Ce modèle, porté notamment par Oliver, s'oppose au modèle médical centré sur le « déficit à corriger ». La CIF de l'OMS (2001) en est la traduction institutionnelle : elle décrit fonctions, activités, participation et facteurs environnementaux. Pour le formateur : analyser d'abord la situation (supports, consignes, lieux, rythme) avant de chercher à normaliser l'apprenant.&quot;, &quot;m&quot;: &quot;Interaction déficience × environnement ; situation de handicap ; barrières / facilitateurs ; participation ; modèle médical vs modèle social&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;CAST — UDL&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;La Conception universelle de l'apprentissage (Rose &amp; Meyer, CAST) part du constat que la variabilité entre apprenants est la règle. Plutôt que d'ajouter des aménagements après coup, on conçoit dès le départ des parcours flexibles reposant sur trois principes : multiples moyens d'engagement (le « pourquoi » d'apprendre), de représentation (le « quoi » : formats variés de l'information) et d'action / expression (le « comment » : manières de montrer ses acquis). L'objectif est de former des apprenants experts, motivés et autonomes.&quot;, &quot;m&quot;: &quot;Engagement ; représentation ; action et expression ; variabilité ; flexibilité ; apprenant expert ; barrières du curriculum&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Booth &amp; Ainscow (2002)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;L'Index for Inclusion est un outil d'auto-évaluation et de développement des établissements. Il structure l'inclusion en trois dimensions : créer des cultures inclusives (valeurs, communauté), élaborer des politiques inclusives (organisation, soutien) et développer des pratiques inclusives (mobilisation des ressources, enseignement). L'inclusion y est un processus sans fin de réduction des obstacles à l'apprentissage et à la participation de tous, et pas seulement des élèves « à besoins particuliers ».&quot;, &quot;m&quot;: &quot;Index ; cultures – politiques – pratiques ; obstacles à l'apprentissage et à la participation ; processus continu ; valeurs partagées ; tous les apprenants&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski — défectologie&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans ses travaux sur la défectologie (années 1920-30), Vygotski distingue la déficience primaire (organique) et la déficience secondaire (conséquences sociales et culturelles, souvent plus handicapantes). L'enfant en situation de handicap se développe selon les mêmes lois que les autres, mais par des voies différentes : la compensation passe par des voies de contournement socialement médiatisées (langue des signes, braille, outils). Il faut donc s'appuyer sur les potentialités et la zone proximale de développement, et non sur le seul déficit ; il critique l'éducation séparée.&quot;, &quot;m&quot;: &quot;Compensation ; voies de contournement ; médiation sociale ; déficience primaire / secondaire ; potentialités ; ZPD&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Mace (Universal Design)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Ronald Mace, architecte (Center for Universal Design, années 1980-90), est à l'origine du design universel : concevoir produits et environnements utilisables par le plus grand nombre, sans adaptation ni conception spécialisée. Sept principes : usage équitable, flexibilité d'usage, usage simple et intuitif, information perceptible, tolérance à l'erreur, effort physique minimal, dimensions et espace adaptés. Exemple type : la rampe ou le sous-titrage qui bénéficient à tous. C'est la racine architecturale de l'UDL pédagogique.&quot;, &quot;m&quot;: &quot;Conception universelle ; usage équitable ; flexibilité ; tolérance à l'erreur ; pour tous dès la conception ; architecture&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Wolfensberger&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Wolfensberger a diffusé en Amérique du Nord le principe de normalisation (issu des pays scandinaves) puis la valorisation des rôles sociaux : offrir aux personnes en situation de handicap des conditions de vie, des lieux et des rôles sociaux valorisés, proches de ceux du plus grand nombre. Il dénonce la ségrégation en institutions et la dévalorisation sociale. C'est la racine historique de l'intégration puis de l'inclusion, même si l'inclusion actuelle va plus loin en exigeant que ce soit le système qui change.&quot;, &quot;m&quot;: &quot;Normalisation ; valorisation des rôles sociaux ; désinstitutionnalisation ; intégration ; dignité&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Intégration (l'élève s'adapte) ≠ inclusion (le dispositif change). Repères : loi-cadre 97.13 ; CDPH ratifiée en 2009.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 9, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Malentendant, signes convenus opérateur / porte-prisme ; l'adaptation porte sur l'interface, pas sur l'exigence de précision.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Huizinga (1938)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Dans Homo Ludens, le jeu précède la culture et en est un fondement : activité libre et volontaire, située hors de la vie courante, limitée dans le temps et l'espace, soumise à des règles acceptées, source de tension et de plaisir sans but utilitaire. Il introduit le « cercle magique » : l'espace-temps du jeu où les règles ordinaires sont suspendues et remplacées par celles du jeu. Pour le formateur, cela justifie de délimiter clairement la séquence ludique et d'en faire accepter les règles.&quot;, &quot;m&quot;: &quot;Homo ludens ; cercle magique ; liberté ; règles ; gratuité ; jeu et culture&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Caillois (1958)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans Les jeux et les hommes, Caillois classe les jeux en quatre catégories : agôn (compétition), alea (hasard), mimicry (simulacre, jeu de rôle) et ilinx (vertige, sensations). Ces catégories s'inscrivent sur un axe entre paidia (jeu spontané, turbulent) et ludus (jeu réglé, discipliné). Utilité pédagogique : choisir le type de jeu selon l'objectif (mimicry pour une réunion de chantier simulée, agôn pour un défi chronométré).&quot;, &quot;m&quot;: &quot;Agôn ; alea ; mimicry ; ilinx ; paidia / ludus ; typologie des jeux&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Deterding et al. (2011)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Ils définissent la gamification comme l'usage d'éléments de design de jeu dans des contextes non ludiques. Ils distinguent la gamification (éléments isolés : points, badges, classements) du serious game (jeu complet à finalité sérieuse). Une gamification superficielle, sans lien avec les objectifs, risque de n'activer que la motivation extrinsèque.&quot;, &quot;m&quot;: &quot;Gamification ; éléments de jeu ; contexte non ludique ; points – badges – classements ; serious game&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Csíkszentmihályi (1990)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Théorie du flow : état d'absorption et de plaisir dans une activité, atteint lorsque le défi perçu est en équilibre avec l'habileté perçue. Trop de défi provoque anxiété, trop peu provoque ennui. Conditions : buts clairs, retour d'information immédiat, concentration. En formation : calibrer la difficulté et la faire évoluer avec la progression de l'apprenant.&quot;, &quot;m&quot;: &quot;Flow ; expérience optimale ; équilibre défi / habileté ; feedback immédiat ; buts clairs ; anxiété / ennui&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Deci &amp; Ryan&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Théorie de l'autodétermination : la motivation intrinsèque se nourrit de trois besoins, l'autonomie, la compétence et l'affiliation. Les récompenses externes perçues comme contrôlantes peuvent la réduire : c'est l'effet de surjustification. Un jeu efficace soutient ces besoins (choix, progression visible, travail en équipe) plutôt que de reposer sur des récompenses seules.&quot;, &quot;m&quot;: &quot;Motivation intrinsèque / extrinsèque ; autodétermination ; autonomie – compétence – affiliation ; surjustification&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Vygotski&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Le jeu crée une zone proximale de développement : dans une situation ludique, avec règles et rôles, l'apprenant agit au-delà de son niveau habituel, soutenu par la situation imaginaire, les pairs et la médiation de l'adulte. Le jeu de rôle devient ainsi un moyen d'expérimenter des conduites professionnelles avant de les assumer en situation réelle.&quot;, &quot;m&quot;: &quot;ZPD ; jeu ; situation imaginaire ; règles ; médiation ; développement&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Bandura&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Théorie sociale cognitive : on apprend en observant des modèles (apprentissage vicariant). Le jeu de rôle et la simulation permettent d'observer, de reproduire et de renforcer des comportements, avec effet sur le sentiment d'auto-efficacité. Le formateur doit donc soigner la qualité du modèle montré et le retour fait après la scène.&quot;, &quot;m&quot;: &quot;Apprentissage vicariant ; modélisation ; observation ; jeu de rôle ; auto-efficacité&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Brougère&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Pour Brougère, le jeu est une activité de second degré, un cadre où les participants décident et où l'on fait « pour de faux » ; il produit une culture ludique. Il refuse l'idée d'un apprentissage automatique : l'effet éducatif dépend du cadre, de la médiation et du lien avec les objectifs (paradoxe du jeu éducatif). Ce qui est appris doit être explicité après le jeu.&quot;, &quot;m&quot;: &quot;Culture ludique ; second degré ; cadre de jeu ; décision ; jeu éducatif ; médiation&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Jeu sans débriefing = divertissement ; gamification superficielle (points, badges) = motivation extrinsèque.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 10, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Escape game d'implantation chronométré ; jeu de rôle « réunion de chantier » ; serious game sécurité.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Schön (1983)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Dans The Reflective Practitioner, Schön critique la rationalité technique (appliquer des savoirs scientifiques à des problèmes bien définis). La pratique réelle comporte des zones indéterminées : incertitude, singularité, conflits de valeurs. Le praticien réflexif mobilise un savoir tacite dans l'action, dialogue avec la situation (réflexion dans l'action) et analyse ensuite ce qu'il a fait (réflexion sur l'action).&quot;, &quot;m&quot;: &quot;Praticien réflexif ; rationalité technique ; zones indéterminées ; réflexion dans / sur l'action ; savoir tacite&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Argyris &amp; Schön&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Ils distinguent l'apprentissage en simple boucle (corriger l'action sans changer les valeurs qui la gouvernent) et en double boucle (interroger les finalités, les présupposés et les valeurs). Ils opposent aussi théories professées (ce que l'on dit faire) et théories d'usage (ce que l'on fait réellement). La réflexivité vise l'écart entre les deux.&quot;, &quot;m&quot;: &quot;Simple / double boucle ; théorie professée / théorie d'usage ; présupposés ; finalités ; routines défensives&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Perrenoud (2001)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans Développer la pratique réflexive dans le métier d'enseignant, Perrenoud fait de la réflexivité une posture durable, un habitus professionnel, et non une réflexion occasionnelle après un échec. Elle s'apprend par l'analyse de pratiques et la formation, et suppose un cadre sûr. Il distingue réfléchir dans l'action et sur l'action et précise que ce n'est pas se critiquer soi-même.&quot;, &quot;m&quot;: &quot;Pratique réflexive ; habitus ; posture durable ; analyse de pratiques ; professionnalisation ; métier&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kolb&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Le cycle de l'apprentissage expérientiel comprend quatre moments : expérience concrète, observation réfléchie, conceptualisation abstraite, expérimentation active. L'expérience seule n'apprend pas : elle doit être analysée puis réinvestie. La séance du formateur est une expérience à réfléchir, ce qui conduit à la reprendre avec un objectif d'amélioration.&quot;, &quot;m&quot;: &quot;Apprentissage expérientiel ; cycle de Kolb ; observation réfléchie ; conceptualisation ; expérimentation active&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Wenger (1998)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Wenger voit l'apprentissage comme un phénomène social de participation à une communauté de pratique, définie par trois dimensions : engagement mutuel, entreprise commune et répertoire partagé (outils, routines, langage). Apprendre, c'est aussi devenir quelqu'un : la communauté soutient l'identité et le développement professionnel collectif, par exemple via l'échange entre pairs formateurs.&quot;, &quot;m&quot;: &quot;Communauté de pratique ; engagement mutuel ; entreprise commune ; répertoire partagé ; participation ; identité&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Wittorski&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Wittorski étudie la professionnalisation comme processus liant actions, apprentissages et construction de l'identité professionnelle. Il décrit plusieurs logiques de professionnalisation (logique de l'action, de la réflexion sur l'action, de l'intégration- assimilation) et montre que l'analyse des pratiques et la reconnaissance par le collectif transforment l'identité.&quot;, &quot;m&quot;: &quot;Professionnalisation ; identité professionnelle ; logiques de professionnalisation ; analyse de pratiques ; reconnaissance&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Paquay · Altet&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans la lignée de Former des enseignants professionnels (Paquay, Altet, Charlier, Perrenoud), ils défendent le paradigme du praticien réflexif et l'analyse de pratiques comme dispositif de formation du formateur professionnel, appuyé sur un référentiel de compétences et sur l'articulation entre théorie et terrain.&quot;, &quot;m&quot;: &quot;Formateur professionnel ; analyse de pratiques ; praticien réflexif ; référentiel de compétences ; professionnalité&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Dewey&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Racine de la pensée réflexive : pour Dewey (How We Think, 1910), réfléchir est un examen actif et persistant d'une croyance à la lumière de ses fondements et de ses conséquences. Elle naît d'une situation problématique ou d'un doute, et demande ouverture d'esprit et responsabilité. L'éducation relie expérience et réflexion (Expérience et éducation, 1938).&quot;, &quot;m&quot;: &quot;Pensée réflexive ; situation problématique ; doute ; enquête ; expérience ; ouverture d'esprit&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Réflexion DANS l'action (temps réel) ≠ SUR l'action (après coup). Réflexivité ≠ autodépréciation.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 11, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Journal de bord, auto-vidéoscopie, observation croisée entre pairs avec un focus unique.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Weber (1919)&quot;, &quot;f&quot;: true, &quot;i&quot;: &quot;Dans Le savant et le politique, Weber oppose l'éthique de conviction (agir selon des principes, quelles que soient les conséquences) et l'éthique de responsabilité (assumer les conséquences prévisibles de ses actes). Les deux ne s'excluent pas : une personne mature les combine. Il défend aussi la neutralité axiologique de l'enseignant : ne pas imposer ses valeurs sous couvert de savoir.&quot;, &quot;m&quot;: &quot;Éthique de conviction ; éthique de responsabilité ; conséquences prévisibles ; neutralité axiologique ; vocation&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Ricœur (1990)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans Soi-même comme un autre, Ricœur définit la visée éthique comme « la vie bonne, avec et pour autrui, dans des institutions justes » : estime de soi, sollicitude envers autrui et sens de la justice. Il distingue l'éthique (visée du bien) de la morale (normes, obligations). Quand les normes entrent en conflit, la sagesse pratique permet de juger en situation.&quot;, &quot;m&quot;: &quot;Visée éthique ; vie bonne ; sollicitude ; institutions justes ; estime de soi ; sagesse pratique&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Prairat&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Prairat distingue la déontologie, ensemble de devoirs et de règles professionnelles prescrites (codes, chartes), et l'éthique, qui relève de la délibération et du jugement face aux situations singulières. Les deux sont nécessaires : la règle protège et cadre, l'éthique interroge le sens et la juste manière d'agir dans le métier d'enseigner.&quot;, &quot;m&quot;: &quot;Déontologie enseignante ; éthique professionnelle ; devoirs ; règles ; délibération ; responsabilité&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kohlberg&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Kohlberg décrit le développement du jugement moral en trois niveaux (préconventionnel, conventionnel, postconventionnel) et six stades. Le jugement progresse en discutant des dilemmes moraux (dilemme de Heinz) où des principes entrent en conflit. En formation : proposer des dilemmes de métier pour faire argumenter, plutôt que d'imposer une réponse.&quot;, &quot;m&quot;: &quot;Dilemme moral ; stades ; niveaux pré- / conventionnel / post-conventionnel ; jugement moral ; justice&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Jonas (1979)&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dans Le principe responsabilité, Jonas propose une éthique adaptée à la civilisation technologique, dont les actions ont des effets durables et irréversibles. Il pose un devoir de responsabilité envers les générations futures et de la nature, avec une heuristique de la peur : en cas d'incertitude, donner priorité à la prévision du pire. Transposable aux enjeux fonciers et environnementaux.&quot;, &quot;m&quot;: &quot;Principe responsabilité ; générations futures ; heuristique de la peur ; civilisation technologique ; précaution&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Kant · Aristote&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Deux racines de l'éthique. Kant : éthique du devoir (déontologique), fondée sur l'impératif catégorique, c'est-à-dire une règle universalisable qui traite l'humanité comme une fin et jamais seulement comme un moyen. Aristote (Éthique à Nicomaque) : éthique de la vertu, où l'on vise le bonheur (eudaimonia) par l'habitude des vertus, guidée par la prudence (phronèsis) et le juste milieu.&quot;, &quot;m&quot;: &quot;Devoir ; impératif catégorique ; universalisation ; vertu ; phronèsis ; juste milieu ; eudaimonia&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;a&quot;, &quot;a&quot;: &quot;Cadre juridique&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Repères marocains pour la posture éthique : la loi 54-19 (Charte des services publics, 2021) fixe des principes comme l'égalité, la neutralité, la transparence, l'intégrité et la reddition des comptes ; la Constitution de 2011 consacre la bonne gouvernance et l'obligation de rendre compte ; la loi 09-08 protège les données personnelles (consentement, finalité, confidentialité). Le formateur y applique neutralité, équité et confidentialité des données des stagiaires.&quot;, &quot;m&quot;: &quot;Service public ; neutralité ; égalité ; reddition des comptes ; données personnelles ; confidentialité (loi 09-08)&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;p&quot;, &quot;a&quot;: &quot;Piège QCM&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;La déontologie prescrit, l'éthique délibère. Neutralité ≠ indifférence : neutre sur les opinions, intransigeant sur les normes et la sécurité.&quot;, &quot;m&quot;: &quot;&quot;}, {&quot;t&quot;: 12, &quot;k&quot;: &quot;x&quot;, &quot;a&quot;: &quot;Terrain topo&quot;, &quot;f&quot;: false, &quot;i&quot;: &quot;Dilemmes : « arrondir » une limite, sauter un contrôle de fermeture, valider une implantation non vérifiée.&quot;, &quot;m&quot;: &quot;&quot;}], &quot;themes&quot;: [{&quot;n&quot;: 1, &quot;titre&quot;: &quot;Métacognition appliquée au geste professionnel&quot;, &quot;bloc&quot;: &quot;Bloc 1&quot;}, {&quot;n&quot;: 2, &quot;titre&quot;: &quot;Gestion de la charge cognitive (technique / gestuel)&quot;, &quot;bloc&quot;: &quot;Bloc 1&quot;}, {&quot;n&quot;: 3, &quot;titre&quot;: &quot;Questionnement pour l'analyse de pratique professionnelle&quot;, &quot;bloc&quot;: &quot;Bloc 1&quot;}, {&quot;n&quot;: 4, &quot;titre&quot;: &quot;Alignement pédagogique orienté compétences (APC)&quot;, &quot;bloc&quot;: &quot;Bloc 2&quot;}, {&quot;n&quot;: 5, &quot;titre&quot;: &quot;Scénarisation articulant théorie et pratique&quot;, &quot;bloc&quot;: &quot;Bloc 2&quot;}, {&quot;n&quot;: 6, &quot;titre&quot;: &quot;Transfert des apprentissages vers le poste de travail&quot;, &quot;bloc&quot;: &quot;Bloc 2&quot;}, {&quot;n&quot;: 7, &quot;titre&quot;: &quot;Andragogie et posture du formateur face aux adultes&quot;, &quot;bloc&quot;: &quot;Bloc 3&quot;}, {&quot;n&quot;: 8, &quot;titre&quot;: &quot;Différenciation pédagogique face à l'hétérogénéité&quot;, &quot;bloc&quot;: &quot;Bloc 3&quot;}, {&quot;n&quot;: 9, &quot;titre&quot;: &quot;Inclusion et accessibilité en formation professionnelle&quot;, &quot;bloc&quot;: &quot;Bloc 3&quot;}, {&quot;n&quot;: 10, &quot;titre&quot;: &quot;Ludopédagogie (compétences comportementales et techniques)&quot;, &quot;bloc&quot;: &quot;Bloc 3&quot;}, {&quot;n&quot;: 11, &quot;titre&quot;: &quot;Posture réflexive du formateur sur sa pratique&quot;, &quot;bloc&quot;: &quot;Bloc 4&quot;}, {&quot;n&quot;: 12, &quot;titre&quot;: &quot;Neutralité et posture éthique du formateur&quot;, &quot;bloc&quot;: &quot;Bloc 4&quot;}]};
var CARDS=DATA.cards, THEMES=DATA.themes;
CARDS.forEach(function(c,i){c.id=c.t+&quot;|&quot;+c.k+&quot;|&quot;+c.a;});

var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&amp;<>&quot;']/g,function(c){return {&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;<&quot;:&quot;&amp;lt;&quot;,&quot;>&quot;:&quot;&amp;gt;&quot;,'&quot;':&quot;&amp;quot;&quot;,&quot;'&quot;:&quot;&amp;#39;&quot;}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function theme(n){return THEMES.filter(function(t){return t.n===n;})[0];}

/* Sauvegarde locale (facultative) */
var KEY=&quot;ofppt_flash_v1&quot;, SAVED={};
try{SAVED=JSON.parse(localStorage.getItem(KEY)||&quot;{}&quot;)||{};}catch(e){SAVED={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVED));}catch(e){}}

var S={sel:0,mix:true,extra:true,reverse:false,onlyReview:false,deck:[],i:0,back:false,known:0,review:0,marks:{},view:&quot;home&quot;};

function setP(p){$(&quot;#pfill&quot;).style.width=p+&quot;%&quot;;$(&quot;#pbar&quot;).setAttribute(&quot;aria-valuenow&quot;,Math.round(p));}
function setLive(on){var l=$(&quot;#live&quot;);l.classList.toggle(&quot;on&quot;,on);document.body.classList.toggle(&quot;inq&quot;,on);
  if(on){$(&quot;#lk&quot;).textContent=&quot;✓ &quot;+S.known;$(&quot;#lr&quot;).textContent=&quot;↻ &quot;+S.review;$(&quot;#lp&quot;).textContent=(S.i+1)+&quot; / &quot;+S.deck.length;}}

function counts(n){
  var a=CARDS.filter(function(c){return (n===0||c.t===n)&amp;&amp;c.k===&quot;a&quot;;}).length;
  var e=CARDS.filter(function(c){return (n===0||c.t===n)&amp;&amp;c.k!==&quot;a&quot;;}).length;
  return {a:a,e:e};
}
function nSaved(st){return CARDS.filter(function(c){return SAVED[c.id]===st;}).length;}

function home(){
  S.view=&quot;home&quot;;setP(0);setLive(false);
  var c=counts(0), kn=nSaved(&quot;k&quot;), rv=nSaved(&quot;r&quot;);
  var h='<section class=&quot;panel&quot;><span class=&quot;kicker&quot;>Concours de promotion interne · OFPPT</span>'+
   '<h1>Flashcards : tous les auteurs des 12 thématiques</h1>'+
   '<p class=&quot;sub&quot;>Une fiche par auteur, avec ses idées centrales et ses mots-clés, tirées du référentiel. Retournez la carte, puis dites si vous la saviez.</p>'+
   '<div class=&quot;stats&quot;><div class=&quot;stat&quot;><b>'+c.a+'</b><span>fiches auteurs</span></div><div class=&quot;stat&quot;><b>'+c.e+'</b><span>cartes pièges et terrain</span></div>'+
   '<div class=&quot;stat&quot;><b>'+kn+'</b><span>maîtrisées</span></div><div class=&quot;stat&quot;><b>'+rv+'</b><span>à revoir</span></div></div>'+
   '<h2>1. Thématique</h2><div class=&quot;themes&quot; role=&quot;radiogroup&quot; aria-label=&quot;Thématique&quot;>'+tb(0,&quot;Toutes les thématiques&quot;,&quot;Paquet complet&quot;,c.a+c.e,true);
  THEMES.forEach(function(t){var k=counts(t.n);h+=tb(t.n,&quot;N°&quot;+t.n+&quot; — &quot;+t.titre,t.bloc,k.a+k.e,false);});
  h+='</div><h2>2. Options</h2><div class=&quot;opts&quot;>'+
   '<label class=&quot;opt&quot;><input type=&quot;checkbox&quot; id=&quot;oMix&quot;><span>Mélanger les cartes</span></label>'+
   '<label class=&quot;opt&quot;><input type=&quot;checkbox&quot; id=&quot;oExtra&quot;><span>Inclure les cartes « Piège QCM » et « Terrain topo »</span></label>'+
   '<label class=&quot;opt&quot;><input type=&quot;checkbox&quot; id=&quot;oRev&quot;><span>Mode inversé : lire les idées, retrouver l\'auteur<small>Plus difficile, plus proche d\'un QCM.</small></span></label>'+
   '<label class=&quot;opt&quot;><input type=&quot;checkbox&quot; id=&quot;oOnly&quot;><span>Seulement les cartes « à revoir » ou jamais vues<small>Cache les cartes déjà maîtrisées.</small></span></label></div>'+
   '<div class=&quot;actions&quot;><button class=&quot;btn btn-p btn-lg&quot; id=&quot;go&quot;>Commencer</button></div>'+
   '<button class=&quot;muted-link&quot; id=&quot;reset&quot;>Réinitialiser ma progression</button></section>';
  $(&quot;#app&quot;).innerHTML=h;
  $(&quot;#oMix&quot;).checked=S.mix;$(&quot;#oExtra&quot;).checked=S.extra;$(&quot;#oRev&quot;).checked=S.reverse;$(&quot;#oOnly&quot;).checked=S.onlyReview;
  document.querySelectorAll(&quot;.th&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){
    S.sel=parseInt(b.getAttribute(&quot;data-n&quot;),10);
    document.querySelectorAll(&quot;.th&quot;).forEach(function(x){var on=+x.getAttribute(&quot;data-n&quot;)===S.sel;x.setAttribute(&quot;aria-checked&quot;,on);x.querySelector(&quot;.c&quot;).textContent=on?&quot;✓&quot;:&quot;&quot;;});});});
  $(&quot;#oMix&quot;).onchange=function(e){S.mix=e.target.checked;};
  $(&quot;#oExtra&quot;).onchange=function(e){S.extra=e.target.checked;};
  $(&quot;#oRev&quot;).onchange=function(e){S.reverse=e.target.checked;};
  $(&quot;#oOnly&quot;).onchange=function(e){S.onlyReview=e.target.checked;};
  $(&quot;#go&quot;).onclick=start;
  $(&quot;#reset&quot;).onclick=function(){if(confirm(&quot;Effacer toute votre progression ?&quot;)){SAVED={};save();home();}};
  window.scrollTo(0,0);
}
function tb(n,t,sub,count,all){var on=S.sel===n;
  return '<button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;th'+(all?' all':'')+'&quot; data-n=&quot;'+n+'&quot; aria-checked=&quot;'+on+'&quot;><span class=&quot;c&quot; aria-hidden=&quot;true&quot;>'+(on?&quot;✓&quot;:&quot;&quot;)+'</span><span class=&quot;b&quot;>'+esc(all?&quot;Paquet complet&quot;:sub)+'</span><span class=&quot;t&quot;>'+esc(t)+'</span><span class=&quot;n&quot;>'+count+' cartes</span></button>';}

function start(){
  var d=CARDS.filter(function(c){
    if(S.sel!==0&amp;&amp;c.t!==S.sel)return false;
    if((S.reverse||!S.extra)&amp;&amp;c.k!==&quot;a&quot;)return false;
    if(S.onlyReview&amp;&amp;SAVED[c.id]===&quot;k&quot;)return false;
    return true;});
  if(!d.length){alert(&quot;Aucune carte ne correspond à ces options (tout est déjà maîtrisé ?). Décochez « Seulement à revoir ».&quot;);return;}
  begin(S.mix?shuffle(d):d);
}
function begin(d){S.deck=d;S.i=0;S.back=false;S.known=0;S.review=0;S.marks={};show();}

function chips(m){return m.split(/\s*;\s*/).filter(Boolean).map(function(x){return '<span class=&quot;chip&quot;>'+esc(x)+'</span>';}).join(&quot;&quot;);}

function show(){
  S.view=&quot;card&quot;;S.back=false;
  var c=S.deck[S.i], th=theme(c.t), rev=S.reverse&amp;&amp;c.k===&quot;a&quot;;
  setLive(true);setP(S.i/S.deck.length*100);
  var front,back;
  var tag='<div class=&quot;tag&quot;>Thématique '+th.n+' · '+esc(th.titre)+'</div>';
  if(c.k===&quot;a&quot;&amp;&amp;!rev){
    front='<div class=&quot;tag&quot;>N°'+th.n+' · '+esc(th.bloc)+'</div><div class=&quot;name&quot;>'+esc(c.a)+'</div>'+(c.f?'<span class=&quot;fond&quot;>★ Auteur fondateur</span>':'')+'<div class=&quot;hint&quot;>Que dit cet auteur ? Touchez la carte pour la retourner</div>';
    back=tag+'<h3>'+esc(c.a)+(c.f?' ★':'')+'</h3><div class=&quot;lbl&quot;>Idées centrales</div><p class=&quot;idees&quot;>'+esc(c.i)+'</p><div class=&quot;lbl&quot;>Mots-clés</div><div class=&quot;chips&quot;>'+chips(c.m)+'</div>';
  }else if(c.k===&quot;a&quot;&amp;&amp;rev){
    front='<div class=&quot;tag&quot;>N°'+th.n+' · Qui est-ce ?</div><p class=&quot;qtext&quot;>'+esc(c.i)+'</p><div class=&quot;hint&quot;>Retrouvez l\'auteur, puis retournez la carte</div>';
    back=tag+'<div class=&quot;lbl&quot;>Auteur</div><h3 style=&quot;font-size:1.6rem&quot;>'+esc(c.a)+(c.f?' ★':'')+'</h3><div class=&quot;lbl&quot;>Mots-clés</div><div class=&quot;chips&quot;>'+chips(c.m)+'</div>';
  }else{
    var lab=c.k===&quot;p&quot;?&quot;Piège QCM&quot;:&quot;Terrain topo&quot;;
    front='<div class=&quot;tag&quot;>Thématique '+th.n+' · '+esc(th.titre)+'</div><div class=&quot;name&quot;>'+lab+'</div><div class=&quot;hint&quot;>Touchez la carte pour la retourner</div>';
    back='<div class=&quot;tag&quot;>Thématique '+th.n+'</div><h3>'+lab+'</h3><p class=&quot;idees&quot;>'+esc(c.i)+'</p>';
  }
  var h='<div class=&quot;deckhead&quot;><span class=&quot;badge&quot;>'+(rev?'Mode inversé':'Thématique '+th.n)+'</span><span class=&quot;cnt&quot;>Carte '+(S.i+1)+' sur '+S.deck.length+'</span></div>'+
   '<div class=&quot;scene&quot;><button class=&quot;flip&quot; id=&quot;flip&quot; aria-label=&quot;Retourner la carte&quot; aria-pressed=&quot;false&quot;><div class=&quot;face front&quot; aria-hidden=&quot;false&quot;>'+front+'</div><div class=&quot;face back&quot; aria-hidden=&quot;true&quot;>'+back+'</div></button></div>'+
   '<div class=&quot;rate hidden&quot; id=&quot;rate&quot;><button class=&quot;btn btn-ko&quot; id=&quot;bR&quot;>↻ À revoir</button><button class=&quot;btn btn-ok&quot; id=&quot;bK&quot;>✓ Je savais</button></div>'+
   '<div class=&quot;nav&quot;><button class=&quot;btn btn-g&quot; id=&quot;bP&quot;'+(S.i===0?' disabled':'')+'>← Précédente</button><button class=&quot;btn btn-g&quot; id=&quot;bQ&quot;>Quitter</button><button class=&quot;btn btn-g&quot; id=&quot;bN&quot;>Passer →</button></div>'+
   '<div class=&quot;kbd&quot;><kbd>Espace</kbd> retourner · <kbd>1</kbd> à revoir · <kbd>2</kbd> je savais · <kbd>←</kbd> <kbd>→</kbd> naviguer</div>';
  $(&quot;#app&quot;).innerHTML=h;
  $(&quot;#flip&quot;).onclick=flip;$(&quot;#bK&quot;).onclick=function(){mark(&quot;k&quot;);};$(&quot;#bR&quot;).onclick=function(){mark(&quot;r&quot;);};
  $(&quot;#bP&quot;).onclick=prev;$(&quot;#bN&quot;).onclick=skip;$(&quot;#bQ&quot;).onclick=function(){if(confirm(&quot;Quitter ce paquet ?&quot;))end();};
  var pr=S.marks[S.i]; if(pr){/* déjà noté */}
  window.scrollTo(0,0);
}
function flip(){
  S.back=!S.back;
  var f=$(&quot;#flip&quot;);f.classList.toggle(&quot;is-back&quot;,S.back);f.setAttribute(&quot;aria-pressed&quot;,S.back);
  f.querySelector(&quot;.front&quot;).setAttribute(&quot;aria-hidden&quot;,S.back);f.querySelector(&quot;.back&quot;).setAttribute(&quot;aria-hidden&quot;,!S.back);
  $(&quot;#rate&quot;).classList.toggle(&quot;hidden&quot;,!S.back);
}
function mark(st){
  var c=S.deck[S.i];SAVED[c.id]=st;save();
  var old=S.marks[S.i];
  if(old===&quot;k&quot;)S.known--;if(old===&quot;r&quot;)S.review--;
  S.marks[S.i]=st;if(st===&quot;k&quot;)S.known++;else S.review++;
  advance();
}
function skip(){advance();}
function advance(){if(S.i+1<S.deck.length){S.i++;show();}else end();}
function prev(){if(S.i>0){S.i--;show();}}

function end(){
  S.view=&quot;end&quot;;setLive(false);setP(100);
  var done=S.known+S.review, pct=done?Math.round(S.known/done*100):0;
  var rv=S.deck.filter(function(c,i){return S.marks[i]===&quot;r&quot;;});
  var skipped=S.deck.length-done;
  var h='<section class=&quot;panel res&quot;><span class=&quot;kicker&quot;>Paquet terminé</span><div class=&quot;ring&quot; style=&quot;--p:'+pct+'&quot;><i><b>'+pct+'%</b><span>'+S.known+' / '+done+'</span></i></div>'+
   '<h1>'+S.known+' maîtrisée'+(S.known>1?'s':'')+', '+S.review+' à revoir</h1>'+
   '<p class=&quot;sub&quot;>'+(skipped>0?skipped+' carte'+(skipped>1?'s':'')+' passée'+(skipped>1?'s':'')+' sans notation. ':'')+(S.review?'Refaites les cartes difficiles jusqu\'à ce qu\'elles tombent à zéro.':'Excellent : tout ce paquet est maîtrisé.')+'</p>'+
   '<div class=&quot;actions&quot;>'+(rv.length?'<button class=&quot;btn btn-p&quot; id=&quot;eR&quot;>Refaire les '+rv.length+' à revoir</button>':'')+'<button class=&quot;btn btn-g&quot; id=&quot;eA&quot;>Recommencer ce paquet</button><button class=&quot;btn btn-g&quot; id=&quot;eH&quot;>Accueil</button></div></section>';
  $(&quot;#app&quot;).innerHTML=h;
  var r=$(&quot;#eR&quot;);if(r)r.onclick=function(){begin(shuffle(rv));};
  $(&quot;#eA&quot;).onclick=function(){begin(S.mix?shuffle(S.deck):S.deck);};
  $(&quot;#eH&quot;).onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener(&quot;keydown&quot;,function(e){
  if(S.view!==&quot;card&quot;||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(k===&quot; &quot;||k===&quot;Enter&quot;){ if(e.target&amp;&amp;e.target.id===&quot;flip&quot;)return; if(e.target&amp;&amp;e.target.tagName===&quot;BUTTON&quot;&amp;&amp;e.target.id!==&quot;flip&quot;)return; e.preventDefault();flip();}
  else if(k===&quot;ArrowRight&quot;){e.preventDefault();skip();}
  else if(k===&quot;ArrowLeft&quot;){e.preventDefault();prev();}
  else if(k===&quot;1&quot;&amp;&amp;S.back){mark(&quot;r&quot;);}
  else if(k===&quot;2&quot;&amp;&amp;S.back){mark(&quot;k&quot;);}
});
/* Balayage tactile */
(function(){var x0=null;
  document.addEventListener(&quot;touchstart&quot;,function(e){x0=e.touches[0].clientX;},{passive:true});
  document.addEventListener(&quot;touchend&quot;,function(e){if(x0===null||S.view!==&quot;card&quot;)return;var dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>80){dx<0?skip():prev();}},{passive:true});})();

<script>
(function(){
  var V=["qcm","flash","ped","q120"];
  function show(v,focus){
    if(V.indexOf(v)<0)v="qcm";
    V.forEach(function(k){
      document.getElementById("f-"+k).classList.toggle("on",k===v);
      document.getElementById("t-"+k).setAttribute("aria-selected",k===v);
    });
    try{history.replaceState(null,"","#"+v);}catch(e){}
    if(focus){try{document.getElementById("f-"+v).contentWindow.focus();}catch(e){}}
  }
  document.querySelectorAll("[data-v]").forEach(function(b){b.addEventListener("click",function(){show(b.getAttribute("data-v"),true);});});
  window.addEventListener("hashchange",function(){show(location.hash.slice(1));});
  show(location.hash.slice(1)||"qcm");
})();
