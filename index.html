<script>
&quot;use strict&quot;;
/* ============ DONNÉES ============ */
const QUESTIONS=[];
function Q(t,a,q,ok,bad,ex){QUESTIONS.push({t:t,a:a,q:q,ok:ok,bad:bad,ex:ex});}

/* ===== THÉMATIQUES 1 à 6 ===== */

/* --- T1 : Métacognition --- */
Q(1,[&quot;Flavell&quot;],`Quel auteur est considéré comme le fondateur du concept de métacognition (1976-79) ?`,
 `Flavell`,[`Brown`,`Piaget`,`Zimmerman`],
 `Flavell définit la métacognition comme la connaissance que l'on a de ses propres processus cognitifs et le contrôle que l'on exerce sur eux. Il distingue les connaissances métacognitives (sur la personne, la tâche, les stratégies) et les expériences métacognitives. Mot-clé : « penser sur sa propre pensée ».`);
Q(1,[&quot;Flavell&quot;],`Chez Flavell, que désigne l'expression « expériences métacognitives » ?`,
 `Les sentiments conscients éprouvés pendant la tâche (ex. : « je ne comprends pas »)`,
 [`Les connaissances stockées sur les stratégies efficaces`,`Les épreuves d'évaluation passées en fin de formation`,`Les routines automatisées à force d'entraînement`],
 `Les expériences métacognitives sont des ressentis conscients pendant l'action. Elles s'opposent aux connaissances métacognitives, qui portent sur la personne, la tâche et les stratégies.`);
Q(1,[&quot;Brown&quot;],`Quel auteur (1978) met l'accent sur la régulation (planifier, contrôler, évaluer, réviser) et montre que les experts régulent mieux que les novices ?`,
 `Brown`,[`Flavell`,`Nelson &amp; Narens`,`Schraw &amp; Dennison`],
 `Brown oppose la connaissance de la cognition à la régulation de la cognition. Mots-clés : régulation métacognitive ; planifier – contrôler – évaluer ; contrôle exécutif.`);
Q(1,[&quot;Nelson &amp; Narens&quot;],`Quel modèle distingue un « niveau objet » (la tâche en cours) et un « niveau méta » reliés par le monitoring et le contrôle ?`,
 `Nelson &amp; Narens (1990)`,[`Schraw &amp; Dennison (1994)`,`Zimmerman (années 1990-2000)`,`Baddeley &amp; Hitch (1974)`],
 `Nelson &amp; Narens proposent un modèle à deux niveaux. L'information remonte par le monitoring (évaluer où j'en suis) et la décision redescend par le contrôle (poursuivre, relire, changer de stratégie).`);
Q(1,[&quot;Nelson &amp; Narens&quot;],`Dans le modèle de Nelson &amp; Narens, comment l'information circule-t-elle du niveau objet vers le niveau méta ?`,
 `Par le monitoring`,[`Par le contrôle`,`Par l'internalisation`,`Par l'abstraction réfléchissante`],
 `Monitoring = remontée d'information (évaluer où j'en suis). Contrôle = descente de la décision (poursuivre, relire, changer de stratégie). Mnémo : monitoring monte, contrôle descend.`);
Q(1,[&quot;Schraw &amp; Dennison&quot;],`Qui a conçu le MAI (Metacognitive Awareness Inventory), outil d'auto-évaluation de la métacognition ?`,
 `Schraw &amp; Dennison (1994)`,[`Flavell &amp; Brown`,`Paas`,`Kirkpatrick`],
 `Le MAI de Schraw &amp; Dennison mesure deux composantes : la connaissance de la cognition (déclarative, procédurale, conditionnelle) et la régulation (planification, gestion de l'information, débogage, évaluation).`);
Q(1,[&quot;Schraw &amp; Dennison&quot;],`Quelles sont les deux composantes du MAI ?`,
 `La connaissance de la cognition et la régulation de la cognition`,
 [`Le niveau objet et le niveau méta`,`L'anticipation et l'auto-réflexion`,`La charge intrinsèque et la charge extrinsèque`],
 `Le MAI combine connaissance (savoir déclaratif, procédural, conditionnel) et régulation (planification, gestion de l'information, débogage, évaluation).`);
Q(1,[&quot;Zimmerman&quot;],`Quel auteur décrit l'apprentissage autorégulé en trois phases cycliques : anticipation, contrôle volitionnel, auto-réflexion ?`,
 `Zimmerman`,[`Bandura`,`Brown`,`Pastré`],
 `Chez Zimmerman, la phase d'anticipation (analyse de la tâche, buts, auto-efficacité) précède le contrôle volitionnel (autocontrôle, auto-observation) puis l'auto-réflexion (auto-jugement, attributions). L'apprenant boucle ensuite sur la tâche suivante.`);
Q(1,[&quot;Vygotski&quot;],`Quel auteur explique que le langage extériorisé devient langage intérieur, instrument de planification et de contrôle de l'action (d'où l'intérêt de faire verbaliser le geste) ?`,
 `Vygotski`,[`Piaget`,`Bandura`,`Vermersch`],
 `Pour Vygotski, faire verbaliser le geste à voix haute aide l'apprenant à l'organiser et à le réguler. Mots-clés : langage intérieur, internalisation, médiation, verbalisation.`);
Q(1,[&quot;Bandura&quot;],`Quel auteur montre que l'auto-observation du geste, suivie d'un auto-jugement, nourrit le sentiment d'auto-efficacité et la persévérance ?`,
 `Bandura`,[`Piaget`,`Brown`,`Vygotski`],
 `Chez Bandura, une observation guidée (grille, vidéo) renforce la boucle auto-observation → auto-jugement → auto-efficacité, qui soutient les buts fixés et la persévérance.`);
Q(1,[&quot;Piaget&quot;],`« Réussir n'est pas comprendre » : quel auteur affirme que la prise de conscience se construit par abstraction réfléchissante ?`,
 `Piaget`,[`Vygotski`,`Flavell`,`Bruner`],
 `Pour Piaget, la réussite pratique précède la compréhension conceptuelle. La prise de conscience se construit en revenant sur ses propres actions pour en extraire les coordinations.`);
Q(1,[&quot;Vermersch&quot;],`Quel auteur affirme que l'entretien d'explicitation donne accès au vécu de l'action, en bonne partie implicite ?`,
 `Vermersch`,[`Pastré`,`Schön`,`Clot`],
 `Vermersch : explicitation, vécu de l'action, implicite. À ne pas confondre avec Pastré, pour qui la conceptualisation se fait dans l'action même.`);
Q(1,[&quot;Pastré&quot;],`Quel auteur soutient que la conceptualisation se fait dans l'action même et que le geste repose sur une structure conceptuelle de la situation ?`,
 `Pastré`,[`Vermersch`,`Piaget`,`Schön`],
 `Pastré (didactique professionnelle) : la structure conceptuelle de la situation organise le geste et peut être rendue explicite.`);
Q(1,[&quot;Flavell&quot;,&quot;Brown&quot;],`Piège classique : quelle distinction correcte entre Flavell et Brown ?`,
 `Flavell définit le concept de métacognition ; Brown insiste sur la régulation`,
 [`Brown définit le concept ; Flavell insiste sur la régulation`,`Flavell a créé le MAI ; Brown a créé le modèle à deux niveaux`,`Les deux ne s'intéressent qu'à la mémoire de travail`],
 `Flavell = fondateur, définition du concept. Brown = régulation (planifier, contrôler, évaluer). Ne jamais les inverser.`);
Q(1,[&quot;Zimmerman&quot;,&quot;Brown&quot;],`Terrain topo : avant d'enregistrer une station, le stagiaire énonce son plan de contrôle (fermeture angulaire, hauteur de prisme, aller-retour). Quelle dimension métacognitive est ainsi mobilisée ?`,
 `La planification (anticipation) de l'action avant de l'exécuter`,
 [`Le simple conditionnement par répétition`,`L'évaluation sommative finale`,`La délégation du contrôle au formateur`],
 `Énoncer son plan de contrôle relève de la planification (Brown) et de la phase d'anticipation (Zimmerman). Le formateur rend la métacognition visible en faisant verbaliser.`);

/* --- T2 : Charge cognitive --- */
Q(2,[&quot;Miller&quot;],`Quel auteur (1956) a établi que l'empan de la mémoire immédiate est d'environ 7 ± 2 éléments, extensible par le chunking ?`,
 `Miller`,[`Baddeley &amp; Hitch`,`Sweller`,`Paas`],
 `Miller : 7 ± 2 ; chunking (regroupement en unités) ; capacité limitée. Cowan (2001) a révisé cette limite à 4 ± 1 éléments.`);
Q(2,[&quot;Miller&quot;],`Quelle valeur Cowan (2001) a-t-il proposée pour réviser l'empan de Miller ?`,
 `4 ± 1 éléments`,[`9 ± 2 éléments`,`12 ± 3 éléments`,`2 ± 1 éléments`],
 `Cowan ramène la capacité de la mémoire de travail à environ 4 ± 1 éléments, contre 7 ± 2 chez Miller.`);
Q(2,[&quot;Baddeley &amp; Hitch&quot;],`Quel modèle (1974) décrit la mémoire de travail avec un administrateur central, une boucle phonologique et un calepin visuo-spatial ?`,
 `Baddeley &amp; Hitch`,[`Miller`,`Mayer`,`Sweller`],
 `Modèle multi-composants de Baddeley &amp; Hitch ; le buffer épisodique a été ajouté en 2000. Conséquence : on ne retient pas tout simultanément.`);
Q(2,[&quot;Sweller&quot;],`Qui est le fondateur (1988) de la théorie de la charge cognitive ?`,
 `Sweller`,[`Miller`,`Paas`,`Kalyuga`],
 `Sweller : mémoire de travail limitée, mémoire à long terme riche en schémas qui s'automatisent. Trois charges : intrinsèque, extrinsèque, essentielle (germane).`);
Q(2,[&quot;Sweller&quot;],`Dans la théorie de Sweller, quelle charge est liée à une mauvaise présentation et doit être réduite ?`,
 `La charge extrinsèque`,[`La charge intrinsèque`,`La charge essentielle (germane)`,`Aucune : toute charge est utile`],
 `Intrinsèque = difficulté de la tâche (séquençable). Extrinsèque = mauvaise présentation (à réduire). Essentielle = effort utile à la construction des schémas (à favoriser).`);
Q(2,[&quot;Sweller&quot;],`Que faut-il faire de la charge essentielle (germane) ?`,
 `La favoriser, car c'est l'effort utile à la construction des schémas`,
 [`La supprimer, car elle surcharge la mémoire de travail`,`La mesurer uniquement avec une échelle à 9 points`,`L'ignorer, car elle dépend du contenu seul`],
 `La charge essentielle est l'effort mental productif qui construit les schémas. On vise à réduire l'extrinsèque et à favoriser l'essentielle.`);
Q(2,[&quot;Chandler &amp; Sweller&quot;],`Quel effet décrit le fait que, lorsque le texte est séparé du schéma, l'apprenant doit les intégrer mentalement, ce qui coûte de la mémoire de travail ?`,
 `L'effet d'attention partagée (Chandler &amp; Sweller)`,[`L'effet d'inversion de l'expertise (Kalyuga)`,`L'effet Pygmalion (Rosenthal &amp; Jacobson)`,`L'effet de surjustification (Deci &amp; Ryan)`],
 `Solution : intégrer l'information (légendes directement sur le schéma). Mots-clés : attention partagée, coût d'intégration, format intégré.`);
Q(2,[&quot;Kalyuga&quot;],`Quel auteur (2003) a mis en évidence l'effet d'inversion de l'expertise ?`,
 `Kalyuga`,[`Kirschner, Sweller &amp; Clark`,`Vygotski`,`Mayer`],
 `L'étayage utile au novice devient redondant et gêne l'expert. Le guidage doit donc s'adapter au niveau et diminuer avec la progression (étayage dégressif).`);
Q(2,[&quot;Kirschner, Sweller &amp; Clark&quot;],`Quels auteurs (2006) montrent que le guidage minimal (découverte pure) échoue chez les novices ?`,
 `Kirschner, Sweller &amp; Clark`,[`Kalyuga`,`Mayer`,`Dewey`],
 `Le guidage minimal surcharge la mémoire de travail des novices. Un enseignement explicite et guidé est plus efficace au début.`);
Q(2,[&quot;Paas&quot;],`Quel auteur a proposé une échelle d'effort mental perçu en 9 points pour mesurer la charge cognitive ?`,
 `Paas`,[`Schraw &amp; Dennison`,`Kirkpatrick`,`Holton`],
 `L'échelle de Paas est une mesure subjective de la charge cognitive. Croisée avec la performance, elle permet d'estimer l'efficience de la formation.`);
Q(2,[&quot;Mayer&quot;],`Quel auteur (2001) est associé à l'apprentissage multimédia et aux principes de cohérence, contiguïté, modalité et signalement ?`,
 `Mayer`,[`Sweller`,`Baddeley &amp; Hitch`,`van Merriënboer`],
 `Mayer : double canal (visuel / auditif), capacité limitée, traitement actif. Supports non redondants : rien d'inutile, texte près de l'image, voix + image.`);
Q(2,[&quot;van Merriënboer&quot;],`Quel modèle (4C/ID) propose pour les tâches complexes des tâches entières, des informations de soutien et des informations procédurales délivrées juste-à-temps ?`,
 `van Merriënboer`,[`Gagné`,`Tyler`,`Collins, Brown &amp; Newman`],
 `van Merriënboer : 4C/ID, tâches complexes, juste-à-temps, entraînement des routines. Complexité croissante et étayage dégressif.`);
Q(2,[&quot;Vygotski&quot;],`Pour régler le dosage de la difficulté, quel concept signale que la tâche doit dépasser un peu le niveau actuel, avec étayage ?`,
 `La zone proximale de développement (Vygotski)`,[`Le chunking (Miller)`,`L'inversion de l'expertise (Kalyuga)`,`Le niveau méta (Nelson &amp; Narens)`],
 `La ZPD est le curseur du dosage de la difficulté : ni trop facile, ni trop lourde, avec étayage.`);
Q(2,[&quot;Sweller&quot;,&quot;Kalyuga&quot;,&quot;van Merriënboer&quot;],`Terrain topo : la mise en station est enseignée en 3 temps isolés (centrage / calage / visée), puis fusionnés par étayage dégressif. Quel principe est appliqué ?`,
 `Séquencer pour réduire la charge intrinsèque, puis réduire progressivement l'étayage`,
 [`Augmenter la charge extrinsèque pour motiver`,`Laisser l'apprenant découvrir seul, sans guidage`,`Supprimer toute explication orale`],
 `Séquencer une tâche complexe réduit la charge intrinsèque. L'étayage dégressif (Kalyuga, van Merriënboer) évite la redondance pour l'apprenant qui progresse.`);

/* --- T3 : Analyse de pratique --- */
Q(3,[&quot;Vermersch&quot;],`Quel auteur (1994) est le fondateur de l'entretien d'explicitation, centré sur un moment singulier, daté et précis ?`,
 `Vermersch`,[`Schön`,`Clot`,`Argyris &amp; Schön`],
 `Vermersch : questionnement non inductif, accès au vécu de l'action. Il privilégie le « comment » (déroulé) plutôt que le « pourquoi » (justification).`);
Q(3,[&quot;Vermersch&quot;],`Pourquoi l'entretien d'explicitation évite-t-il la question « pourquoi » ?`,
 `Parce qu'elle déclenche la rationalisation plutôt que la description du déroulé`,
 [`Parce qu'elle est interdite par le règlement intérieur`,`Parce qu'elle fait baisser l'auto-efficacité`,`Parce qu'elle ne s'applique qu'aux enfants`],
 `Le « pourquoi » pousse à justifier. Le « comment » fait décrire l'action vécue. Piège QCM : Vermersch = explicitation (le comment) ≠ Schön = réflexivité.`);
Q(3,[&quot;Schön&quot;],`Quel auteur (1983) parle de « praticien réflexif » et distingue la réflexion dans l'action et sur l'action ?`,
 `Schön`,[`Vermersch`,`Pastré`,`Flanagan`],
 `Pour Schön, le savoir est caché dans l'agir (savoir tacite). La réflexion dans l'action (en cours) et sur l'action (après coup) le met au jour.`);
Q(3,[&quot;Argyris &amp; Schön&quot;],`Qui distingue la théorie professée (ce que je dis faire) de la théorie d'usage (ce que je fais vraiment) ?`,
 `Argyris &amp; Schön`,[`Clot`,`Rogers`,`Flanagan`],
 `Argyris &amp; Schön (1974-78) opposent aussi l'apprentissage en simple boucle (corriger l'action) à celui en double boucle (remettre en cause valeurs et présupposés).`);
Q(3,[&quot;Argyris &amp; Schön&quot;],`Que caractérise l'apprentissage en double boucle ?`,
 `La remise en cause des valeurs et des présupposés qui gouvernent l'action`,
 [`La simple correction de l'action sans changer les valeurs`,`La répétition d'un geste jusqu'à l'automatisation`,`L'évaluation par le supérieur hiérarchique`],
 `Simple boucle = corriger l'action. Double boucle = interroger finalités, valeurs et présupposés.`);
Q(3,[&quot;Pastré&quot;],`Quel auteur de la didactique professionnelle met au jour les concepts pragmatiques organisant l'action ?`,
 `Pastré`,[`Clot`,`Vermersch`,`Piaget`],
 `Pastré : analyser le travail pour former. Mots-clés : concepts pragmatiques, structure conceptuelle de la situation.`);
Q(3,[&quot;Clot&quot;],`Quel auteur propose la clinique de l'activité, avec autoconfrontation simple et croisée, et développe le pouvoir d'agir ?`,
 `Clot`,[`Pastré`,`Altet`,`Schön`],
 `Clot : l'activité réalisée n'est qu'une part du réel de l'activité (celle qui est empêchée ou non faite compte aussi). Le professionnel se voit agir et commente avec un pair.`);
Q(3,[&quot;Flanagan&quot;],`Quel auteur (1954) est associé à la technique des incidents critiques ?`,
 `Flanagan`,[`Mager`,`Vermersch`,`Kirkpatrick`],
 `Flanagan recueille des faits observables, réussis ou ratés, pour identifier les comportements décisifs. Il part de situations réelles et précises, pas d'opinions.`);
Q(3,[&quot;Rogers&quot;],`Quel auteur est associé à l'écoute active (reformulation, empathie, considération positive, congruence) et à la non-directivité ?`,
 `Rogers`,[`Knowles`,`Vermersch`,`Carré`],
 `Le formateur n'interprète pas : il aide la personne à clarifier elle-même. Mots-clés : écoute active, reformulation, empathie, non-directivité.`);
Q(3,[&quot;Piaget&quot;],`Pour quel auteur la prise de conscience va-t-elle des résultats (périphérie) vers les mécanismes de l'action (centre) ?`,
 `Piaget`,[`Vygotski`,`Schön`,`Flavell`],
 `Chez Piaget, la prise de conscience n'est pas donnée avec la réussite : il faut questionner pour passer du savoir-faire à sa conceptualisation.`);
Q(3,[&quot;Altet&quot;],`Quel auteur propose une « analyse plurielle », c'est-à-dire plusieurs regards sur la même pratique ?`,
 `Altet`,[`Paquay`,`Perrenoud`,`Clot`],
 `Altet : analyse plurielle des pratiques. Altet, Paquay et Perrenoud développent l'analyse de pratiques en formation des enseignants.`);
Q(3,[&quot;Paquay&quot;,&quot;Perrenoud&quot;,&quot;Altet&quot;],`Dans la formation des enseignants, que visent les dispositifs d'analyse de pratiques d'Altet, Paquay et Perrenoud ?`,
 `Une posture réflexive durable`,
 [`La mémorisation de listes de connaissances`,`La standardisation des méthodes de tous les formateurs`,`L'évaluation par QCM des compétences`],
 `Ces dispositifs de groupe visent une posture réflexive durable : analyse de pratiques, analyse plurielle (Altet), posture réflexive.`);
Q(3,[&quot;Vermersch&quot;,&quot;Schön&quot;],`Piège QCM : quelle affirmation correcte sur Vermersch et Schön ?`,
 `Vermersch = explicitation (le « comment ») ; Schön = réflexivité (dans / sur l'action)`,
 [`Schön = explicitation ; Vermersch = théorie d'usage`,`Les deux privilégient le « pourquoi »`,`Vermersch = praticien réflexif ; Schön = incidents critiques`],
 `Vermersch : accès au vécu par le comment. Schön : praticien réflexif, savoir tacite, réflexion dans et sur l'action.`);
Q(3,[&quot;Vermersch&quot;],`Terrain topo : après une erreur de fermeture, que fait le formateur qui applique l'explicitation ?`,
 `Il fait reconstituer le déroulé réel du cheminement, sans livrer la cause d'emblée`,
 [`Il donne immédiatement la cause de l'erreur`,`Il demande « pourquoi as-tu fait cela ? » en priorité`,`Il corrige en secret le carnet de terrain`],
 `Expliciter, c'est faire décrire le déroulé (comment) pour que le stagiaire repère lui-même l'écart.`);

/* --- T4 : APC --- */
Q(4,[&quot;Tyler&quot;],`Quel auteur (1949) est la racine de l'ingénierie curriculaire, avec quatre questions (objectifs, expériences, organisation, évaluation) ?`,
 `Tyler`,[`Bloom`,`Mager`,`Biggs`],
 `Tyler (1949) est la racine de l'ingénierie curriculaire. Ses quatre questions : quels objectifs, quelles expériences d'apprentissage, comment les organiser, comment évaluer. Logique : objectifs → expériences → évaluation.`);
Q(4,[&quot;Bloom&quot;],`Quel auteur (1956) a proposé la taxonomie des objectifs cognitifs, de la mémorisation à la création ?`,
 `Bloom`,[`Tyler`,`Mager`,`Biggs`],
 `Bloom (1956). Sert à choisir le niveau visé. À ne pas confondre avec Biggs : Bloom = niveaux d'objectifs ; Biggs = cohérence de la chaîne.`);
Q(4,[&quot;Anderson &amp; Krathwohl&quot;],`Dans la version révisée (Anderson &amp; Krathwohl, 2001) de la taxonomie, quel est le dernier niveau ?`,
 `Créer`,[`Évaluer`,`Appliquer`,`Comprendre`],
 `Niveaux révisés : se souvenir, comprendre, appliquer, analyser, évaluer, créer. Ils sont croisés avec des types de connaissances.`);
Q(4,[&quot;Mager&quot;],`Quel auteur (1962) définit l'objectif opérationnel par un comportement observable, une condition de réalisation et un critère de réussite ?`,
 `Mager`,[`Tyler`,`Bloom`,`Wiggins &amp; McTighe`],
 `Exemple : « avec la station totale (condition), implanter un point (comportement) à ±5 mm (critère) ».`);
Q(4,[&quot;Mager&quot;],`Dans l'objectif « avec la station totale, implanter un point à ±5 mm », que représente « à ±5 mm » ?`,
 `Le critère de réussite`,[`La condition de réalisation`,`Le comportement observable`,`Le niveau taxonomique`],
 `Un objectif opérationnel (Mager) décrit un comportement observable (implanter un point), la condition de réalisation (avec la station totale) et le critère de réussite (à ±5 mm). Le critère rend l'évaluation mesurable.`);
Q(4,[&quot;Biggs&quot;],`Quel auteur (1996) est le fondateur de l'alignement constructif et propose la taxonomie SOLO ?`,
 `Biggs`,[`Bloom`,`Tyler`,`Wiggins &amp; McTighe`],
 `Biggs : objectifs, activités d'apprentissage et évaluation sont conçus ensemble. SOLO classe la qualité de la compréhension.`);
Q(4,[&quot;Wiggins &amp; McTighe&quot;],`Quels auteurs (1998) ont proposé la conception à rebours (backward design) ?`,
 `Wiggins &amp; McTighe`,[`Biggs`,`Tyler`,`Mager`],
 `Backward design : on part des résultats attendus, puis on définit les preuves acceptables (évaluation), et enfin les activités. Tâches authentiques.`);
Q(4,[&quot;Wiggins &amp; McTighe&quot;],`Quel est l'ordre du backward design ?`,
 `Résultats attendus → preuves acceptables (évaluation) → activités`,
 [`Activités → évaluation → objectifs`,`Contenus → exposé → examen final`,`Évaluation sommative → aucune activité → objectifs`],
 `On démarre par la fin : que doit savoir faire l'apprenant, comment le prouver, puis quelles activités y conduisent.`);
Q(4,[&quot;Le Boterf&quot;],`Pour quel auteur la compétence est-elle un savoir-agir en situation, combinant savoir-agir, vouloir-agir et pouvoir-agir ?`,
 `Le Boterf`,[`Perrenoud`,`Tardif`,`De Ketele &amp; Roegiers`],
 `Le Boterf : mobiliser et combiner des ressources internes et externes. Vouloir-agir = motivation ; pouvoir-agir = contexte, moyens.`);
Q(4,[&quot;Perrenoud&quot;],`Quel auteur précise que la compétence ne se manifeste et ne s'évalue qu'en situation, donc pas par un simple QCM ?`,
 `Perrenoud`,[`Tyler`,`Mager`,`Bloom`],
 `Perrenoud : capacité de mobiliser des ressources pour faire face à une famille de situations. Mots-clés : mobilisation de ressources, évaluation en situation.`);
Q(4,[&quot;Tardif&quot;],`Quel auteur décrit la compétence comme un savoir-agir complexe qui se développe selon une trajectoire, avec des paliers d'évaluation ?`,
 `Tardif`,[`Le Boterf`,`Perrenoud`,`De Ketele &amp; Roegiers`],
 `Tardif : savoir-agir complexe, trajectoire de développement, paliers d'évaluation tout au long de la formation.`);
Q(4,[&quot;De Ketele &amp; Roegiers&quot;],`Quels auteurs sont associés à la pédagogie de l'intégration (situations d'intégration, évaluation par critères) ?`,
 `De Ketele &amp; Roegiers`,[`Tardif`,`Le Boterf`,`Wiggins &amp; McTighe`],
 `Après l'acquisition des ressources, on propose des situations d'intégration significatives et complexes pour les mobiliser ensemble.`);
Q(4,[&quot;Biggs&quot;,&quot;Bloom&quot;],`Piège QCM : que distingue-t-on entre Biggs et Bloom ?`,
 `Biggs = cohérence de la chaîne objectifs-activités-évaluation ; Bloom = niveaux d'objectifs`,
 [`Biggs = niveaux d'objectifs ; Bloom = alignement constructif`,`Les deux sont des théories de la motivation`,`Biggs = backward design ; Bloom = pédagogie de l'intégration`],
 `Biggs ≠ Bloom. Biggs : alignement constructif et SOLO. Bloom : taxonomie des objectifs.`);

/* --- T5 : Scénarisation --- */
Q(5,[&quot;Dewey&quot;],`Quel auteur défend « apprendre en faisant », à condition que le faire soit problématisé et suivi de réflexion (enquête) ?`,
 `Dewey`,[`Kolb`,`Meirieu`,`Lave &amp; Wenger`],
 `Pour Dewey, l'expérience n'éduque que si elle est suivie de réflexion à partir d'une situation problématique. Mots-clés : learning by doing, enquête.`);
Q(5,[&quot;Vygotski&quot;],`Quel auteur définit la zone proximale de développement : l'apprenant réussit avec aide ce qu'il ne réussit pas seul ?`,
 `Vygotski`,[`Piaget`,`Gagné`,`Dewey`],
 `La ZPD est l'écart entre ce que l'apprenant réussit seul et ce qu'il réussit avec aide. Elle justifie un guidage adapté qui se retire progressivement. Pour la scénarisation : proposer des tâches qui dépassent un peu le niveau actuel, avec étayage.`);
Q(5,[&quot;Bruner&quot;],`Qui a introduit, avec Wood et Ross (1976), la notion d'étayage (scaffolding) ?`,
 `Bruner`,[`Piaget`,`Gagné`,`Kolb`],
 `L'étayage (scaffolding), introduit par Wood, Bruner &amp; Ross (1976), consiste pour l'adulte à réduire la complexité, maintenir l'orientation, démontrer, puis retirer progressivement son aide (retrait progressif).`);
Q(5,[&quot;Gagné&quot;],`Quel auteur (1965) propose neuf événements de l'instruction comme trame de séquence (attention, objectif, prérequis, présentation, guidage, performance, feedback, évaluation, transfert) ?`,
 `Gagné`,[`Kolb`,`Bloom`,`Tyler`],
 `Les neuf événements de l'instruction de Gagné servent de trame de séquence : attention, objectif, rappel des prérequis, présentation, guidage, performance, feedback, évaluation, rétention / transfert.`);
Q(5,[&quot;Kolb&quot;],`Quel auteur (1984) a décrit le cycle expérientiel et quatre styles d'apprentissage ?`,
 `Kolb`,[`Dewey`,`Schön`,`Gagné`],
 `Dans le cycle de Kolb, la théorie arrive après l'expérience et est testée à nouveau en pratique.`);
Q(5,[&quot;Kolb&quot;],`Quel est l'ordre du cycle de Kolb ?`,
 `Expérience concrète → observation réfléchie → conceptualisation → expérimentation`,
 [`Conceptualisation → exposé → examen → expérimentation`,`Observation → évaluation → sanction → expérience`,`Expérimentation → mémorisation → restitution → contrôle`],
 `La théorie vient après l'expérience, puis on la teste de nouveau en pratique.`);
Q(5,[&quot;Meirieu&quot;],`Quel auteur est associé à la situation-problème : un obstacle réel, franchissable avec des ressources, qui crée le besoin d'apprendre ?`,
 `Meirieu`,[`Dewey`,`Gagné`,`Malglaive`],
 `Pour Meirieu, la consigne est une tâche à réaliser et la théorie est une réponse à un problème déjà éprouvé.`);
Q(5,[&quot;Pastré&quot;],`Quel auteur utilise la simulation en didactique professionnelle, à partir d'une situation de référence et d'un débriefing ?`,
 `Pastré`,[`Collins, Brown &amp; Newman`,`Lave &amp; Wenger`,`Malglaive`],
 `Pastré s'appuie sur une situation de référence (réelle) et sa structure conceptuelle, puis la simule pour apprendre avec un débriefing.`);
Q(5,[&quot;Collins, Brown &amp; Newman&quot;],`Quels auteurs (1989) ont décrit le cognitive apprenticeship (modeling, coaching, scaffolding, articulation, réflexion, exploration, fading) ?`,
 `Collins, Brown &amp; Newman`,[`Lave &amp; Wenger`,`Malglaive`,`Pastré`],
 `L'expert modèle son geste, guide, étaye, fait verbaliser, fait réfléchir et explorer, puis estompe son aide (fading).`);
Q(5,[&quot;Collins, Brown &amp; Newman&quot;],`Dans le cognitive apprenticeship, quelle méthode correspond à « retirer progressivement son aide » ?`,
 `Fading (estompage)`,[`Modeling`,`Articulation`,`Exploration`],
 `Fading = estomper l'aide. Modeling = l'expert montre son geste. Coaching = guider. Scaffolding = étayer. Articulation = faire verbaliser. Réflexion et exploration complètent la séquence.`);
Q(5,[&quot;Lave &amp; Wenger&quot;],`Quels auteurs (1991) ont développé la cognition située et la participation périphérique légitime ?`,
 `Lave &amp; Wenger`,[`Collins, Brown &amp; Newman`,`Kolb`,`Dewey`],
 `On apprend dans l'activité, en communauté. Le novice participe à des tâches réelles, d'abord simples, vers une pleine participation.`);
Q(5,[&quot;Malglaive&quot;],`Quel auteur défend l'alternance intégrative théorie / pratique et les « savoirs en usage » ?`,
 `Malglaive`,[`Pastré`,`Meirieu`,`Kolb`],
 `Chez Malglaive, savoirs théoriques, procéduraux et pratiques s'articulent dans l'action. Piège : alternance intégrative ≠ juxtaposition.`);
Q(5,[&quot;Meirieu&quot;],`Terrain topo : la cubature est introduite à partir d'une commande réelle de terrassement, et la formule arrive comme réponse à un problème déjà éprouvé. Quelle approche est illustrée ?`,
 `La situation-problème (Meirieu)`,[`L'apprentissage par exposé magistral`,`La taxonomie SOLO`,`L'effet Pygmalion`],
 `La situation réelle crée le besoin d'apprendre, puis la théorie répond au problème. Contre-exemple : le savoir inerte, mémorisé mais jamais mobilisé.`);

/* --- T6 : Transfert --- */
Q(6,[&quot;Thorndike &amp; Woodworth&quot;],`Quels auteurs (1901) expliquent le transfert par les éléments identiques entre situations ?`,
 `Thorndike &amp; Woodworth`,[`Judd`,`Perkins &amp; Salomon`,`Baldwin &amp; Ford`],
 `On transfère d'une situation à l'autre dans la mesure où elles partagent des éléments communs. Le transfert est surtout proche, lié à la ressemblance.`);
Q(6,[&quot;Judd&quot;],`Quel auteur (1908), avec son expérience sur la réfraction et le tir sur cible immergée, explique le transfert par la généralisation de principes ?`,
 `Judd`,[`Thorndike &amp; Woodworth`,`Holton`,`Tardif`],
 `Comprendre le principe sous-jacent permet de l'appliquer à des situations nouvelles (transfert lointain).`);
Q(6,[&quot;Baldwin &amp; Ford&quot;],`Quels auteurs (1988) ont fondé le modèle de transfert de formation en trois facteurs (apprenant, design de la formation, environnement de travail) ?`,
 `Baldwin &amp; Ford`,[`Holton`,`Kirkpatrick`,`Tardif`],
 `Baldwin &amp; Ford (1988) identifient trois facteurs : caractéristiques de l'apprenant (aptitudes, motivation), design de la formation (principes d'apprentissage, contenus) et environnement de travail (soutien, occasion d'appliquer). Ils conditionnent la généralisation et le maintien des acquis.`);
Q(6,[&quot;Tardif&quot;],`Quel auteur (1999) affirme que le transfert est un processus enseignable et non spontané (contextualisation, décontextualisation, recontextualisation) ?`,
 `Tardif`,[`Baldwin &amp; Ford`,`Bransford &amp; Schwartz`,`Judd`],
 `Il faut varier les situations d'une même famille de situations pour travailler le transfert.`);
Q(6,[&quot;Perkins &amp; Salomon&quot;],`Quels auteurs distinguent voie basse (automatismes) et voie haute (abstraction consciente, bridging) du transfert ?`,
 `Perkins &amp; Salomon`,[`Thorndike &amp; Woodworth`,`Bransford &amp; Schwartz`,`Judd`],
 `Voie basse : automatismes très exercés, déclenchés par une situation similaire. Voie haute : abstraction délibérée par rapprochement de principes.`);
Q(6,[&quot;Perkins &amp; Salomon&quot;],`Chez Perkins &amp; Salomon, que caractérise la voie haute ?`,
 `Une abstraction consciente et délibérée de principes entre situations différentes`,
 [`Un automatisme déclenché par une situation très similaire`,`Un simple climat de soutien au travail`,`Un score de satisfaction en fin de stage`],
 `Voie basse = automatismes ; voie haute = abstraction consciente (bridging).`);
Q(6,[&quot;Bransford &amp; Schwartz&quot;],`Quels auteurs (1999) proposent d'évaluer la préparation à l'apprentissage futur plutôt que la réutilisation directe de ce qui a été appris ?`,
 `Bransford &amp; Schwartz`,[`Perkins &amp; Salomon`,`Kirkpatrick`,`Holton`],
 `On évalue la capacité à apprendre dans une situation nouvelle, avec accès à des ressources (transfert dynamique).`);
Q(6,[&quot;Kirkpatrick&quot;],`Quel auteur (1959) a proposé quatre niveaux d'évaluation : réaction, apprentissage, comportement, résultats ?`,
 `Kirkpatrick`,[`Holton`,`Baldwin &amp; Ford`,`Flanagan`],
 `Piège : évaluer s'arrête trop souvent aux niveaux 1-2 de Kirkpatrick.`);
Q(6,[&quot;Kirkpatrick&quot;],`Quel niveau de Kirkpatrick correspond au transfert en situation de travail ?`,
 `Le niveau 3 (comportement)`,[`Le niveau 1 (réaction)`,`Le niveau 2 (apprentissage)`,`Le niveau 4 (résultats)`],
 `Les quatre niveaux de Kirkpatrick : 1 réaction, 2 apprentissage, 3 comportement, 4 résultats. Le niveau 3 (comportement) correspond au transfert en situation de travail. Piège : l'évaluation s'arrête trop souvent aux niveaux 1-2.`);
Q(6,[&quot;Holton&quot;],`Quel auteur (1996) a décrit le climat de transfert, mesuré par le LTSI (soutien, occasion d'appliquer, feedback) ?`,
 `Holton`,[`Kirkpatrick`,`Baldwin &amp; Ford`,`Paas`],
 `Holton : climat de transfert, soutien des collègues et du supérieur, opportunité d'appliquer, feedback sur le travail.`);
Q(6,[&quot;Bandura&quot;],`Selon l'association « Lave &amp; Wenger · Bandura », quel auteur montre que l'auto-efficacité conditionne l'« oser-faire » sur le poste ?`,
 `Bandura`,[`Lave &amp; Wenger`,`Holton`,`Rogers`],
 `L'auto-efficacité (Bandura) conditionne l'oser-faire sur le poste : un apprenant qui doute de lui n'appliquera pas ce qu'il a appris. Lave &amp; Wenger, eux, insistent sur l'apprentissage situé, lié à son contexte d'usage.`);
Q(6,[&quot;Lave &amp; Wenger&quot;],`Dans l'association « Lave &amp; Wenger · Bandura » appliquée au transfert, que montrent Lave &amp; Wenger ?`,
 `Un apprentissage situé, lié à son contexte d'usage`,
 [`Une échelle d'effort mental perçu`,`Un modèle à quatre niveaux d'évaluation`,`Un transfert uniquement par éléments identiques`],
 `Lave &amp; Wenger : apprentissage situé, lié au contexte d'usage.`);
Q(6,[&quot;Thorndike &amp; Woodworth&quot;,&quot;Judd&quot;,&quot;Perkins &amp; Salomon&quot;],`Terrain topo : le même type d'implantation est réalisé en station totale puis en GNSS RTK avec contrôle croisé, afin que l'apprenant abstraie le principe. Quel transfert est visé ?`,
 `Un transfert lointain par la voie haute (généralisation du principe)`,
 [`Un transfert proche par simple ressemblance`,`Un transfert automatique sans travail pédagogique`,`Aucun transfert, car les appareils diffèrent`],
 `Varier les outils pour abstraire le principe relève du transfert lointain (Judd) et de la voie haute (Perkins &amp; Salomon).`);

/* ===== THÉMATIQUES 7 à 12 ===== */

/* --- T7 : Andragogie --- */
Q(7,[&quot;Knowles&quot;],`Quel auteur (1970-84) est le fondateur de l'andragogie, avec six principes (besoin de savoir, concept de soi autonome, expérience, rôles sociaux, résolution de problèmes, motivation intrinsèque) ?`,
 `Knowles`,[`Rogers`,`Mezirow`,`Carré`],
 `Knowles : andragogie, autonomie, expérience comme ressource, besoin de savoir. Piège : andragogie (adultes) ≠ pédagogie (enfants).`);
Q(7,[&quot;Knowles&quot;],`Selon Knowles, quel est le rôle du formateur d'adultes ?`,
 `Celui d'un facilitateur`,[`Celui d'un transmetteur exclusif de savoirs`,`Celui d'un évaluateur-sélectionneur`,`Celui d'un modèle à imiter à l'identique`],
 `Le formateur facilite l'apprentissage d'adultes autonomes qui veulent comprendre l'utilité de ce qu'ils apprennent.`);
Q(7,[&quot;Rogers&quot;],`Quel auteur (1969) défend une approche centrée sur l'apprenant, fondée sur la congruence, l'empathie et la considération positive inconditionnelle ?`,
 `Rogers`,[`Knowles`,`Deci &amp; Ryan`,`Lindeman`],
 `L'apprentissage est significatif lorsqu'il est personnellement impliquant (apprentissage significatif).`);
Q(7,[&quot;Carré&quot;],`Quel auteur (2005) a proposé le concept d'apprenance, disposition durable à apprendre dans toutes les situations de vie ?`,
 `Carré`,[`Knowles`,`Mezirow`,`Dumazedier`],
 `Carré distingue aussi des motifs d'engagement (épistémiques, socio-affectifs, hédoniques, identitaires, économiques…) que le formateur doit repérer.`);
Q(7,[&quot;Mezirow&quot;],`Quel auteur est associé à l'apprentissage transformateur : un dilemme désorientant conduit à une réflexion critique sur ses cadres de référence ?`,
 `Mezirow`,[`Knowles`,`Lindeman`,`Carré`],
 `Mezirow (1978-91) : cadres de référence (perspectives de sens), dilemme désorientant, réflexion critique, transformation.`);
Q(7,[&quot;Lindeman&quot;],`Quel précurseur de l'éducation des adultes (1926) parle de l'expérience comme du « livre vivant » de l'adulte ?`,
 `Lindeman`,[`Dumazedier`,`Knowles`,`Meirieu`],
 `Lindeman (1926), précurseur de l'éducation des adultes, voit l'expérience comme le « livre vivant » de l'adulte : l'éducation part des situations de vie, pas de matières scolaires. Il annonce Knowles, pour qui l'expérience est une ressource d'apprentissage.`);
Q(7,[&quot;Bandura&quot;],`Quel auteur explique que l'auto-efficacité d'un adulte peut être dégradée par un échec scolaire antérieur, et se reconstruit par des expériences de réussite, des modèles proches et des encouragements ?`,
 `Bandura`,[`Rogers`,`Deci &amp; Ryan`,`Mezirow`],
 `Un échec scolaire antérieur peut dégrader l'auto-efficacité de l'adulte, qui doute alors de sa capacité. Elle se reconstruit par des expériences de maîtrise (réussites progressives), des modèles proches et des encouragements. Formateur : proposer des réussites visibles dès le début.`);
Q(7,[&quot;Deci &amp; Ryan&quot;],`Quels auteurs (1985) proposent la théorie de l'autodétermination ?`,
 `Deci &amp; Ryan`,[`Bandura`,`Rogers`,`Carré`],
 `La motivation intrinsèque est soutenue par trois besoins : autonomie (choix), compétence (réussite visible) et affiliation (lien aux autres).`);
Q(7,[&quot;Deci &amp; Ryan&quot;],`Quels sont les trois besoins de la théorie de l'autodétermination ?`,
 `Autonomie, compétence, affiliation`,[`Attention, rétention, restitution`,`Congruence, empathie, considération positive`,`Savoir-agir, vouloir-agir, pouvoir-agir`],
 `Autonomie (pouvoir choisir), compétence (voir sa réussite) et affiliation (se sentir lié aux autres) soutiennent la motivation intrinsèque. Les distracteurs renvoient à d'autres auteurs : attention-rétention-restitution évoque Gagné (événements de l'instruction), congruence-empathie-considération positive évoque Rogers, savoir-agir-vouloir-agir-pouvoir-agir évoque Le Boterf.`);
Q(7,[&quot;Meirieu&quot;],`Quel auteur affirme que le formateur ne peut pas apprendre à la place de l'autre : l'apprenant doit s'engager et choisir d'apprendre ?`,
 `Meirieu`,[`Dumazedier`,`Knowles`,`Rogers`],
 `Pour Meirieu, le formateur ne peut pas apprendre à la place de l'autre : l'apprenant doit s'engager et choisir d'apprendre. Le rôle du formateur est de créer les conditions de cet engagement (situation-problème, projet). Ne pas confondre avec Dumazedier, qui parle d'éducation permanente et d'autoformation.`);
Q(7,[&quot;Dumazedier&quot;],`Quel auteur est associé à l'éducation permanente et à l'autoformation tout au long de la vie ?`,
 `Dumazedier`,[`Meirieu`,`Lindeman`,`Carré`],
 `Dumazedier défend l'éducation permanente et l'autoformation tout au long de la vie : l'adulte est acteur de sa formation. Mots-clés : engagement, autoformation, éducation permanente. Meirieu complète : l'apprenant doit choisir de s'engager.`);
Q(7,[&quot;Knowles&quot;,&quot;Lindeman&quot;],`Terrain topo : une séquence sur les tolérances est construite à partir d'un litige de bornage rapporté par un stagiaire. Quel principe andragogique est illustré ?`,
 `L'expérience de l'adulte est une ressource et l'apprentissage est orienté vers la résolution de problèmes`,
 [`L'adulte apprend mieux par pure restitution de cours`,`L'expérience de l'adulte doit être ignorée`,`Seuls les modèles extrinsèques motivent l'adulte`],
 `L'expérience de l'adulte est une ressource (Knowles, Lindeman) : on part de ses situations réelles et de ses problèmes, ici un litige de bornage. Piège QCM : elle est aussi un obstacle (représentations erronées, habitudes, échecs passés). Elle doit être exploitée sans être sacralisée.`);

/* --- T8 : Différenciation --- */
Q(8,[&quot;Perrenoud&quot;],`Quel auteur (1997) définit la différenciation comme la multiplication des situations d'apprentissage, sans baisser le niveau d'exigence ?`,
 `Perrenoud`,[`Bloom`,`Meirieu`,`Tomlinson`],
 `Perrenoud rattache la différenciation à la lutte contre les inégalités et à une régulation continue des apprentissages. Mots-clés : variété de situations, même exigence.`);
Q(8,[&quot;Bloom&quot;],`Quel auteur est associé à la pédagogie de maîtrise : faire varier le temps et l'aide, pas l'objectif ?`,
 `Bloom`,[`Perrenoud`,`Astolfi`,`Legrand`],
 `Évaluation formative, puis correctifs et enrichissements, pour que la plupart des apprenants atteignent la maîtrise.`);
Q(8,[&quot;Meirieu&quot;],`Quel auteur distingue différenciation successive et différenciation simultanée ?`,
 `Meirieu`,[`Legrand`,`Tomlinson`,`Przesmycki`],
 `Successive : on change de méthode au fil du temps, variée pour tous. Simultanée : des activités distinctes au même moment pour des groupes. Elle reste liée à un projet commun.`);
Q(8,[&quot;Vygotski&quot;,&quot;Bruner&quot;],`Quelle idée associe Vygotski et Bruner à la différenciation ?`,
 `L'étayage différencié : le niveau d'aide s'ajuste à chacun, puis se réduit`,
 [`La répétition de la même consigne pour tous`,`La baisse systématique du niveau d'exigence`,`La sélection précoce des apprenants`],
 `La ZPD est l'écart entre ce que l'apprenant réussit seul et avec aide. Le niveau d'aide (étayage) s'ajuste à chacun, puis se réduit progressivement : c'est l'étayage différencié. Mots-clés : ZPD, médiation.`);
Q(8,[&quot;Astolfi&quot;],`Quel auteur (1997) voit dans l'erreur un outil de diagnostic et propose une typologie des erreurs ?`,
 `Astolfi`,[`Rosenthal &amp; Jacobson`,`Bloom`,`Meirieu`],
 `L'erreur révèle les représentations et obstacles de l'apprenant. La typologie guide la remédiation.`);
Q(8,[&quot;Rosenthal &amp; Jacobson&quot;],`Quels auteurs (1968) ont mis en évidence l'effet Pygmalion (prophétie auto-réalisatrice) ?`,
 `Rosenthal &amp; Jacobson`,[`Astolfi`,`Bloom`,`Tomlinson`],
 `Les attentes de l'enseignant influencent les résultats. Le formateur doit contrôler ses biais envers les stagiaires jugés faibles.`);
Q(8,[&quot;Legrand&quot;],`En France, quel auteur est cité pour avoir posé le cadre de la pédagogie différenciée ?`,
 `Legrand`,[`Przesmycki`,`Tomlinson`,`Astolfi`],
 `Legrand pose le cadre de la pédagogie différenciée en France ; Przesmycki en propose une démarche concrète (diagnostic, contrat, groupes de besoin, évaluation). Mots-clés de Legrand : pédagogie différenciée.`);
Q(8,[&quot;Przesmycki&quot;],`Quel auteur propose une démarche de pédagogie différenciée (diagnostic, contrat, groupes de besoin, évaluation) ?`,
 `Przesmycki`,[`Legrand`,`Bloom`,`Perrenoud`],
 `Démarche de Przesmycki : diagnostic, contrat, groupes de besoin, évaluation. Piège QCM : les groupes de besoin sont temporaires et se recomposent selon les besoins ; on ne fige pas les stagiaires dans un niveau.`);
Q(8,[&quot;Tomlinson&quot;],`Quelle auteure propose la differentiated instruction (contenus, processus, productions, environnement) ?`,
 `Tomlinson`,[`Legrand`,`Bloom`,`Perrenoud`],
 `On différencie les contenus, les processus, les productions et l'environnement, selon le niveau de préparation, les intérêts et le profil des apprenants.`);
Q(8,[&quot;Perrenoud&quot;,&quot;Bloom&quot;],`Terrain topo : lors d'un chantier-école, les rôles (opérateur, carnetier, calculateur, contrôleur) tournent obligatoirement. Quel principe est respecté ?`,
 `Varier les situations et rôles tout en gardant la même exigence pour tous`,
 [`Baisser l'exigence pour les stagiaires en difficulté`,`Figer chaque stagiaire dans le rôle où il est le meilleur`,`Supprimer toute évaluation formative`],
 `Les rôles tournants varient les situations d'apprentissage pour tous (Perrenoud : multiplier les situations, pas baisser l'exigence) et chacun atteint le même objectif (pédagogie de maîtrise de Bloom). Piège : la différenciation « abaissante » baisse l'exigence ; équité ≠ égalité.`);

/* --- T9 : Inclusion --- */
Q(9,[&quot;Modèle social du handicap&quot;,&quot;CIF-OMS&quot;,&quot;Oliver&quot;],`Quel modèle (porté notamment par Oliver) affirme que le handicap naît de l'interaction entre une déficience et un environnement non accessible ?`,
 `Le modèle social du handicap`,[`Le modèle médical`,`L'Index for Inclusion`,`La taxonomie SOLO`],
 `Le modèle social s'oppose au modèle médical, centré sur le « déficit à corriger ». La CIF de l'OMS (2001) en est la traduction institutionnelle. Pour le formateur : analyser d'abord la situation (supports, consignes, lieux, rythme) avant de chercher à normaliser l'apprenant. Barrières possibles : physiques, pédagogiques, organisationnelles, attitudinales.`);
Q(9,[&quot;CIF-OMS&quot;],`Que décrit la CIF de l'OMS (2001), traduction institutionnelle du modèle social ?`,
 `Fonctions, activités, participation et facteurs environnementaux`,
 [`Uniquement les diagnostics médicaux`,`Les sept principes du design universel`,`Les trois dimensions cultures – politiques – pratiques`],
 `La CIF (OMS, 2001) décrit fonctions, activités, participation et facteurs environnementaux (barrières / facilitateurs). Elle traduit institutionnellement le modèle social : le handicap est une situation, pas une propriété de la personne.`);
Q(9,[&quot;CAST — UDL&quot;],`Quelle approche (Rose &amp; Meyer, CAST) propose des parcours flexibles reposant sur de multiples moyens d'engagement, de représentation et d'action / expression ?`,
 `La Conception universelle de l'apprentissage (UDL)`,[`L'Index for Inclusion`,`La normalisation de Wolfensberger`,`La défectologie de Vygotski`],
 `L'UDL (Rose &amp; Meyer, CAST) part du constat que la variabilité entre apprenants est la règle : plutôt que d'ajouter des aménagements après coup, on conçoit dès le départ des parcours flexibles reposant sur trois principes (engagement, représentation, action/expression), pour former des apprenants experts, motivés et autonomes.`);
Q(9,[&quot;CAST — UDL&quot;],`Dans l'UDL, à quoi correspondent les « multiples moyens d'engagement » ?`,
 `Au « pourquoi » d'apprendre`,[`Au « quoi » : formats variés de l'information`,`Au « comment » : manières de montrer ses acquis`,`Au « où » : lieu de la formation`],
 `Engagement = le « pourquoi » d'apprendre (motivation) ; représentation = le « quoi » (formats variés de l'information) ; action et expression = le « comment » (manières de montrer ses acquis). Mnémo : P-Q-C.`);
Q(9,[&quot;Booth &amp; Ainscow&quot;],`Quels auteurs (2002) ont conçu l'Index for Inclusion, outil d'auto-évaluation des établissements ?`,
 `Booth &amp; Ainscow`,[`Mace`,`Wolfensberger`,`Rose &amp; Meyer`],
 `L'Index for Inclusion (2002) structure l'inclusion en trois dimensions : créer des cultures inclusives (valeurs, communauté), élaborer des politiques inclusives (organisation, soutien), développer des pratiques inclusives. L'inclusion y est un processus sans fin de réduction des obstacles à l'apprentissage et à la participation de tous.`);
Q(9,[&quot;Vygotski — défectologie&quot;],`Quel auteur distingue, dans ses travaux sur la défectologie, déficience primaire et déficience secondaire ?`,
 `Vygotski`,[`Mace`,`Wolfensberger`,`Booth &amp; Ainscow`],
 `Déficience primaire = organique ; déficience secondaire = conséquences sociales et culturelles, souvent plus handicapantes. L'enfant en situation de handicap se développe selon les mêmes lois, mais par des voies différentes : la compensation passe par des voies de contournement socialement médiatisées (langue des signes, braille, outils). S'appuyer sur les potentialités et la ZPD ; critique de l'éducation séparée.`);
Q(9,[&quot;Mace (Universal Design)&quot;],`Quel architecte est à l'origine du design universel (sept principes : usage équitable, flexibilité, usage simple, etc.) ?`,
 `Ronald Mace`,[`Wolfensberger`,`Rose &amp; Meyer`,`Oliver`],
 `Ronald Mace, architecte (Center for Universal Design), est à l'origine du design universel : concevoir produits et environnements utilisables par le plus grand nombre, sans adaptation spécialisée. Sept principes (usage équitable, flexibilité, usage simple, information perceptible, tolérance à l'erreur, effort minimal, dimensions adaptées). Exemple : la rampe, le sous-titrage. Racine architecturale de l'UDL.`);
Q(9,[&quot;Wolfensberger&quot;],`Quel auteur a diffusé en Amérique du Nord la normalisation puis la valorisation des rôles sociaux ?`,
 `Wolfensberger`,[`Mace`,`Booth &amp; Ainscow`,`Oliver`],
 `Wolfensberger a diffusé la normalisation (issue des pays scandinaves) puis la valorisation des rôles sociaux : offrir des conditions de vie, des lieux et des rôles valorisés. Il dénonce la ségrégation en institutions. Racine historique de l'intégration puis de l'inclusion, qui va plus loin en exigeant que ce soit le système qui change.`);
Q(9,[&quot;Modèle social du handicap&quot;],`Piège QCM : quelle différence entre intégration et inclusion ?`,
 `Intégration : l'apprenant s'adapte ; inclusion : le dispositif change`,
 [`Intégration : le dispositif change ; inclusion : l'apprenant s'adapte`,`Aucune différence`,`L'inclusion ne concerne que les adultes`],
 `L'inclusion déplace la responsabilité de l'adaptation de la personne vers le dispositif de formation.`);
Q(9,[&quot;CIF-OMS&quot;],`Quel est le repère marocain cité pour l'inclusion des personnes en situation de handicap ?`,
 `La loi-cadre 97.13`,[`La loi 54-19 (Charte des services publics)`,`La loi 09-08 (données personnelles)`,`La loi 01-00 (enseignement supérieur)`],
 `Repères du document pour l'inclusion : loi-cadre 97.13 ; CDPH ratifiée en 2009. À ne pas confondre avec la 54-19 (Charte des services publics) ni la 09-08 (données personnelles), qui relèvent de la thématique 12.`);
Q(9,[&quot;Modèle social du handicap&quot;],`Terrain topo : pour un stagiaire malentendant, des signes convenus sont établis entre opérateur et porte-prisme. Sur quoi porte l'adaptation ?`,
 `Sur l'interface de communication, pas sur l'exigence de précision`,
 [`Sur l'exigence de précision, qui est abaissée`,`Sur l'exclusion du stagiaire du levé`,`Sur la dispense de contrôle de fermeture`],
 `L'adaptation porte sur l'interface (signes convenus entre opérateur et porte-prisme), pas sur l'exigence de précision : on lève la barrière, on ne baisse pas la norme. C'est la logique du modèle social et de l'inclusion (le dispositif change).`);

/* --- T10 : Ludopédagogie --- */
Q(10,[&quot;Huizinga&quot;],`Quel auteur, dans Homo Ludens (1938), voit dans le jeu un fondement de la culture et introduit le « cercle magique » ?`,
 `Huizinga`,[`Caillois`,`Brougère`,`Csíkszentmihályi`],
 `Le jeu est une activité libre, volontaire, hors de la vie courante, aux règles acceptées. Pour le formateur : délimiter clairement la séquence ludique et en faire accepter les règles.`);
Q(10,[&quot;Caillois&quot;],`Quel auteur (Les jeux et les hommes, 1958) classe les jeux en agôn, alea, mimicry et ilinx ?`,
 `Caillois`,[`Huizinga`,`Deterding`,`Brougère`],
 `Agôn = compétition ; alea = hasard ; mimicry = simulacre ; ilinx = vertige. Axe paidia (spontané) ↔ ludus (réglé).`);
Q(10,[&quot;Caillois&quot;],`Un jeu de rôle « réunion de chantier » relève de quelle catégorie de Caillois ?`,
 `La mimicry (simulacre, jeu de rôle)`,[`L'agôn (compétition)`,`L'alea (hasard)`,`L'ilinx (vertige)`],
 `Mimicry pour une réunion de chantier simulée ; agôn pour un défi chronométré.`);
Q(10,[&quot;Deterding et al.&quot;],`Quels auteurs (2011) définissent la gamification comme l'usage d'éléments de design de jeu dans des contextes non ludiques ?`,
 `Deterding et al.`,[`Huizinga`,`Csíkszentmihályi`,`Deci &amp; Ryan`],
 `Ils distinguent la gamification (points, badges, classements) du serious game (jeu complet à finalité sérieuse).`);
Q(10,[&quot;Csíkszentmihályi&quot;],`Quel auteur (1990) a décrit le flow, état d'absorption atteint quand le défi perçu équilibre l'habileté perçue ?`,
 `Csíkszentmihályi`,[`Deci &amp; Ryan`,`Vygotski`,`Bandura`],
 `Conditions du flow : buts clairs, retour d'information immédiat, concentration. Trop de défi → anxiété ; trop peu → ennui.`);
Q(10,[&quot;Deci &amp; Ryan&quot;],`Quel effet de la théorie de l'autodétermination décrit la réduction de la motivation intrinsèque par des récompenses externes perçues comme contrôlantes ?`,
 `L'effet de surjustification`,[`L'effet Pygmalion`,`L'effet d'attention partagée`,`L'effet d'inversion de l'expertise`],
 `Un jeu efficace soutient autonomie, compétence et affiliation plutôt que de reposer sur des récompenses seules.`);
Q(10,[&quot;Vygotski&quot;],`Pour quel auteur le jeu crée-t-il une zone proximale de développement, grâce à la situation imaginaire, aux règles et aux rôles ?`,
 `Vygotski`,[`Bandura`,`Brougère`,`Huizinga`],
 `Dans le jeu, l'apprenant agit au-delà de son niveau habituel, soutenu par la situation imaginaire, les pairs et la médiation de l'adulte.`);
Q(10,[&quot;Bandura&quot;],`Quel auteur (apprentissage vicariant, modélisation) explique que le jeu de rôle permet d'observer, reproduire et renforcer des comportements ?`,
 `Bandura`,[`Vygotski`,`Deci &amp; Ryan`,`Caillois`],
 `Le formateur doit soigner la qualité du modèle montré et le retour fait après la scène.`);
Q(10,[&quot;Brougère&quot;],`Quel auteur définit le jeu comme une activité de second degré et parle du paradoxe du jeu éducatif ?`,
 `Brougère`,[`Huizinga`,`Caillois`,`Deterding`],
 `L'effet éducatif dépend du cadre, de la médiation et du lien avec les objectifs. Ce qui est appris doit être explicité après le jeu.`);
Q(10,[&quot;Brougère&quot;,&quot;Deterding et al.&quot;],`Piège QCM : que se passe-t-il avec un jeu sans débriefing et une gamification superficielle (points, badges) ?`,
 `Le jeu reste un divertissement, et la gamification n'active que la motivation extrinsèque`,
 [`Ils garantissent un transfert automatique`,`Ils renforcent toujours la motivation intrinsèque`,`Ils remplacent l'évaluation`],
 `Le jeu n'enseigne pas par lui-même : il devient pédagogique quand il est cadré, relié à un objectif et prolongé par un débriefing (Brougère). La gamification superficielle (points, badges) n'active que la motivation extrinsèque (Deterding ; Deci &amp; Ryan).`);

/* --- T11 : Posture réflexive --- */
Q(11,[&quot;Schön&quot;],`Quel auteur (The Reflective Practitioner, 1983) critique la rationalité technique et décrit le praticien réflexif ?`,
 `Schön`,[`Perrenoud`,`Dewey`,`Argyris`],
 `Schön critique la rationalité technique (appliquer des savoirs scientifiques à des problèmes bien définis). La pratique réelle comporte des zones indéterminées : incertitude, singularité, conflits de valeurs. Le praticien réflexif mobilise un savoir tacite dans l'action (réflexion dans l'action) et analyse ensuite ce qu'il a fait (réflexion sur l'action).`);
Q(11,[&quot;Argyris &amp; Schön&quot;],`Quels auteurs opposent théories professées et théories d'usage et parlent de routines défensives ?`,
 `Argyris &amp; Schön`,[`Wittorski`,`Kolb`,`Wenger`],
 `Théories professées = ce que l'on dit faire ; théories d'usage = ce que l'on fait réellement. Simple boucle : corriger l'action sans changer les valeurs ; double boucle : interroger finalités, présupposés et valeurs. La réflexivité vise l'écart entre les deux ; les routines défensives le masquent.`);
Q(11,[&quot;Perrenoud&quot;],`Quel auteur (2001), dans Développer la pratique réflexive dans le métier d'enseignant, fait de la réflexivité un habitus professionnel ?`,
 `Perrenoud`,[`Schön`,`Paquay`,`Wittorski`],
 `Pour Perrenoud, la réflexivité est un habitus professionnel, une posture durable et non une réflexion occasionnelle après un échec. Elle s'apprend par l'analyse de pratiques et suppose un cadre sûr. Elle n'est pas de l'autocritique.`);
Q(11,[&quot;Kolb&quot;],`Quel auteur voit la séance du formateur comme une expérience à réfléchir, à reprendre avec un objectif d'amélioration ?`,
 `Kolb`,[`Dewey`,`Wenger`,`Schön`],
 `Cycle de Kolb : expérience concrète, observation réfléchie, conceptualisation abstraite, expérimentation active. L'expérience seule n'apprend pas : elle doit être analysée puis réinvestie. Appliqué au formateur : la séance est une expérience à réfléchir, qu'on reprend avec un objectif d'amélioration.`);
Q(11,[&quot;Wenger&quot;],`Quel auteur (1998) décrit la communauté de pratique, définie par l'engagement mutuel, l'entreprise commune et le répertoire partagé ?`,
 `Wenger`,[`Wittorski`,`Kolb`,`Perrenoud`],
 `La communauté de pratique (Wenger, 1998) repose sur trois dimensions : engagement mutuel, entreprise commune, répertoire partagé (outils, routines, langage). Apprendre, c'est aussi devenir quelqu'un : la communauté soutient l'identité et le développement professionnel collectif, par exemple via l'échange entre pairs formateurs.`);
Q(11,[&quot;Wittorski&quot;],`Quel auteur étudie la professionnalisation comme processus liant actions, apprentissages et construction de l'identité professionnelle ?`,
 `Wittorski`,[`Wenger`,`Paquay`,`Altet`],
 `Wittorski montre que l'analyse des pratiques et la reconnaissance par le collectif transforment l'identité professionnelle. Il décrit plusieurs logiques de professionnalisation : logique de l'action, de la réflexion sur l'action, de l'intégration-assimilation.`);
Q(11,[&quot;Paquay&quot;,&quot;Altet&quot;],`Quels auteurs, dans la lignée de « Former des enseignants professionnels », défendent le paradigme du praticien réflexif ?`,
 `Paquay et Altet`,[`Wittorski`,`Wenger`,`Kolb`],
 `Dans la lignée de Former des enseignants professionnels (Paquay, Altet, Charlier, Perrenoud), ils défendent le paradigme du praticien réflexif et l'analyse de pratiques comme dispositif de formation du formateur professionnel, appuyé sur un référentiel de compétences et sur l'articulation entre théorie et terrain.`);
Q(11,[&quot;Dewey&quot;],`Quel auteur (How We Think, 1910) est la racine de la pensée réflexive ?`,
 `Dewey`,[`Schön`,`Kolb`,`Perrenoud`],
 `Pour Dewey (How We Think, 1910), réfléchir est un examen actif et persistant d'une croyance à la lumière de ses fondements et de ses conséquences. La réflexion naît d'une situation problématique ou d'un doute et demande ouverture d'esprit et responsabilité. L'éducation relie expérience et réflexion (Expérience et éducation, 1938).`);
Q(11,[&quot;Schön&quot;,&quot;Perrenoud&quot;],`Piège QCM : quelle affirmation est correcte ?`,
 `La réflexion DANS l'action est en temps réel ; la réflexion SUR l'action se fait après coup`,
 [`La réflexion dans l'action se fait après coup`,`Réflexivité = autodépréciation`,`La réflexion sur l'action est impossible`],
 `Réflexion DANS l'action : pendant, en temps réel (je dialogue avec la situation). Réflexion SUR l'action : après coup (j'analyse ce que j'ai fait). Distinction de Schön reprise par Perrenoud. Piège : réflexivité ≠ autodépréciation.`);
Q(11,[&quot;Schön&quot;,&quot;Kolb&quot;,&quot;Wenger&quot;],`Terrain topo : journal de bord, auto-vidéoscopie, observation croisée entre pairs avec un focus unique. À quoi servent ces outils ?`,
 `À analyser sa pratique pour l'améliorer`,[`À noter les stagiaires`,`À remplacer le référentiel`,`À éviter toute remise en question`],
 `Journal de bord, auto-vidéoscopie et observation croisée avec un focus unique sont des dispositifs d'analyse de pratique : ils permettent la réflexion sur l'action (Schön), le retour sur l'expérience (Kolb) et l'échange entre pairs (Wenger). Réflexivité ≠ autodépréciation.`);

/* --- T12 : Éthique --- */
Q(12,[&quot;Weber&quot;],`Quel auteur (Le savant et le politique, 1919) oppose éthique de conviction et éthique de responsabilité ?`,
 `Weber`,[`Kant`,`Jonas`,`Ricœur`],
 `Éthique de conviction : agir selon ses principes quelles que soient les conséquences. Éthique de responsabilité : assumer les conséquences prévisibles de ses actes. Les deux ne s'excluent pas : une personne mature les combine. Weber défend aussi la neutralité axiologique de l'enseignant.`);
Q(12,[&quot;Weber&quot;],`Que signifie la neutralité axiologique chez Weber ?`,
 `Ne pas imposer ses valeurs sous couvert de savoir`,[`Ne jamais avoir de valeurs`,`Appliquer la règle quelles que soient les conséquences`,`Rester indifférent aux normes`],
 `La neutralité axiologique (Weber) interdit d'imposer ses valeurs sous couvert de savoir. Piège QCM : neutralité ≠ indifférence ; le formateur est neutre sur les opinions mais intransigeant sur les normes et la sécurité.`);
Q(12,[&quot;Ricœur&quot;],`Quel auteur (Soi-même comme un autre, 1990) définit la visée éthique comme « la vie bonne, avec et pour autrui, dans des institutions justes » ?`,
 `Ricœur`,[`Prairat`,`Kohlberg`,`Jonas`],
 `Ricœur distingue l'éthique (visée du bien) de la morale (normes, obligations). La visée éthique comprend l'estime de soi, la sollicitude envers autrui et le sens de la justice. Quand les normes entrent en conflit, la sagesse pratique permet de juger en situation.`);
Q(12,[&quot;Prairat&quot;],`Quel auteur distingue la déontologie (règles prescrites) de l'éthique (délibération, jugement face aux situations singulières) ?`,
 `Prairat`,[`Ricœur`,`Weber`,`Kohlberg`],
 `La déontologie est l'ensemble de devoirs et de règles professionnelles prescrites (codes, chartes) ; l'éthique relève de la délibération et du jugement face aux situations singulières. La règle protège et cadre ; l'éthique interroge le sens. Mnémo : la déontologie prescrit, l'éthique délibère.`);
Q(12,[&quot;Kohlberg&quot;],`Quel auteur décrit le développement du jugement moral en trois niveaux et six stades, avec le dilemme de Heinz ?`,
 `Kohlberg`,[`Jonas`,`Weber`,`Prairat`],
 `Trois niveaux (préconventionnel, conventionnel, postconventionnel) et six stades. Le jugement progresse en discutant des dilemmes moraux où des principes entrent en conflit (dilemme de Heinz). En formation : proposer des dilemmes de métier pour faire argumenter, plutôt qu'imposer une réponse.`);
Q(12,[&quot;Jonas&quot;],`Quel auteur (1979) propose le principe responsabilité et l'heuristique de la peur ?`,
 `Jonas`,[`Weber`,`Ricœur`,`Kant`],
 `Jonas propose une éthique adaptée à la civilisation technologique, dont les actions ont des effets durables et irréversibles. Devoir de responsabilité envers les générations futures et la nature ; heuristique de la peur : en cas d'incertitude, donner priorité à la prévision du pire (précaution). Transposable aux enjeux fonciers et environnementaux.`);
Q(12,[&quot;Kant&quot;],`Quel auteur fonde l'éthique du devoir sur l'impératif catégorique ?`,
 `Kant`,[`Aristote`,`Weber`,`Ricœur`],
 `Kant : éthique du devoir (déontologique). L'impératif catégorique est une règle universalisable qui traite l'humanité comme une fin et jamais seulement comme un moyen. À opposer à Aristote, éthique de la vertu.`);
Q(12,[&quot;Aristote&quot;],`Quel auteur (Éthique à Nicomaque) défend l'éthique de la vertu, guidée par la phronèsis et le juste milieu ?`,
 `Aristote`,[`Kant`,`Kohlberg`,`Jonas`],
 `Aristote (Éthique à Nicomaque) : éthique de la vertu. On vise le bonheur (eudaimonia) par l'habitude des vertus, guidée par la prudence (phronèsis) et le juste milieu. À opposer à Kant, éthique du devoir.`);
Q(12,[&quot;Cadre juridique&quot;],`Quelle loi marocaine fixe, depuis 2021, la Charte des services publics (égalité, neutralité, transparence, intégrité, reddition des comptes) ?`,
 `La loi 54-19`,[`La loi 09-08`,`La loi 97.13`,`La loi 01-00`],
 `La loi 54-19 (Charte des services publics, 2021) fixe des principes comme l'égalité, la neutralité, la transparence, l'intégrité et la reddition des comptes. La Constitution de 2011 consacre la bonne gouvernance et l'obligation de rendre compte.`);
Q(12,[&quot;Cadre juridique&quot;],`Quelle loi marocaine protège les données personnelles (consentement, finalité, confidentialité) ?`,
 `La loi 09-08`,[`La loi 54-19`,`La loi 97.13`,`La loi 01-00`],
 `La loi 09-08 protège les données personnelles : consentement, finalité, confidentialité. Le formateur y applique neutralité, équité et confidentialité des données des stagiaires.`);
Q(12,[&quot;Weber&quot;,&quot;Prairat&quot;,&quot;Ricœur&quot;],`Terrain topo : « arrondir » une limite, sauter un contrôle de fermeture, valider une implantation non vérifiée. Quelle posture adopter ?`,
 `Neutre sur les opinions, intransigeant sur les normes et la sécurité`,
 [`Indifférent à tout`,`Souple sur les normes pour faire plaisir`,`Neutre sur les normes, intransigeant sur les opinions`],
 `Dilemmes de métier typiques : arrondir une limite, sauter un contrôle de fermeture, valider une implantation non vérifiée. La déontologie (règles, normes, sécurité) cadre ; l'éthique délibère (Prairat, Ricœur) ; l'éthique de responsabilité (Weber) impose d'assumer les conséquences prévisibles. Neutralité ≠ indifférence : neutre sur les opinions, intransigeant sur les normes et la sécurité.`);

  $(&quot;#selLen&quot;).addEventListener(&quot;change&quot;,function(e){S.length=e.target.value;});
  $(&quot;#chkMix&quot;).addEventListener(&quot;change&quot;,function(e){S.mix=e.target.checked;});
  $(&quot;#btnStart&quot;).addEventListener(&quot;click&quot;,startQuiz);
  window.scrollTo(0,0);
}
function themeBtn(n,title,sub,count,all){
  var on=(S.sel===n);
  return '<button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;theme'+(all?' all':'')+'&quot; data-n=&quot;'+n+'&quot; aria-checked=&quot;'+(on?&quot;true&quot;:&quot;false&quot;)+'&quot;>'+
   '<span class=&quot;check&quot; aria-hidden=&quot;true&quot;>'+(on?&quot;✓&quot;:&quot;&quot;)+'</span>'+
   '<span class=&quot;bloc&quot;>'+(all?'Quiz complet':esc(sub.split(&quot; · &quot;)[0]))+'</span>'+
   '<span class=&quot;tt&quot;>'+esc(title)+'</span>'+
   '<span class=&quot;nb&quot;>'+count+' question'+(count>1?'s':'')+'</span></button>';
}
function coverHtml(){
  var h='<details class=&quot;cover&quot;><summary>Voir tous les auteurs couverts par thématique</summary><div class=&quot;cover-body&quot;>';
  THEMES.forEach(function(t){
    h+='<div class=&quot;cover-t&quot;>N°'+t.n+' — '+esc(t.titre)+'</div><div class=&quot;chips&quot;>';
    t.auteurs.forEach(function(a){h+='<span class=&quot;chip&quot;>'+esc(a)+'<i>×'+countFor(t.n,a)+'</i></span>';});
    h+='</div>';
  });
  return h+'</div></details>';
}

function startQuiz(){
  var pool=QUESTIONS.filter(function(q){return S.sel===0||q.t===S.sel;});
  if(S.mix) pool=shuffle(pool);
  if(S.length!==&quot;all&quot;){pool=pool.slice(0,parseInt(S.length,10));}
  beginWith(pool);
}
function beginWith(pool){
  S.pool=pool; S.i=0; S.score=0; S.answers=[]; renderQuestion();
}

function renderQuestion(){
  S.view=&quot;quiz&quot;; S.validated=false; S.picked=null;
  var q=S.pool[S.i];
  var opts=shuffle([{t:q.ok,c:true}].concat(q.bad.map(function(b){return {t:b,c:false};})));
  S.cur={q:q,opts:opts};
  var th=themeOf(q.t);
  setProgress((S.i/S.pool.length)*100); setLive(true);
  var h='<section class=&quot;card&quot; aria-labelledby=&quot;qt&quot;>'+
   '<div class=&quot;qhead&quot;><span class=&quot;badge&quot;>Thématique '+th.n+' · '+esc(th.titre)+'</span><span class=&quot;qcount&quot;>'+(S.i+1)+' sur '+S.pool.length+'</span></div>'+
   '<h2 class=&quot;qtext&quot; id=&quot;qt&quot;>'+esc(q.q)+'</h2>'+
   '<div class=&quot;choices&quot; role=&quot;radiogroup&quot; aria-labelledby=&quot;qt&quot;>';
  opts.forEach(function(o,k){
    h+='<button type=&quot;button&quot; class=&quot;choice&quot; role=&quot;radio&quot; aria-checked=&quot;false&quot; data-k=&quot;'+k+'&quot;>'+
      '<span class=&quot;L&quot;>'+LETTERS[k]+'</span><span class=&quot;T&quot;>'+esc(o.t)+'</span><span class=&quot;M&quot; aria-hidden=&quot;true&quot;></span></button>';
  });
  h+='</div><div id=&quot;fb&quot; aria-live=&quot;polite&quot;></div>'+
   '<div class=&quot;actions&quot;><button class=&quot;btn btn-primary&quot; id=&quot;btnVal&quot; disabled>Valider ma réponse</button>'+
   '<button class=&quot;btn btn-ghost&quot; id=&quot;btnQuit&quot;>Abandonner</button></div></section>';
  $(&quot;#app&quot;).innerHTML=h;
  document.querySelectorAll(&quot;.choice&quot;).forEach(function(b){
    b.addEventListener(&quot;click&quot;,function(){pick(parseInt(b.getAttribute(&quot;data-k&quot;),10));});
  });
  $(&quot;#btnVal&quot;).addEventListener(&quot;click&quot;,onPrimary);
  $(&quot;#btnQuit&quot;).addEventListener(&quot;click&quot;,function(){if(confirm(&quot;Abandonner le quiz et afficher le résultat actuel ?&quot;)){renderResult(true);}});
  window.scrollTo(0,0);
  var first=$(&quot;.choice&quot;); if(first) first.focus({preventScroll:true});
}
function pick(k){
  if(S.validated) return;
  S.picked=k;
  document.querySelectorAll(&quot;.choice&quot;).forEach(function(b,i){b.setAttribute(&quot;aria-checked&quot;,i===k?&quot;true&quot;:&quot;false&quot;);});
  $(&quot;#btnVal&quot;).disabled=false;
}
function onPrimary(){
  if(!S.validated) validate(); else next();
}
function validate(){
  if(S.picked===null) return;
  S.validated=true;
  var o=S.cur.opts, q=S.cur.q, good=o[S.picked].c;
  if(good) S.score++;
  S.answers.push({q:q,ok:good,chosen:o[S.picked].t});
  document.querySelectorAll(&quot;.choice&quot;).forEach(function(b,i){
    b.disabled=true;
    var m=b.querySelector(&quot;.M&quot;);
    if(o[i].c){b.classList.add(&quot;correct&quot;);m.textContent=&quot;✓&quot;;}
    else if(i===S.picked){b.classList.add(&quot;wrong&quot;);m.textContent=&quot;✗&quot;;}
    else b.classList.add(&quot;dim&quot;);
  });
  var th=themeOf(q.t);
  var chips=q.a.map(function(a){return '<span class=&quot;chip&quot;>'+esc(a)+'</span>';}).join(&quot;&quot;);
  var fb='<div class=&quot;feedback '+(good?'ok':'ko')+'&quot; role=&quot;status&quot;>'+
    '<div class=&quot;fb-h&quot;>'+(good?'✓ Bonne réponse':'✗ Réponse incorrecte')+'</div>'+
    (good?'':'<p class=&quot;fb-good&quot;><b>Bonne réponse :</b> '+esc(q.ok)+'</p>')+
    '<div class=&quot;fb-lbl&quot;>Explication</div><p class=&quot;fb-ex&quot;>'+esc(q.ex)+'</p>'+
    '<div class=&quot;fb-aut&quot;><span class=&quot;fb-lbl&quot; style=&quot;margin:0&quot;>Auteur(s) :</span> '+chips+'</div></div>';
  $(&quot;#fb&quot;).innerHTML=fb;
  var v=$(&quot;#btnVal&quot;); v.textContent=(S.i+1<S.pool.length)?&quot;Question suivante →&quot;:&quot;Voir mon résultat&quot;; v.disabled=false; v.focus({preventScroll:true});
  setLive(true);
  setProgress(((S.i+1)/S.pool.length)*100);
  $(&quot;#fb&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;nearest&quot;});
}
function next(){
  if(S.i+1<S.pool.length){S.i++;renderQuestion();}
  else renderResult(false);
}

function renderResult(early){
  S.view=&quot;result&quot;; setLive(false);
  var done=S.answers.length, tot=early?done:S.pool.length;
  setProgress(100);
  var pct=done?Math.round(S.score/done*100):0;
  var msg=pct>=85?&quot;Excellent : vous maîtrisez très bien les auteurs.&quot;:pct>=70?&quot;Très bien : encore quelques auteurs à consolider.&quot;:pct>=50?&quot;Correct, mais il faut revoir plusieurs auteurs et leurs idées clés.&quot;:&quot;À retravailler : reprenez les fiches thématique par thématique et refaites vos erreurs.&quot;;
  var h='<section class=&quot;card res&quot;><span class=&quot;kicker&quot;>'+(early?'Quiz interrompu':'Quiz terminé')+'</span>'+
   '<div class=&quot;ring&quot; style=&quot;--p:'+pct+'&quot;><div class=&quot;ring-in&quot;><b>'+pct+'%</b><span>'+S.score+' / '+done+'</span></div></div>'+
   '<h2>Score final : '+S.score+' / '+done+(early&amp;&amp;done<S.pool.length?' (sur '+S.pool.length+' prévues)':'')+'</h2>'+
   '<p class=&quot;msg&quot;>'+msg+'</p>';
  /* par thématique */
  var by={};
  S.answers.forEach(function(a){var k=a.q.t;by[k]=by[k]||{ok:0,n:0};by[k].n++;if(a.ok)by[k].ok++;});
  var keys=Object.keys(by).map(Number).sort(function(a,b){return a-b;});
  if(keys.length){
    h+='<div class=&quot;bytheme&quot;><h2>Résultats par thématique</h2>';
    keys.forEach(function(k){
      var r=by[k],p=Math.round(r.ok/r.n*100),cl=p>=75?'good':p>=50?'mid':'low';
      h+='<div class=&quot;row&quot;><div>N°'+k+' — '+esc(themeOf(k).titre)+'</div><div class=&quot;bar&quot;><i class=&quot;'+cl+'&quot; style=&quot;width:'+p+'%&quot;></i></div><div class=&quot;sc&quot;>'+r.ok+'/'+r.n+'</div></div>';
    });
    h+='</div>';
  }
  var wrong=S.answers.filter(function(a){return !a.ok;});
  if(wrong.length){
    h+='<div class=&quot;errs&quot;><h2>À revoir ('+wrong.length+')</h2>';
    wrong.forEach(function(a){
      h+='<div class=&quot;err&quot;><div class=&quot;eq&quot;>'+esc(a.q.q)+'</div>'+
        '<div class=&quot;ea you&quot;>✗ Votre réponse : '+esc(a.chosen)+'</div>'+
        '<div class=&quot;ea good&quot;>✓ Bonne réponse : '+esc(a.q.ok)+'</div>'+
        '<div class=&quot;ee&quot;>'+esc(a.q.ex)+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class=&quot;actions&quot;>'+
    (wrong.length?'<button class=&quot;btn btn-primary&quot; id=&quot;btnRetry&quot;>Refaire mes erreurs ('+wrong.length+')</button>':'')+
    '<button class=&quot;btn btn-ghost&quot; id=&quot;btnAgain&quot;>Nouveau quiz</button></div></section>';
  $(&quot;#app&quot;).innerHTML=h;
  var r1=$(&quot;#btnRetry&quot;); if(r1) r1.addEventListener(&quot;click&quot;,function(){beginWith(shuffle(wrong.map(function(a){return a.q;})));});
  $(&quot;#btnAgain&quot;).addEventListener(&quot;click&quot;,renderHome);
  window.scrollTo(0,0);
}

/* Clavier : 1-4 / A-D pour choisir, Entrée pour valider / continuer */
document.addEventListener(&quot;keydown&quot;,function(e){
  if(S.view!==&quot;quiz&quot;||e.ctrlKey||e.metaKey||e.altKey) return;
  var tag=(e.target&amp;&amp;e.target.tagName)||&quot;&quot;;
  var k=e.key.toUpperCase(), idx=-1;
  if(k>=&quot;1&quot;&amp;&amp;k<=&quot;4&quot;) idx=parseInt(k,10)-1; else if(k>=&quot;A&quot;&amp;&amp;k<=&quot;D&quot;) idx=k.charCodeAt(0)-65;
  if(idx>-1&amp;&amp;!S.validated){
    e.preventDefault();pick(idx);
    var cb=document.querySelectorAll(&quot;.choice&quot;)[idx]; if(cb) cb.focus({preventScroll:true});
    return;
  }
  if(e.key===&quot;Enter&quot;){
    var onChoice=e.target&amp;&amp;e.target.classList&amp;&amp;e.target.classList.contains(&quot;choice&quot;);
    if(tag!==&quot;BUTTON&quot;||onChoice){
      if(S.validated||S.picked!==null){e.preventDefault();onPrimary();}
    }
  }
});

renderHome();
</script>
