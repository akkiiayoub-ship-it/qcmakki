<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Mémento · Courants, méthodes, approches</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#141c2b;--mut:#5b687c;--bd:#e0e5ef;--pri:#243a9e;--pri2:#2f9e6e;--pri-t:#fff;--acc:#f59e0b;--ok:#15803d;--okbg:#e6f6ec;--ko:#b91c1c;--kobg:#fdecec;--warn:#8a5a00;--warnbg:#fff3d1;--bar:#e3e8f2;--sh:0 8px 28px rgba(40,50,110,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1233;--card:#111a47;--tx:#e8edf8;--mut:#9aa8cc;--bd:#26356f;--pri:#7f95ff;--pri2:#4fd49a;--pri-t:#0a1233;--acc:#fbbf24;--ok:#4ade80;--okbg:#10301d;--ko:#ff8c8c;--kobg:#3a1b1d;--warn:#f0c15a;--warnbg:#38300f;--bar:#27314a;--sh:0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.30;animation:float 18s ease-in-out infinite}
.blobs i:nth-child(1){width:340px;height:340px;background:var(--pri);top:-80px;left:-60px}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--pri2);bottom:-60px;right:-40px;animation-delay:-6s}
.blobs i:nth-child(3){width:220px;height:220px;background:var(--acc);top:40%;left:55%;opacity:.14;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 14px 60px}
.hero{background:linear-gradient(120deg,var(--pri),var(--pri2),var(--pri));background-size:220% 100%;animation:shine 9s linear infinite;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--sh)}
@keyframes shine{to{background-position:220% 0}}
.hero h1{font-size:1.1rem;margin:0;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.hero h1 small{display:block;font-weight:400;font-size:.8rem;opacity:.9}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;transition:transform .15s,box-shadow .2s,border-color .2s,background .2s}
button:hover:not(:disabled){border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--sh)}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
.opt:disabled{opacity:1}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;font-weight:600}
button.sm{padding:6px 11px;font-size:.85rem}
.hero button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dash{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:var(--bar)}
.ring .pg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem}
.ring b small{font-size:.9rem;opacity:.6}
.lvl{display:inline-block;background:linear-gradient(135deg,var(--acc),#ef4444);color:#fff;font-weight:700;font-size:.8rem;border-radius:99px;padding:3px 12px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.35rem;line-height:1.2}
.stat span{font-size:.74rem;color:var(--mut)}
.best{margin-top:8px;font-size:.85rem;color:var(--mut)}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sweep 2.2s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.modes button{text-align:left;padding:14px;border-radius:16px;position:relative;overflow:hidden;animation:rise .5s both}
.modes button .ic{font-size:1.4rem;display:block;margin-bottom:2px}
.modes button b{display:block}
.modes button span.d{font-size:.8rem;color:var(--mut)}
.modes button.pri span.d{color:#fff;opacity:.9}
.theme{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.theme:first-of-type{border-top:0}
.theme .nm{flex:1;min-width:0}
.theme .nm b{display:block;font-weight:600;font-size:.95rem}
.theme .nm small{color:var(--mut)}
.theme .bar{margin-top:5px}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:.82rem;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.streak{background:var(--warnbg);color:var(--warn);border-radius:99px;padding:2px 10px;font-weight:700}
.streak.hot{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.25)}}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;align-items:flex-start;animation:rise .4s both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:.8rem;font-weight:700;transition:.2s}
.opt:hover:not(:disabled) .k{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:pop .45s}
.opt.ko{background:var(--kobg);border-color:var(--ko);animation:shake .45s}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ko .k{background:var(--ko);color:#fff;border-color:var(--ko)}
@keyframes pop{40%{transform:scale(1.025)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opt.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.opt:disabled{cursor:default;color:var(--tx)}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:.95rem;animation:rise .4s both}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.ko{background:var(--kobg);border-left:5px solid var(--ko)}
.tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:2px 9px;margin-top:6px;background:var(--bar);color:var(--mut)}
.anc{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(63,197,138,.12);border:1px solid rgba(63,197,138,.4);font-size:.92em}
.tag.check{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{width:38px;padding:6px 0;text-align:center;font-size:.85rem}
.grid button.done{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.grid button.cur{outline:2px solid var(--acc)}
.big{font-size:2.6rem;font-weight:800;text-align:center;margin:6px 0;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.note{font-size:.8rem;color:var(--mut)}
.err{border-top:1px solid var(--bd);padding:12px 0}
.err:first-child{border-top:0}
.flash{min-height:170px;display:grid;place-items:center;text-align:center;padding:10px;perspective:800px}
.flash>div{animation:flipin .5s both}
@keyframes flipin{from{opacity:0;transform:rotateX(70deg)}to{opacity:1;transform:none}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border-radius:99px;padding:5px 12px;font-size:.82rem}
.chip.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
input.srch{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.mcard{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;background:var(--card);animation:rise .4s both}
.mcard h4{margin:0 0 6px;font-size:1rem}
.mcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.mcard dt{color:var(--mut)}.mcard dd{margin:0}
.rule{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}

h1,h2,h3,h4,.big,.fl,.lvl,.q{font-family:Sora,Manrope,system-ui,sans-serif}
.photo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.photo div{position:absolute;inset:-4%;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;animation:kb 26s ease-in-out infinite alternate;filter:saturate(1.05)}
.photo div.on{opacity:.22}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 22%,transparent 70%,var(--bg) 100%)}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#1b2868,#243a9e 45%,#2f9e6e);background-size:220% 100%}
.hero .logo{width:54px;height:54px;border-radius:50%;background:#fff;padding:3px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,.35);flex:none;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-4px) rotate(-4deg)}}
.hero .tl{display:flex;align-items:center;gap:12px}
.thband{position:relative;display:flex;align-items:center;gap:12px;height:64px;margin:-16px -16px 12px;border-radius:18px 18px 0 0;overflow:hidden;color:#fff;padding:0 16px}
.thband::before{content:"";position:absolute;inset:0;background:var(--tb) center/cover;animation:kb 18s ease-in-out infinite alternate}
.thband::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,22,70,.92),rgba(14,22,70,.45))}
.thband>*{position:relative;z-index:1}
.thband .em{font-size:1.7rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));animation:floaty 3.5s ease-in-out infinite}
.thband b{font-family:Sora,sans-serif;font-size:.95rem}
.thband small{display:block;opacity:.85;font-size:.75rem}
.theme .th{width:46px;height:46px;border-radius:12px;background:var(--tb) center/cover;display:grid;place-items:center;font-size:1.3rem;flex:none;box-shadow:inset 0 0 0 100px rgba(14,22,70,.5)}
.score{background:rgba(63,197,138,.16);color:var(--ok);font-weight:700;border-radius:99px;padding:2px 10px}
.fb.sk{background:var(--bar);border-left:5px solid var(--mut)}
.final{text-align:center;padding:10px 0;border-radius:16px}
.final .fl{font-size:1.5rem;font-weight:800;letter-spacing:.06em;animation:pop .6s both}
.final.win .fl{color:var(--ok)}.final.lose .fl{color:var(--ko)}
.final.win{background:radial-gradient(300px 120px at 50% 0,rgba(63,197,138,.22),transparent)}
.final.lose{background:radial-gradient(300px 120px at 50% 0,rgba(239,68,68,.18),transparent)}
.big small{font-size:1.1rem;-webkit-text-fill-color:var(--mut)}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:.88rem;align-items:center}
.pill{border-radius:99px;padding:2px 10px;font-weight:700;font-size:.8rem}
.pill.okp{background:var(--okbg);color:var(--ok)}.pill.kop{background:var(--kobg);color:var(--ko)}
.card{backdrop-filter:blur(6px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(max-width:520px){.dash{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="photo" aria-hidden="true"><div id="ph1"></div><div id="ph2"></div></div>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="hero">
    <div class="tl"><img class="logo" src="img/logo.jpg" alt="OFPPT" width="54" height="54"><h1>QCM Mémento · Courants, méthodes & approches<small>40 questions pour maîtriser le mémento pédagogique</small></h1></div>
    <button id="homeBtn" class="sm" hidden>← Accueil</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <p class="note">Questions rédigées à partir du mémento pédagogique fourni (7 courants, 5 méthodes, 3 approches). Les 4 premières questions de la banque du mémento y sont reprises.</p>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="coach.js"></script>
<script>
const CFG={"key": "qcm-memento-v1", "exams": [{"n": 20, "m": 20, "label": "Examen blanc"}, {"n": 40, "m": 40, "label": "Examen complet"}], "memo": {"rulex": ["التيار = النظرية المرجعية (كيف يتعلم العقل). المقاربة = الاستراتيجية العامة وهندسة التكوين (على ماذا نبني البرنامج). الطريقة = الصيغة العملية للحصة (كيف ننشط التعلم).", "التيار = النظرية المرجعية (كيفاش العقل كيتعلم). المقاربة = الاستراتيجية العامة وهندسة التكوين (على شنو نبنيو البرنامج). الطريقة = الصيغة العملية د الحصة (كيفاش ننشطو التعلم)."], "rule": "Courant = théorie de référence (comment l'esprit apprend) • Approche = stratégie globale et ingénierie de formation (sur quoi fonder le programme) • Méthode = modalité opérationnelle de la séance (comment animer l'apprentissage).", "sections": [{"title": "Les 7 courants", "cols": ["Courant", "Auteurs clés", "Mécanisme central", "Posture de l'enseignant"], "rows": [["Transmissif", "Tradition académique", "Transmission descendante (apprenant = tabula rasa)", "Magistral, détient tout le savoir formel"], ["Béhaviorisme", "Skinner, Watson, Pavlov", "Stimulus → Réponse → Renforcement (boîte noire)", "Découpe les tâches, conditionne et valide l'observable"], ["Cognitivisme", "Tardif, Sweller, Miller", "Traitement de l'information (mémoire de travail / long terme)", "Structure le contenu, gère la charge cognitive"], ["Constructivisme", "Jean Piaget", "Assimilation, accommodation, déséquilibre, conflit cognitif", "Provoque la rupture par la situation-problème"], ["Socio-constructivisme", "Vygotski, Bruner", "Conflit socio-cognitif et Zone Proximale de Développement (ZPD)", "Tuteur, assure un étayage progressif"], ["Éducation nouvelle", "Freinet, Montessori, Dewey", "Learning by doing, manipulations, projets", "Accompagnateur de projets, prépare l'environnement"], ["Connectivisme", "Siemens, Downes", "Navigation dans les réseaux, filtrage critique, outils numériques", "Curateur de données, facilitateur de réseaux"]]}, {"title": "Les 5 méthodes", "cols": ["Méthode", "Schéma opératoire", "Rôle de l'apprenant", "Cas d'usage typique"], "rows": [["Expositive", "Exposé magistral linéaire", "Écoute, prise de notes, assimilation", "Cadres théoriques, conférences, lois"], ["Démonstrative", "Montrer → Faire faire → Corriger", "Imitation pas à pas, exécution", "Gestes techniques, manipulations logicielles"], ["Interrogative", "Questionnement socratique (maïeutique)", "Déduction, formulation d'hypothèses", "Émergence des prérequis, débriefings"], ["Active", "Action directe → Réflexion → Bilan", "Acteur, concepteur, résolveur", "Études de cas, projets, simulations de crise"], ["Analogique", "Comparaison avec un univers connu", "Transposition de mécanismes familiers", "Concepts abstraits ou contre-intuitifs"]]}, {"title": "Les 3 approches", "cols": ["Approche", "Idée clé"], "rows": [["APC (Approche Par Compétences)", "Dépasser les savoirs déclaratifs pour viser le savoir-agir complexe en situation authentique, en mobilisant un faisceau intégré de ressources."], ["PPO (Pédagogie Par Objectifs)", "Découpage en comportements observables standardisés, évalués selon des critères stricts (formulation de Bloom et Mager)."], ["Alignement constructif (Biggs)", "Cohérence stricte entre les acquis d'apprentissage visés, les activités d'entraînement et l'épreuve d'évaluation."]]}]}, "anch": {"t1": ["Métacognition (Flavell) : planifier, contrôler et réguler soi-même sa démarche ; le formateur modèle sa propre surveillance (modelage métacognitif).", "الما وراء المعرفة (فلافيل): التخطيط والمراقبة والتعديل يقوم بها المتدرب نفسه؛ والمكون ينمذج مراقبته هو.", "ما وراء المعرفة (فلافيل): المتدرب هو لي كيخطط وكيراقب وكيعدل بوحدو؛ والمكون كيبين كيفاش كيراقب راسو."], "t2": ["Andragogie (Knowles) : l'adulte a besoin de savoir pourquoi il apprend, valorise son expérience, est autonome et orienté vers la résolution de problèmes.", "الأندراغوجيا (نولز): الراشد يحتاج أن يعرف لماذا يتعلم، ويقدّر خبرته، ويتعلم باستقلالية انطلاقًا من مشكلات حقيقية.", "الأندراغوجيا (نولز): الراشد خاصو يعرف علاش كيتعلم، كيقدر الخبرة ديالو، وكيتعلم بالاستقلالية من مشاكل حقيقية."], "t3": ["Alignement constructif (Biggs) et APC : objectifs, activités et évaluations doivent viser la même compétence, en situation professionnelle.", "المطابقة البنائية (بيغز) والمقاربة بالكفايات: الأهداف والأنشطة والتقويم تستهدف نفس الكفاية في وضعية مهنية.", "المطابقة البنائية (بيغز) والمقاربة بالكفايات: الأهداف والأنشطة والتقويم خاصها تستهدف نفس الكفاية فوضعية مهنية."], "t4": ["Charge cognitive (Sweller, Miller) : réduire la charge extrinsèque, fractionner la charge intrinsèque, favoriser la charge essentielle ; l'effet d'inversion d'expertise (Kalyuga).", "الحمل المعرفي (سويلر، ميلر): نقلل الحمل الخارجي، نجزئ الحمل الداخلي، ونشجع الحمل الجوهري؛ وأثر انعكاس الخبرة (كاليوغا).", "الحمل المعرفي (سويلر، ميلر): كنقصو الحمل الخارجي، كنقسمو الحمل الداخلي، وكنشجعو الحمل الجوهري؛ وأثر انعكاس الخبرة (كاليوغا)."], "t5": ["Entretien d'explicitation (Vermersch) : questions ouvertes sur le « comment », sans demander de justification, pour faire décrire l'action vécue.", "استجلاء الفعل (فيرميرش): أسئلة مفتوحة عن «كيف» دون طلب تبرير، ليصف الشخص الفعل الذي عاشه.", "الاستجلاء (فيرميرش): أسئلة مفتوحة على «كيفاش» بلا ما نطلبو تبرير، باش الشخص يوصف الفعل لي عاشو."], "t6": ["Transfert des apprentissages (Tardif, Perkins et Salomon) : transfert proche et lointain ; contextualiser, décontextualiser, puis recontextualiser au poste de travail.", "نقل التعلمات (تاردف، بيركنز وسالومون): نقل قريب وبعيد؛ نضع التعلم في سياق ثم نجرده ثم نعيده إلى مكان العمل.", "نقل التعلمات (تاردف، بيركنز وسالومون): نقل قريب وبعيد؛ كنحطو التعلم فسياق ومن بعد كنجردوه ومن بعد كنرجعوه لبلاصة الخدمة."], "t7": ["Différenciation pédagogique (Tomlinson, Przesmycki) : mêmes objectifs de certification, des parcours, des supports et des étayages variés.", "التمايز البيداغوجي (تومليسون، بريسميسكي): نفس أهداف الشهادة، مع تنويع المسارات والدعامات والتأطير.", "التمييز البيداغوجي (تومليسون، بريسميسكي): نفس أهداف الشهادة، مع تنويع الطرق والدعامات والتأطير."], "t8": ["Ludopédagogie : jeu (Caillois), ludification (Deterding) ; la valeur d'apprentissage vient du débriefing (Kolb), pas du score.", "البيداغوجيا باللعب: اللعب (كايوا)، التلعيب (ديتيرينغ)؛ قيمة التعلم تأتي من المناقشة بعد اللعبة (كولب) لا من النقطة.", "البيداغوجيا باللعب: اللعب (كايوا)، التلعيب (ديتيرينغ)؛ قيمة التعلم كتجي من المناقشة من بعد اللعبة (كولب) ماشي من النقطة."], "t9": ["Inclusion et Conception Universelle de l'Apprentissage (CAST/UDL) : on adapte l'accès et le dispositif, jamais le niveau d'exigence.", "الإدماج الشامل والتصميم الشامل للتعلم (CAST): نكيف الوصول والمنظومة، لا مستوى الطلب أبدًا.", "الإدماج الشامل والتصميم الشامل للتعلم (CAST): كنكيفو الوصول والنظام، ماشي مستوى الطلب عمرو."], "t10": ["Pratique réflexive (Schön, Kolb, Perrenoud) : réflexion dans et sur l'action, cycle expérience, observation réfléchie, conceptualisation, expérimentation.", "الممارسة التأملية (شون، كولب، بيرنو): التأمل في الفعل وعلى الفعل، ودورة التجربة والملاحظة والتصور والتجريب.", "الممارسة التأملية (شون، كولب، بيرنو): التأمل فالفعل وعلى الفعل، ودورة التجربة والملاحظة والتصور والتجريب."], "t11": ["Scénarisation pédagogique (Gagné, Bruner) : partir de l'objectif, alterner théorie et pratique, étayer puis estomper le guidage.", "السيناريو البيداغوجي (غانيي، برونر): ننطلق من الهدف، نناوب بين النظري والعملي، وندعم ثم نقلص التوجيه.", "السيناريو البيداغوجي (غانيي، برونر): كنبداو من الهدف، كنناوبو بين النظري والعملي، وكندعمو ومن بعد كنقصو التوجيه."], "t12": ["Déontologie du formateur : neutralité, équité, déclaration des conflits d'intérêts, confidentialité des données personnelles (loi 09-08 au Maroc).", "أخلاقيات المكون: الحياد والإنصاف والتصريح بتضارب المصالح وسرية المعطيات الشخصية (القانون 09-08 بالمغرب).", "أخلاقيات المكون: الحياد والإنصاف والتصريح بتضارب المصالح وسرية المعطيات الشخصية (القانون 09-08 فالمغرب)."], "role": ["Rôle du formateur : guide et facilitateur qui crée la confiance (Rogers), concepteur et tuteur plus que transmetteur.", "دور المكون: s": "Mémento pédagogique", "q": "Le « learning by doing », les manipulations et les projets d'enfants caractérisent :", "o": ["L'Éducation nouvelle (Freinet, Montessori, Dewey)", "Le béhaviorisme de Skinner", "Le cognitivisme de Tardif", "Le courant transmissif"], "a": 0, "e": "L'Éducation nouvelle place l'activité de l'apprenant au centre. L'enseignant est un accompagnateur de projets qui prépare l'environnement.", "x": ["التربية الجديدة كتحط نشاط المتعلم فالمركز. المدرس مرافق للمشاريع وكيهيء المحيط.", "التربية الجديدة كتحط نشاط المتعلم فالمركز. المدرس مرافق للمشاريع وكيجهز المحيط."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Le formateur « curateur de données » et « facilitateur de réseaux » relève du :", "o": ["socio-constructivisme", "connectivisme (Siemens, Downes)", "béhaviorisme", "courant transmissif"], "a": 1, "e": "Le connectivisme apprend par la navigation dans les réseaux, le filtrage critique et les outils numériques. Le formateur y sélectionne et relie les sources.", "x": ["الترابطية كيتعلم بالتنقل فالشبكات والتصفية النقدية والأدوات الرقمية. المكون كيختار المصادر وكيربطها.", "الترابطية (connectivisme) كيتعلم بالتنقل فالشبكات والغربلة النقدية والأدوات الرقمية. المكون كيختار المصادر وكيربطها."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Le « conflit socio-cognitif » est un mécanisme central de :", "o": ["le béhaviorisme", "le cognitivisme", "le courant transmissif", "le socio-constructivisme"], "a": 3, "e": "Le conflit socio-cognitif naît de la confrontation de points de vue entre apprenants. Il est propre au socio-constructivisme (Vygotski).", "x": ["الصراع السوسيومعرفي كيجي من مواجهة وجهات النظر بين المتعلمين. وهو خاص بالبنائية الاجتماعية (فيغوتسكي).", "الصراع السوسيومعرفي كيجي من مواجهة وجهات النظر بين المتعلمين. وهو خاص بالبنائية الاجتماعية (فيغوتسكي)."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Un formateur découpe la tâche en micro-étapes, renforce chaque réponse correcte et ne valide que ce qui est observable. Quelle est sa référence ?", "o": ["Le constructivisme", "Le connectivisme", "Le socio-constructivisme", "Le béhaviorisme"], "a": 3, "e": "Découper la tâche, conditionner et valider l'observable : c'est la posture béhavioriste.", "x": ["تقسيم المهمة والتشريط والتأكد من لي كيتشاف: هادا هو الموقف السلوكي.", "تقسيم المهمة والتشريط والتأكد من لي كيتشاف: هادا هو الموقف السلوكي."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Quel groupe d'auteurs est associé au béhaviorisme ?", "o": ["Skinner, Watson, Pavlov", "Vygotski, Bruner", "Freinet, Montessori, Dewey", "Siemens, Downes"], "a": 0, "e": "Skinner, Watson et Pavlov sont les références du béhaviorisme. Vygotski et Bruner relèvent du socio-constructivisme, Freinet, Montessori et Dewey de l'Éducation nouvelle, Siemens et Downes du connectivisme.", "x": ["سكينر وواتسون وبافلوف هوما مراجع السلوكية. فيغوتسكي وبرونر من البنائية الاجتماعية، فرينيه ومونتيسوري وديوي من التربية الجديدة، وسيمنز ودونز من الترابطية.", "سكينر وواتسون وبافلوف هوما مراجع السلوكية. فيغوتسكي وبرونر من البنائية الاجتماعية، فرينيه ومونتيسوري وديوي من التربية الجديدة، وسيمنز ودونز من الترابطية."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Dans quel courant le formateur est-il « magistral » et détenteur de tout le savoir formel ?", "o": ["Le socio-constructivisme", "L'Éducation nouvelle", "Le courant transmissif", "Le connectivisme"], "a": 2, "e": "Le courant transmissif est fondé sur la transmission descendante. Le formateur est la source unique du savoir.", "x": ["التيار الإلقائي مبني على النقل من فوق لتحت. المكون هو المصدر الوحيد للمعرفة.", "التيار الإلقائي مبني على النقل من فوق لتحت. المكون هو المصدر الوحيد للمعرفة."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Quelle est la différence essentielle entre constructivisme (Piaget) et socio-constructivisme (Vygotski, Bruner) ?", "o": ["Le premier utilise des renforcements, le second non", "Le second ajoute la dimension sociale : interactions, ZPD, étayage", "Le premier est centré sur le numérique, le second sur le manuel", "Il n'y en a aucune : ce sont deux noms pour la même théorie"], "a": 1, "e": "Chez Piaget, le moteur est le déséquilibre interne de l'individu. Le socio-constructivisme y ajoute le rôle des interactions et de l'étayage par un tuteur.", "x": ["عند بياجي المحرك هو اختلال التوازن الداخلي عند الفرد. البنائية الاجتماعية كتزيد دور التفاعلات والتدعيم من المؤطر.", "عند بياجي المحرك هو اختلال التوازن الداخلي عند الفرد. البنائية الاجتماعية كتزيد دور التفاعلات والتدعيم من المؤطر."]}, {"th": "cou", "s": "Mémento pédagogique", "q": "Un formateur-tuteur apporte une aide au début, puis la retire progressivement à mesure que l'apprenant progresse. Cette démarche illustre :", "o": ["le conditionnement opérant", "l'étayage progressif dans la ZPD", "l'exposé magistral linéaire", "l'analogie avec un univers connu"], "a": 1, "e": "Étayer, c'est soutenir l'apprenant dans sa Zone Proximale de Développement, puis retirer progressivement l'aide jusqu'à son autonomie.", "x": ["التدعيم هو أن ندعمو المتعلم فمنطقة النمو القريب، ومن بعد نقصو المساعدة شوية بشوية حتى يستقل.", "التدعيم هو أن نعاونو المتعلم فمنطقة النمو القريب، ومن بعد نقصو المساعدة شوية بشوية حتى يولي مستقل."]}, {"th": "met", "s": "Mémento pédagogique", "q": "Quelle méthode pédagogique repose explicitement sur le cycle « Montrer → Faire faire → Corriger » ?", "o": ["La méthode interrogative", "La méthode analogique", "La méthode démonstrative", "La méthode active"], "a": 2, "e": "C'est la caractéristique de la méthode démonstrative, très utilisée en atelier pour les gestes techniques.", "x": ["هادي هي خاصية الطريقة الإيضاحية، لي كتستعمل بزاف فالورشة للحركات التقنية.", "هادي هي خاصية الطريقة الإيضاحية، لي كتستعمل بزاف فالورشة للحركات التقنية."]}, {"th": "met", "s": "Mémento pédagogique", "q": "Pour présenter un cadre théorique ou une loi à un grand groupe, la méthode la plus adaptée est :", "o": ["analogique", "active", "interrogative", "expositive"], "a": 3, "e": "La méthode expositive (exposé magistral linéaire) t", "Imiter pas à pas et exécuter", "Concevoir seul un projet"], "a": 2, "e": "Il imite pas à pas, puis exécute, et le formateur corrige. L'écoute et la prise de notes sont le rôle dans la méthode expositive.", "x": ["كيقلد خطوة بخطوة، من بعد كينفذ، والمكون كيصحح. الاستماع وتدوين الملاحظات هو الدور فالطريقة الإلقائية.", "كيقلد خطوة بخطوة، من بعد كينفذ، والمكون كيصحح. الاستماع وتدوين الملاحظات هو الدور فالطريقة الإلقائية."]}, {"th": "met", "s": "Mémento pédagogique", "q": "Dans la méthode active, l'apprenant est avant tout :", "o": ["un auditeur qui prend des notes", "un imitateur du geste montré", "un acteur, concepteur et résolveur", "un répondeur à des questions fermées"], "a": 2, "e": "La méthode active (Action directe → Réflexion → Bilan) place l'apprenant en position d'acteur et de résolveur.", "x": ["الطريقة النشيطة (فعل مباشر ← تأمل ← حصيلة) كتحط المتعلم فموقع الفاعل وحال المشاكل.", "الطريقة النشيطة (فعل مباشر ← تأمل ← حصيلة) كتحط المتعلم فموقع الفاعل وحال المشاكل."]}, {"th": "met", "s": "Mémento pédagogique", "q": "Pour faire émerger les prérequis ou mener un débriefing, le formateur utilise surtout la méthode :", "o": ["expositive", "interrogative", "démonstrative", "analogique"], "a": 1, "e": "La méthode interrogative, par le questionnement, sert à faire émerger les prérequis et à débriefer.", "x": ["الطريقة الاستجوابية، بالأسئلة، كتخدم باش تبرز المتطلبات القبلية وفالمناقشة من بعد.", "الطريقة الاستجوابية، بالأسئلة، كتخدم باش تبرز المتطلبات القبلية وفالمناقشة من بعد."]}, {"th": "met", "s": "Mémento pédagogique", "q": "Quelle méthode place l'apprenant dans l'écoute, la prise de notes et l'assimilation ?", "o": ["La méthode active", "La méthode démonstrative", "La méthode analogique", "La méthode expositive"], "a": 3, "e": "C'est le rôle de l'apprenant dans l'exposé magistral linéaire de la méthode expositive.", "x": ["هادا هو دور المتعلم فالعرض الإلقائي المتسلسل ديال الطريقة الإلقائية.", "هادا هو دور المتعلم فالعرض الإلقائي المتسلسل ديال الطريقة الإلقائية."] function burst(n,x,y){
  if(reduce)return;const cols=['#2d45b8','#3fc58a','#c9ccd3','#e8c26a','#22c55e','#5b72ee'];
  x=x==null?cv.width/2:x;y=y==null?cv.height/3:y;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:3+Math.random()*4,c:cols[i%cols.length],l:90+Math.random()*50,rot:Math.random()*6})}
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.99;p.l--;p.rot+=.2;cx.save();cx.globalAlpha=Math.min(1,p.l/30);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}

}
homeBtn.onclick=home;

/* ---------- démarrage ---------- */
function start(mode,th,n,m){
  stopTimer();homeBtn.hidden=false;
  if(mode==='memo'){S=null;return memo()}
  if(mode==='practice')S={mode,th,list:pick(idsOf(th),th?Math.min(10,idsOf(th).length):10)};
  else if(mode==='errors')S={mode,list:shuffle(allIds.filter(isWrong))};
  else if(mode==='exam'){S={mode,n,m,list:shuffle(allIds).slice(0,n||30),end:Date.now()+(m||30)*60000};timer=setInterval(tick,1000)}
  else if(mode==='cards'){const l=idsOf(th);const todo=l.filter(i=>!isMastered(i));S={mode,th,list:shuffle(todo.length?todo:l),flip:false}}
  S.i=0;S.ans=[];S.ord=[];S.streak=0;
  if(co()){const INTRO={practice:'Entraînement : '+S.list.length+' questions. Choisis une réponse, et je t’explique ensuite pourquoi elle est juste ou fausse.',exam:'Examen blanc : '+S.list.length+' questions, '+(S.m||30)+' minutes. Pas de correction pendant l’épreuve, je te donne le bilan à la fin.',errors:'Reprenons tes erreurs. Cette fois, retiens le principe.',cards:'Mode fiches. Lis la question, réfléchis, puis retourne la fiche : je te donne la réponse et le principe.'};const K=Coach.L,n=S.list.length,mm=(S.m||30);
    const AR={practice:'تمرين: '+n+' أسئلة. اختر جوابًا وسأشرح لك بعد ذلك لماذا هو صحيح أو خاطئ.',exam:'امتحان تجريبي: '+n+' سؤالًا في '+mm+' دقيقة. لا تصحيح أثناء الاختبار، وسأعطيك الحصيلة في النهاية.',errors:'لنراجع أخطاءك. هذه المرة احفظ المبدأ.',cards:'وضع البطاقات. اقرأ السؤال وفكر ثم اقلب البطاقة: سأعطيك الجواب والمبدأ.'};
    const DA={practice:'تمرين: '+n+' د الأسئلة. اختار جواب وأنا نشرح ليك من بعد علاش هو صحيح ولا غالط.',exam:'امتحان تجريبي: '+n+' سؤال فـ '+mm+' دقيقة. ما كاينش تصحيح فالامتحان، وغادي نعطيك الحصيلة فاللخر.',errors:'ياله نراجعو الأخطاء ديالك. هاد المرة حفظ المبدأ.',cards:'وضع البطاقات. قرا السؤال، فكر، ومن بعد قلب البطاقة: نعطيك الجواب والمبدأ.'};
    co().say(K(INTRO[mode]||'',AR[mode],DA[mode]));S.q1=true}
  mode==='cards'?showCard():showQ();
}
function tick(){
  const left=Math.max(0,Math.round((S.end-Date.now())/1000));
  const el=$('#tm');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  if(left<=0)finish();
}

/* ---------- question ---------- */
function showQ(){
  const s=S,q=QM[s.list[s.i]],exam=s.mode==='exam';
  if(!s.ord[s.i])s.ord[s.i]=shuffle([0,1,2,3]);
  setPhoto(q.th);
  const ord=s.ord[s.i],ans=s.ans[s.i],done=!exam&&ans!==undefined,last=s.i===s.list.length-1;
  app.innerHTML=`
  <div class="card ${done?'':'rise'}">
    <div class="thband" style="--tb:${tbg(q.th)}"><span class="em">${EM[q.th]||'📘'}</span><div><b>${esc(THEMES[q.th])}</b><small>Question ${s.i+1} sur ${s.list.length}</small></div></div>
    <div class="meta"><span>Question ${s.i+1}/${s.list.length} · ${esc(THEMES[q.th])}</span>
      ${exam?`<span class="timer" id="tm"></span>`:`<span><span class="score" title="Note canadienne en cours">Note ${fmt(sessScore(s))}</span> ${s.streak>1?`<span class="streak">🔥 ${s.streak}</span> `:''}${esc(q.s)}</span>`}</div>
    <div class="bar" style="margin-bottom:10px"><i style="width:${100*(s.i+(done?1:0))/s.list.length}%"></i></div>
    <div class="q">${esc(q.q)}</div>
    <div id="opts">${ord.map((k,pos)=>{
      let cls='';
      if(done){if(k===q.a)cls='ok';else if(k===ans)cls='ko'}else if(exam&&ans===k)cls='sel';
      const mark=done?(k===q.a?'✓':k===ans?'✗':LET[pos]):LET[pos];
      return`<button class="opt ${cls}" data-k="${k}" ${done?'disabled':''}><span class="k">${mark}</span><span>${esc(q.o[k])}</span></button>`}).join('')}</div>
    ${done?`<div class="fb ${ans===q.a?'ok':ans===SKIP?'sk':'ko'}" role="status"><b>${ans===q.a?'Bonne réponse ! +1 point':ans===SKIP?'Sans réponse : 0 point':'Pas tout à fait. −1 point'}</b> ${ans===q.a?'':ans===SKIP?'Bonne réponse : <b>'+esc(q.o[q.a])+'</b>.<br>':`Ton choix : <s>${esc(q.o[ans])}</s> ✗<br>Bonne réponse : <b>${esc(q.o[q.a])}</b>.<br>`}${esc(q.e)}${(CFG.anch&&CFG.anch[q.th])?`<br><span class="anc">🔗 <b>À ancrer :</b> ${esc(CFG.anch[q.th][0])}</span>`:''}
      ${q.c==='check'?'<br><span class="tag check">⚠ réponse à vérifier avec ton cours</span>':''}${q.c==='sheet'?'<br><span class="tag">coche relevée sur ta photo</span>':''}</div>`:''}
    <div class="row">
      ${exam?`<button id="prev" ${s.i?'':'disabled'}>← Précédente</button>`:'<span></span>'}
      ${exam||done?`<button class="pri" id="next">${last?(exam?'Terminer l’examen':'Voir le bilan'):'Suivante →'}</button>`:`<span class="note"><button class="sm" id="skip">Passer · 0 point</button> Touches 1-4 ou a-d</span>`}
    </div>
    ${exam?`<div class="grid">${s.list.map((_,i)=>`<button class="${s.ans[i]!==undefined?'done':''} ${i===s.i?'cur':''}" data-g="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>`:''}
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k,b));
  if(co()&&ans===undefined){const qq=!!s.q1;s.q1=false;Coach.question({n:s.i+1,total:s.list.length,theme:THEMES[q.th],text:q.q,options:ord.map(k=>q.o[k]),queue:qq})}
  const n=$('#next');if(n){n.onclick=next;if(done)n.focus()}
  const sk=$('#skip');if(sk)sk.onclick=skip;
  const p=$('#prev');if(p)p.onclick=()=>{s.i--;showQ()};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{s.i=+b.dataset.g;showQ()});
  if(exam)tick();
}
function choose(k){
  const s=S,q=QM[s.list[s.i]];
  if(s.mode!=='exam'){
    if(s.ans[s.i]!==undefined)return;s.ans[s.i]=k;const ok=k===q.a;rec(q.id,ok);
    if(ok){s.streak++;if(s.streak>META.best){META.best=s.streak;save()}}else s.streak=0;
    showQ();
    if(co())Coach.answer({ok,chosen:q.o[k],correct:q.o[q.a],expl:q.e,x:q.x,anch:CFG.anch&&CFG.anch[q.th],flag:q.c,streak:s.streak});
    if(ok){const o=app.querySelector('.opt.ok');if(o){const r=o.getBoundingClientRect();burst(s.streak%5===0?60:14,r.left+r.width/2,r.top)}}
    const st=app.querySelector('.streak');if(st&&s.streak>1)st.classList.add('hot');
  }else{s.ans[s.i]=(s.ans[s.i]===k)?undefined:k;showQ()}
}
function skip(){
  const s=S,q=QM[s.list[s.i]];if(s.ans[s.i]!==undefined)return;
  s.ans[s.i]=SKIP;s.streak=0;showQ();
  if(co())Coach.answer({skip:true,correct:q.o[q.a],expl:q.e,x:q.x,anch:CFG.anch&&CFG.anch[q.th]});
}
function next(){if(S.i<S.list.length-1){S.i++;showQ()}else finish()}

/* ---------- bilan ---------- */
function finish(){
  stopTimer();
  const s=S,exam=s.mode==='exam';
  if(exam)s.list.forEach((id,i)=>{if(s.ans[i]!==undefined&&s.ans[i]!==SKIP)rec(id,s.ans[i]===QM[id].a)});
  const res=s.list.map((id,i)=>({q:QM[id],a:s.ans[i]}));
  const ok=res.filter(r=>r.a===r.q.a).length,ko=res.filter(r=>r.a!==undefined&&r.a!==SKIP&&r.a!==r.q.a).length,sk=res.length-ok-ko,tot=res.length,pct=Math.round(100*ok/tot);
  const score=ok-ko,pass=score>tot/2;
  const wrong=res.filter(r=>r.a!==r.q.a);
  const verdict=pass?'Résultat final : tu as réussi !':'Résultat final : tu as été raté.';
  try{META.hist=(META.hist||[]).concat([{d:new Date().toLocaleDateString('fr-FR'),m:({practice:'Entraînement',exam:'Examen',errors:'Erreurs',cards:'Fiches'})[s.mode]||s.mode,s:score,t:tot,p:pass?1:0}]).slice(-20);save()}catch(e){}
  app.innerHTML=`
  <div class="card rise"><div class="meta"><span>${exam?'Résultat de l’examen':'Bilan de la session'}</span></div>
    <div class="final ${pass?'win':'lose'}"><div class="fl">${pass?'RÉUSSI ✅':'RATÉ ❌'}</div><div class="big"><span id="sc">0</span><small> / ${tot}</small></div>
      <div class="note" style="text-align:center">Note canadienne : <b>${ok}</b> juste${ok>1?'s':''} (+${ok}) · <b>${ko}</b> fausse${ko>1?'s':''} (−${ko}) · <b>${sk}</b> sans réponse (0)<br>Seuil de réussite : plus de ${tot/2} points sur ${tot}</div></div>
    <div class="bar" style="margin:10px 0"><i style="width:${Math.max(0,Math.round(100*score/tot))}%"></i></div>
    <p style="text-align:center;margin:0"><b>${verdict}</b></p>
    <div class="row" style="justify-content:center"><button class="pri" id="again">Recommencer</button><button id="gohome">Accueil</button></div>
  </div>
  ${wrong.length?`<div class="card rise"><b>À revoir (${wrong.length})</b>${wrong.map(r=>`
    <div class="err"><div class="note">${esc(THEMES[r.q.th])}</div><div><b>${esc(r.q.q)}</b></div>
    <div style="color:var(--ko)">✗ ${r.a!==undefined&&r.a!==SKIP?'Ta réponse : '+esc(r.q.o[r.a])+' (−1)':'Sans réponse (0)'}</div>
    <div style="color:var(--ok)">✓ ${esc(r.q.o[r.q.a])}</div><div class="note">${esc(r.q.e)}</div>
    ${r.q.c==='check'?'<span class="tag check">⚠ à vérifier avec ton cours</span>':''}</div>`).join('')}</div>`:''}`;
  $('#again').onclick=()=>start(s.mode,s.th,s.n,s.m);$('#gohome').onclick=home;
  if(window.Coach&&wrong.length){const hb=document.createElement('button');hb.id='hear';hb.textContent='🔊 Écouter les corrections';hb.onclick=()=>Coach.say(wrong.map(r=>[Coach.P('qn',wrong.indexOf(r)+1,wrong.length),Coach.C(r.q.q+'.'),Coach.P('correctIs'),Coach.C(r.q.o[r.q.a]+'.'),Coach.P('why'),(Coach.lang!=='fr'&&r.q.x)?{l:'ar',t:r.q.x[Coach.lang==='ar'?0:1]}:Coach.C(r.q.e)]),{force:true});app.querySelector('.row').appendChild(hb)}
  if(co())Coach.summary({ok,ko,sk,tot,pct,score,pass,verdict:verdict,wrong:wrong.length});
  countUp($('#sc'),Math.abs(score),'');if(score<0){const e=$('#sc');setTimeout(()=>e.textContent='−'+Math.abs(score),1000)}
  if(pass)setTimeout(()=>{burst(140);setTimeout(()=>burst(90,cv.width*.2,cv.height*.4),300);setTimeout(()=>burst(90,cv.width*.8,cv.height*.4),500)},350);
}

/* ---------- fiches ---------- */
function showCard(){
  const s=S;
  if(s.i>=s.list.length){app.innerHTML=`<div class="card rise"><div class="big">Terminé 🎉</div><p style="text-align:center">Tu as parcouru les ${s.list.length} fiches.</p><div class="row" style="justify-content:center"><button class="pri" id="again">Recommencer</button><button id="gohome">Accueil</button></div></div>`;$('#again').onclick=()=>start('cards',s.th);$('#gohome').onclick=home;burst(80);if(co())Coach.say(Coach.L('Terminé ! Tu as parcouru toutes les fiches. Bravo.','انتهى! لقد راجعت جميع البطاقات. أحسنت.','سالينا! دزتي على جميع البطاقات. براڤو.'));return}
  const q=QM[s.list[s.i]];
  app.innerHTML=`<div class="card rise">
    <div class="meta"><span>Fiche ${s.i+1}/${s.list.length} · ${esc(THEMES[q.th])}</span><span>${esc(q.s)}</span></div>
    <div class="bar" style="margin-bottom:6px"><i style="width:${100*s.i/s.list.length}%"></i></div>
    <div class="flash"><div>${s.flip?`<div class="note">Réponse</div><div class="q" style="color:var(--ok)">${esc(q.o[q.a])}</div><div>${esc(q.e)}</div>${q.c==='check'?'<span class="tag check">⚠ à vérifier avec ton cours</span>':''}`:`<div class="q">${esc(q.q)}</div><div class="note">Réfléchis, puis retourne la fiche.</div>`}</div></div>
    <div class="row">${s.flip?`<button id="no">À revoir</button><button class="pri" id="yes">Je savais</button>`:`<span></span><button class="pri" id="flip">Voir la réponse</button>`}</div></div>`;
  if(co()){if(s.flip)Coach.say([Coach.P('ans'),Coach.C(q.o[q.a]+'.'),Coach.P('principle'),(Coach.lang!=='fr'&&q.x)?{l:'ar',t:q.x[Coach.lang==='ar'?0:1]}:Coach.C(q.e)]);else if(Coach.opt('q')){const qq=!!s.q1;s.q1=false;Coach.say(q.q,{queue:qq})}}
  const go=ok=>{rec(q.id,ok);s.i++;s.flip=false;showCard()};
  if(s.flip){$('#yes').onclick=()=>go(true);$('#no').onclick=()=>go(false)}
  else $('#flip').onclick=()=>{s.flip=true;showCard()};
}

/* ---------- mémento ---------- */
function memo(){
  const M=CFG.memo;let f='all',term='';
  const draw=()=>{
    const secs=M.sections.map((sec,si)=>{
      if(f!=='all'&&f!==String(si))return'';
      const rows=sec.rows.filter(r=>!term||r.join(' ').toLowerCase().includes(term));
      return rows.length?`<h3 style="margin:16px 0 4px">${esc(sec.title)}${window.Coach?` <button class="sm" data-sp="${si},all">🔊 Tout lire</button>`:''}</h3>`+rows.map((r,ri)=>`<div class="mcard" style="animation-delay:${ri*.04}s"><h4>${esc(r[0])}${window.Coach?` <button class="sm" data-sp="${si},${ri}" aria-label="Écouter ${esc(r[0])}">🔊</button>`:''}</h4><dl>${sec.cols.slice(1).map((c,i)=>`<dt>${esc(c)}</dt><dd>${esc(r[i+1])}</dd>`).join('')}</dl></div>`).join(''):'';
    }).join('');
    $('#mbody').innerHTML=secs||'<p class="note">Aucun résultat.</p>';
  };
  app.innerHTML=`<div class="card rise"><b>📖 Mémento</b>
    <div class="rule">${esc(M.rule)}${window.Coach?` <button class="sm" data-sp="rule">🔊</button>`:''}</div>
    <input class="srch" id="srch" placeholder="Rechercher (auteur, mot-clé…)" aria-label="Rechercher dans le mémento">
    <div class="chips"><button class="chip sm on" data-f="all">Tout</button>${M.sections.map((s,i)=>`<button class="chip sm" data-f="${i}">${esc(s.title)}</button>`).join('')}</div>
    <div id="mbody"></div></div>`;
  const say1=(sec,r)=>sec.cols.length>2||true?r[0]+'. '+sec.cols.slice(1).map((c,i)=>c+' : '+r[i+1]).join('. '):'';
  app.onclick=e=>{const b=e.target.closest('[data-sp]');if(!b||!window.Coach)return;const v=b.dataset.sp;
    if(v==='rule')return Coach.say(M.rulex&&Coach.lang!=='fr'?[{l:'ar',t:M.rulex[Coach.lang==='ar'?0:1]}]:['Règle de distinction fondamentale. '+M.rule],{force:true});
    const [si,ri]=v.split(',');const sec=M.sections[+si];
    Coach.say(ri==='all'?sec.title+'. '+sec.rows.map(r=>say1(sec,r)).join(' . '):say1(sec,sec.rows[+ri]),{force:true})};
  draw();
  if(co())Coach.say(Coach.L('Mémento. Touche le haut-parleur d’une fiche pour que je te l’explique, ou « Tout lire » pour une section entière.','المذكرة. المس مكبر الصوت في أي بطاقة لأشرحها لك، أو «اقرأ الكل» لقسم كامل.','المذكرة. دق على المكبر ديال أي بطاقة باش نشرحها ليك، ولا «قرا الكل» لقسم كامل.'));
  $('#srch').oninput=e=>{term=e.target.value.trim().toLowerCase();draw()};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{f=b.dataset.f;app.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()});
}

/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(window.Coach){if(e.key==='Escape')Coach.stop();else if(e.key.toLowerCase()==='r'&&document.activeElement.tagName!=='INPUT'){Coach.repeat();return}}
  if(!S)return;
  const k=e.key.toLowerCase();
  if(S.mode==='cards'){if(k===' '||k==='enter'){const b=$('#flip');if(b){e.preventDefault();b.click()}}return}
  const pos=['1','2','3','4'].indexOf(k)>=0?+k-1:LET.indexOf(k);
  if(pos>=0&&S.ord[S.i]&&document.activeElement.tagName!=='INPUT'){choose(S.ord[S.i][pos]);return}
  if((k==='enter'||k==='arrowright')&&$('#next')){e.preventDefault();$('#next').click()}
  else if(k==='arrowleft'&&$('#prev'))$('#prev').click();
});
home();
</script>
</body>
</html>
