<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards Auteurs · Thématiques 1 à 12 · Concours promotion interne OFPPT</title>
<meta name="description" content="Flashcards pour mémoriser les auteurs, leurs idées centrales et leurs mots-clés des 12 thématiques pédagogiques du concours de promotion interne OFPPT.">
<meta name="theme-color" content="#9E1B32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#fff;--text:#212529;--muted:#5C6670;--primary:#9E1B32;--primary-dark:#7E1527;--primary-soft:#F7E9EC;--navy:#1F3A5F;--navy-soft:#E8EEF6;--ok:#1E7B4F;--ok-soft:#E6F4EC;--ko:#B42318;--ko-soft:#FDECEA;--line:#E1E4E8;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.08);--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.55;font-size:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.bt{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap}
.bs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:none;gap:8px}.live.on{display:flex}
.pill{background:var(--navy-soft);color:var(--navy);padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.pill.g{background:var(--ok-soft);color:var(--ok)}.pill.r{background:var(--ko-soft);color:var(--ko)}
.progress{height:6px;background:#EBEDF0}.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#C0334D);transition:width .3s}
main{max-width:880px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
h1{margin:6px 0;font-size:clamp(1.35rem,3.6vw,1.85rem);line-height:1.25}
h2{font-size:1.05rem;margin:24px 0 12px}
p.sub{margin:0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px}.stat b{display:block;font-size:1.25rem;color:var(--primary);line-height:1.2}.stat span{font-size:12px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.th{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.th:hover{border-color:#C9CED4}.th[aria-checked=true]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.th .b{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);display:block}
.th .t{display:block;font-weight:600;font-size:14.5px;line-height:1.35;margin:2px 0 4px;padding-right:22px}
.th .n{font-size:12px;color:var(--muted)}
.th .c{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid #C4C9CF;background:#fff;color:#fff;font-size:12px;display:grid;place-items:center}
.th[aria-checked=true] .c{background:var(--primary);border-color:var(--primary)}
.th.all{grid-column:1/-1}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:10px;font-size:14.5px}
.opt input{width:18px;height:18px;accent-color:var(--primary);margin-top:3px;flex:none}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover:not(:disabled){background:var(--primary-dark)}.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-g{background:#fff;border:1.5px solid var(--line)}.btn-g:hover{background:#FAFAFB;border-color:#C0C5CB}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{filter:brightness(.92)}
.btn-ko{background:#fff;color:var(--ko);border:1.5px solid #F0B8B2}.btn-ko:hover{background:var(--ko-soft)}
.btn-lg{padding:14px 28px;font-size:1.02rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.muted-link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-top:14px}

/* Carte */
.deckhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:999px}
.cnt{font-size:13px;color:var(--muted);font-weight:500}
.scene{perspective:1400px}
.flip{display:grid;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.flip.is-back{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:340px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column}
.face.front{align-items:center;justify-content:center;text-align:center;border-top:5px solid var(--primary)}
.face.back{transform:rotateY(180deg);border-top:5px solid var(--navy)}
.face .tag{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
.face.front .name{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;line-height:1.2;color:var(--primary);letter-spacing:-.01em}
.face.front .qtext{font-size:clamp(1.02rem,3.2vw,1.2rem);font-weight:500;line-height:1.55;color:var(--text);max-width:640px}
.face .fond{display:inline-block;margin-top:12px;background:#FFF4D6;color:#7A5A00;border:1px solid #F0DC9C;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.face .hint{margin-top:22px;font-size:12.5px;color:var(--muted)}
.face.back h3{margin:0 0 8px;font-size:1.15rem;color:var(--primary)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin:12px 0 4px}
.idees{margin:0;font-size:15.5px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:var(--navy-soft);color:var(--navy);padding:3px 11px;border-radius:999px}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.rate .btn{padding:14px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.nav .btn{padding:9px 16px;font-size:14px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:11.5px}
.res{text-align:center}
.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:8px auto 14px;background:conic-gradient(var(--ok) calc(var(--p)*1%),#F4C7C2 0);display:grid;place-items:center}
.ring i{width:134px;height:134px;border-radius:50%;background:#fff;display:grid;align-content:center;place-items:center;font-style:normal}
.ring b{font-size:2.1rem;line-height:1;color:var(--ok)}.ring span{font-size:12.5px;color:var(--muted)}
.res .actions{justify-content:center}
.hidden{display:none!important}
@media(max-width:560px){.panel{padding:18px 16px}.bs{display:none}body.inq .bt{display:none}.face{min-height:380px;padding:22px 18px}.actions{flex-direction:column}.actions .btn{width:100%}}
@media(prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="mark" aria-hidden="true">F</div><div style="min-width:0"><div class="bt">Flashcards Auteurs · Thématiques 1 à 12</div><div class="bs">Concours de promotion interne OFPPT · Ingénierie pédagogique</div></div></div>
    <div class="live" id="live" aria-live="polite"><span class="pill g" id="lk">✓ 0</span><span class="pill r" id="lr">↻ 0</span><span class="pill" id="lp">1 / 1</span></div>

  <div class="progress" role="progressbar" id="pbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="pfill" id="pfill"></div></div>
</header>

<script>
"use strict";
var DATA={"cards": [{"t": 1, "k": "a", "a": "Flavell (1976-79)", "f": true, "i": "Fondateur du concept : la métacognition est la connaissance que l'on a de ses propres processus cognitifs et le contrôle que l'on exerce sur eux. Il distingue les connaissances métacognitives (sur la personne, la tâche, les stratégies) et les expériences métacognitives (sentiments conscients pendant la tâche : « je ne comprends pas »).", "m": "Penser sur sa propre pensée ; connaissances (soi – tâche – stratégies) ; expériences métacognitives"}, {"t": 1, "k": "a", "a": "Brown (1978)", "f": false, "i": "Met l'accent sur la régulation : planifier, contrôler (monitoring), évaluer, réviser son action. Elle oppose la connaissance de la cognition à la régulation de la cognition ; les experts régulent mieux que les novices.", "m": "Régulation métacognitive ; planifier – contrôler – évaluer ; contrôle exécutif"}, {"t": 1, "k": "a", "a": "Nelson & Narens (1990)", "f": false, "i": "Modèle à deux niveaux : le niveau objet (la tâche en cours) et le niveau méta, qui contient un modèle de l'objet. L'information remonte par le monitoring (évaluer où j'en suis) et la décision redescend par le contrôle (poursuivre, relire, changer de stratégie).", "m": "Niveau objet / niveau méta ; monitoring ; contrôle ; jugement de savoir"}, {"t": 1, "k": "a", "a": "Schraw & Dennison (1994)", "f": false, "i": "Auteurs du MAI (Metacognitive Awareness Inventory), outil d'auto-évaluation. Deux composantes : la connaissance de la cognition (déclarative, procédurale, conditionnelle) et la régulation (planification, gestion de l'information, débogage, évaluation).", "m": "MAI ; connaissance vs régulation ; savoir déclaratif / procédural / conditionnel ; débogage"}, {"t": 1, "k": "a", "a": "Zimmerman (années 1990-2000)", "f": false, "i": "Apprentissage autorégulé en trois phases cycliques : anticipation (analyse de la tâche, buts, auto-efficacité), contrôle volitionnel (autocontrôle, auto-observation) et auto- réflexion (auto-jugement, attributions). L'apprenant boucle ensuite sur la tâche suivante.", "m": "Anticipation ; contrôle volitionnel ; auto-réflexion ; autorégulation ; buts"}, {"t": 1, "k": "a", "a": "Vygotski", "f": false, "i": "Le langage extériorisé devient langage intérieur, qui sert d'instrument de planification et de contrôle de l'action. Faire verbaliser le geste (à voix haute) aide donc l'apprenant à l'organiser et à le réguler.", "m": "Langage intérieur ; internalisation ; médiation ; verbalisation"}, {"t": 1, "k": "a", "a": "Bandura", "f": false, "i": "L'auto-observation du geste, suivie d'un auto-jugement, nourrit le sentiment d'auto- efficacité, qui soutient les buts fixés et la persévérance face aux difficultés. Une observation guidée (grille, vidéo) renforce cette boucle.", "m": "Auto-observation ; auto- jugement ; auto-efficacité ; persévérance"}, {"t": 1, "k": "a", "a": "Piaget", "f": false, "i": "Réussir n'est pas comprendre : la réussite pratique précède la compréhension conceptuelle. La prise de conscience se construit par abstraction réfléchissante, en revenant sur ses propres actions pour en extraire les coordinations.", "m": "Réussir ≠ comprendre ; abstraction réfléchissante ; prise de conscience"}, {"t": 1, "k": "a", "a": "Vermersch · Pastré", "f": false, "i": "Vermersch : l'entretien d'explicitation donne accès au vécu de l'action, en bonne partie implicite. Pastré : la conceptualisation se fait dans l'action même ; le geste repose sur une structure conceptuelle de la situation que l'on peut rendre explicite.", "m": "Explicitation ; vécu de l'action ; implicite ; conceptualisation dans l'action"}, {"t": 1, "k": "p", "a": "Piège QCM", "f": false, "i": "Flavell ≠ Brown : Flavell définit le concept, Brown insiste sur la régulation.", "m": ""}, {"t": 1, "k": "x", "a": "Terrain topo", "f": false, "i": "Avant d'enregistrer une station, le stagiaire énonce son plan de contrôle (fermeture angulaire, hauteur de prisme, aller-retour).", "m": ""}, {"t": 2, "k": "a", "a": "Miller (1956)", "f": false, "i": "L'empan de la mémoire immédiate est d'environ 7 ± 2 éléments, extensible par le regroupement en unités (chunking). Cowan (2001) a révisé cette limite à 4 ± 1 éléments.", "m": "7 ± 2 ; chunking ; empan ; capacité limitée"}, {"t": 2, "k": "a", "a": "Baddeley & Hitch (1974)", "f": false, "i": "Modèle multi-composants de la mémoire de travail : un administrateur central coordonne la boucle phonologique et le calepin visuo-spatial (buffer épisodique ajouté en 2000). On ne retient pas tout simultanément.", "m": "Mémoire de travail ; administrateur central ; boucle phonologique ; calepin visuo-spatial"}, {"t": 2, "k": "a", "a": "Sweller (1988)", "f": true, "i": "Fondateur de la théorie de la charge cognitive : mémoire de travail limitée, mémoire à long terme riche en schémas, qui s'automatisent. Trois charges : intrinsèque (complexité du contenu), extrinsèque (liée à la mauvaise présentation, à réduire) et essentielle / germane (effort utile à la construction des schémas, à favoriser).", "m": "Charge intrinsèque / extrinsèque / essentielle ; schémas ; automatisation"}, {"t": 2, "k": "a", "a": "Chandler & Sweller", "f": false, "i": "Effet d'attention partagée : quand le texte est séparé du schéma, l'apprenant doit les intégrer mentalement, ce qui coûte de la mémoire de travail. Solution : intégrer l'information (légendes sur le schéma).", "m": "Attention partagée ; coût d'intégration ; format intégré"}, {"t": 2, "k": "a", "a": "Kalyuga (2003)", "f": false, "i": "Effet d'inversion de l'expertise : l'étayage utile au novice devient redondant et gêne l'expert. Le guidage doit donc s'adapter au niveau et diminuer avec la progression.", "m": "Inversion de l'expertise ; novice / expert ; redondance ; étayage dégressif"}, {"t": 2, "k": "a", "a": "Kirschner, Sweller & Clark (2006)", "f": false, "i": "Le guidage minimal (apprentissage par découverte pure) échoue chez les novices, car il surcharge la mémoire de travail. Un enseignement explicite et guidé est plus efficace au début.", "m": "Guidage minimal ; découverte ; enseignement explicite ; novices"}, {"t": 2, "k": "a", "a": "Paas", "f": false, "i": "Échelle d'effort mental perçu en 9 points : mesure subjective de la charge cognitive, croisée avec la performance pour estimer l'efficience de la formation.", "m": "Effort mental ; échelle à 9 points ; mesure subjective ; efficience"}, {"t": 2, "k": "a", "a": "Mayer (2001)", "f": false, "i": "Apprentissage multimédia : double canal (visuel / auditif), capacité limitée, traitement actif. Supports non redondants : cohérence (rien d'inutile), contiguïté (texte près de l'image), modalité (voix + image), signalement.", "m": "Double canal ; cohérence ; contiguïté ; modalité ; redondance"}, {"t": 2, "k": "a", "a": "van Merriënboer (4C/ID)", "f": false, "i": "Pour les tâches complexes : tâches d'apprentissage entières, informations de soutien, informations procédurales délivrées juste-à-temps et entraînement des routines. Complexité croissante, étayage dégressif.", "m": "4C/ID ; tâches complexes ; juste-à-temps ; étayage dégressif"}, {"t": 2, "k": "a", "a": "Vygotski", "f": false, "i": "ZPD : le curseur du dosage de la difficulté. La tâche doit dépasser un peu le niveau actuel, avec étayage, pour rester ni trop facile ni trop lourde.", "m": "ZPD ; étayage ; dosage de la difficulté"}, {"t": 2, "k": "p", "a": "Piège QCM", "f": false, "i": "Intrinsèque = difficulté de la tâche (séquençable) ; extrinsèque = mauvaise présentation (à réduire) ; essentielle = effort utile (à favoriser).", "m": ""}, {"t": 2, "k": "x", "a": "Terrain topo", "f": false, "i": "Mise en station en 3 temps isolés (centrage / calage / visée) puis fusion par étayage dégressif.", "m": ""}, {"t": 3, "k": "a", "a": "Vermersch (1994)", "f": true, "i": "Fondateur de l'entretien d'explicitation : accès au vécu de l'action, par un questionnement non inductif centré sur un moment singulier, daté et précis. Il privilégie le « comment » (déroulé) plutôt que le « pourquoi » (justification). L'interviewé est amené à évoquer la situation, et l'intervieweur relance et reformule.", "m": "Explicitation ; vécu de l'action ; moment singulier ; comment ≠ pourquoi ; évocation"}, {"t": 3, "k": "a", "a": "Schön (1983)", "f": false, "i": "Praticien réflexif : le savoir est caché dans l'agir (savoir tacite). Il distingue la réflexion dans l'action (en cours) et sur l'action (après coup) pour mettre au jour ce savoir.", "m": "Praticien réflexif ; savoir dans l'agir ; réflexion dans / sur l'action"}, {"t": 3, "k": "a", "a": "Argyris & Schön (1974-78)", "f": false, "i": "Théorie professée (ce que je dis faire) vs théorie d'usage (ce que je fais vraiment). Apprentissage en simple boucle (corriger l'action) et en double boucle (remettre en cause valeurs et présupposés).", "m": "Théorie professée / d'usage ; simple / double boucle"}, {"t": 3, "k": "a", "a": "Pastré", "f": false, "i": "Didactique professionnelle : analyser le travail pour former. Elle met au jour les concepts pragmatiques, qui organisent l'action, et la structure conceptuelle de la situation.", "m": "Didactique professionnelle ; concepts pragmatiques ; structure conceptuelle de la situation"}, {"t": 3, "k": "a", "a": "Clot", "f": false, "i": "Clinique de l'activité : l'activité réalisée n'est qu'une part du réel de l'activité (celle qui est empêchée, non faite, compte aussi). Autoconfrontation simple et croisée : le professionnel se voit agir, commente avec un pair ; cela développe son pouvoir d'agir.", "m": "Clinique de l'activité ; autoconfrontation ; activité empêchée ; pouvoir d'agir"}, {"t": 3, "k": "a", "a": "Flanagan (1954)", "f": false, "i": "Technique des incidents critiques : on recueille des faits observables, réussis ou ratés, pour identifier les comportements décisifs dans une activité. Basée sur des situations réelles et précises, pas sur des opinions.", "m": "Incident critique ; faits observables ; situation réelle"}, {"t": 3, "k": "a", "a": "Rogers", "f": false, "i": "Écoute active : reformulation, empathie, considération positive et congruence. Le formateur n'interprète pas, il aide la personne à clarifier elle-même (non-directivité).", "m": "Écoute active ; reformulation ; empathie ; non-directivité"}, {"t": 3, "k": "a", "a": "Piaget", "f": false, "i": "La prise de conscience n'est pas donnée avec la réussite : elle va des résultats (périphérie) vers les mécanismes de l'action (centre). Il faut donc questionner pour passer du savoir-faire à sa conceptualisation.", "m": "Prise de conscience ; réussite pratique ; conceptualisation"}, {"t": 3, "k": "a", "a": "Altet · Paquay · Perrenoud", "f": false, "i": "Analyse des pratiques en formation des enseignants : dispositifs de groupe visant une posture réflexive durable. Altet propose une analyse plurielle (plusieurs regards sur la même pratique).", "m": "Analyse de pratiques ; analyse plurielle ; posture réflexive"}, {"t": 3, "k": "p", "a": "Piège QCM", "f": false, "i": "Vermersch = explicitation (le comment) ≠ Schön = réflexivité (dans / sur l'action). Le « pourquoi » déclenche la rationalisation.", "m": ""}, {"t": 3, "k": "x", "a": "Terrain topo", "f": false, "i": "Expliciter une erreur de fermeture : reconstituer le déroulé réel du cheminement, ne pas livrer la cause d'emblée.", "m": ""}, {"t": 4, "k": "a", "a": "Tyler (1949)", "f": false, "i": "Racine de l'ingénierie curriculaire. Quatre questions : quels objectifs, quelles expériences d'apprentissage, comment les organiser, comment évaluer. Logique : objectifs → expériences → évaluation.", "m": "Objectifs ; expériences d'apprentissage ; organisation ; évaluation"}, {"t": 4, "k": "a", "a": "Bloom (1956) · Anderson & Krathwohl (2001)", "f": false, "i": "Taxonomie des objectifs cognitifs, de la mémorisation à la création. La version révisée de 2001 : se souvenir, comprendre, appliquer, analyser, évaluer, créer, croisés avec des types de connaissances. Elle sert à choisir le niveau visé.", "m": "Taxonomie ; niveaux cognitifs ; verbes d'action ; mémoriser → créer"}, {"t": 4, "k": "a", "a": "Mager (1962)", "f": false, "i": "Objectif opérationnel : décrire un comportement observable, la condition de réalisation et le critère de réussite. Ex. : « avec la station totale, implanter un point à ±5 mm ».", "m": "Comportement ; condition ; critère ; observable / mesurable"}, {"t": 4, "k": "a", "a": "Biggs (1996)", "f": true, "i": "Fondateur de l'alignement constructif : les objectifs, les activités d'apprentissage et l'évaluation sont conçus ensemble, à partir de ce que l'apprenant doit être capable de faire. Il propose la taxonomie SOLO, qui classe la qualité de la compréhension (de la simple information à l'abstraction).", "m": "Alignement constructif ; taxonomie SOLO ; cohérence objectifs – activités – évaluation"}, {"t": 4, "k": "a", "a": "Wiggins & McTighe (1998)", "f": false, "i": "Conception à rebours (backward design) : on part des résultats attendus, puis on définit les preuves acceptables (évaluation), et enfin les activités. Vise une compréhension durable, par des tâches authentiques.", "m": "Backward design ; résultats ; preuves ; tâche authentique"}, {"t": 4, "k": "a", "a": "Le Boterf", "f": true, "i": "La compétence est un savoir-agir en situation : mobiliser et combiner des ressources (internes et externes). Elle suppose savoir-agir (savoirs, capacités), vouloir-agir (motivation) et pouvoir-agir (contexte, moyens).", "m": "Savoir-agir ; vouloir-agir ; pouvoir-agir ; mobiliser des ressources ; situation"}, {"t": 4, "k": "a", "a": "Perrenoud", "f": false, "i": "La compétence est la capacité de mobiliser des ressources pour faire face à une famille de situations ; elle ne se manifeste et ne s'évalue qu'en situation, donc pas par un simple QCM.", "m": "Mobilisation de ressources ; famille de situations ; évaluation en situation"}, {"t": 4, "k": "a", "a": "Tardif", "f": false, "i": "Compétence = savoir-agir complexe, qui combine des ressources variées pour une famille de situations. Elle se développe selon une trajectoire, avec des paliers d'évaluation tout au long de la formation.", "m": "Savoir-agir complexe ; trajectoire de développement ; paliers"}, {"t": 4, "k": "a", "a": "De Ketele & Roegiers", "f": false, "i": "Pédagogie de l'intégration : après l'acquisition des ressources, on propose des situations d'intégration significatives et complexes pour les mobiliser ensemble ; évaluation par critères.", "m": "Pédagogie de l'intégration ; situation d'intégration ; ressources ; critères"}, {"t": 4, "k": "p", "a": "Piège QCM", "f": false, "i": "Biggs ≠ Bloom : Biggs = cohérence de la chaîne ; Bloom = niveaux d'objectifs.", "m": ""}, {"t": 4, "k": "x", "a": "Terrain topo", "f": false, "i": "Compétence : « réaliser un levé rattaché au système de coordonnées national », évaluée sur la situation réelle, pas par QCM.", "m": ""}, {"t": 5, "k": "a", "a": "Dewey", "f": false, "i": "Apprendre en faisant, à condition que le faire soit problématisé : l'expérience n'éduque que si elle est suivie de réflexion à partir d'une situation problématique (enquête).", "m": "Learning by doing ; expérience ; problématisation ; enquête"}, {"t": 5, "k": "a", "a": "Vygotski · Bruner (Wood, Bruner & Ross, 1976)", "f": false, "i": "ZPD : l'apprenant réussit avec aide ce qu'il ne réussit pas seul. Étayage (scaffolding) : l'adulte réduit la complexité, maintient l'orientation, démontre, puis retire progressivement son aide.", "m": "ZPD ; étayage ; guidage ; retrait progressif"}, {"t": 5, "k": "a", "a": "Gagné (1965)", "f": false, "i": "Neuf événements de l'instruction, comme trame de séquence : attention, objectif, rappel des prérequis, présentation, guidage, performance, feedback, évaluation, rétention / transfert.", "m": "Événements de l'instruction ; prérequis ; guidage ; feedback ; transfert"}, {"t": 5, "k": "a", "a": "Kolb (1984)", "f": true, "i": "Cycle expérientiel : expérience concrète → observation réfléchie → conceptualisation → expérimentation. La théorie arrive après l'expérience et est testée à nouveau en pratique. Il décrit aussi quatre styles d'apprentissage.", "m": "Expérience concrète ; observation réfléchie ; conceptualisation ; expérimentation"}, {"t": 5, "k": "a", "a": "Meirieu", "f": false, "i": "Situation-problème : un obstacle réel, franchissable avec des ressources, crée le besoin d'apprendre. La consigne est une tâche à réaliser, la théorie est une réponse à un problème déjà éprouvé.", "m": "Situation-problème ; obstacle ; besoin d'apprendre ; ressources"}, {"t": 5, "k": "a", "a": "Pastré", "f": true, "i": "Simulation en didactique professionnelle : on s'appuie sur une situation de référence (réelle) et sur sa structure conceptuelle, puis on la simule pour apprendre avec un débriefing.", "m": "Simulation ; situation de référence ; structure conceptuelle ; débriefing"}, {"t": 5, "k": "a", "a": "Collins, Brown & Newman (1989)", "f": false, "i": "Cognitive apprenticeship : l'expert modèle son geste (modeling), guide (coaching), étaye (scaffolding), fait verbaliser (articulation), réfléchir et explorer, puis estompe son aide (fading).", "m": "Modeler ; guider ; estomper ; articulation ; réflexion ; exploration"}, {"t": 5, "k": "a", "a": "Lave & Wenger (1991)", "f": false, "i": "Cognition située : on apprend dans l'activité, en communauté. La participation périphérique légitime : le novice participe à des tâches réelles, d'abord simples, vers une pleine participation.", "m": "Cognition située ; participation périphérique légitime ; communauté de pratique"}, {"t": 5, "k": "a", "a": "Malglaive", "f": false, "i": "Savoirs en usage : savoirs théoriques, procéduraux et pratiques s'articulent dans l'action. Alternance intégrative théorie / pratique : chacune éclaire l'autre.", "m": "Savoirs en usage ; alternance intégrative ; savoirs théoriques / procéduraux / pratiques"}, {"t": 5, "k": "p", "a": "Piège QCM", "f": false, "i": "Savoir inerte = mémorisé mais jamais mobilisé. Alternance intégrative ≠ juxtaposition.", "m": ""}, {"t": 5, "k": "x", "a": "Terrain topo", "f": false, "i": "Cubature déclenchée par une commande réelle de terrassement : la formule arrive comme réponse à un problème déjà éprouvé.", "m": ""}, {"t": 6, "k": "a", "a": "Thorndike & Woodworth (1901)", "f": false, "i": "Transfert par éléments identiques : on transfère d'une situation à l'autre dans la mesure où elles partagent des éléments communs. Le transfert est surtout proche, lié à la ressemblance.", "m": "Éléments identiques ; ressemblance des situations ; transfert proche"}, {"t": 6, "k": "a", "a": "Judd (1908)", "f": false, "i": "Transfert par généralisation de principes : comprendre le principe sous-jacent (expérience sur la réfraction et le tir sur cible immergée) permet de l'appliquer à des situations nouvelles.", "m": "Généralisation ; principes ; compréhension ; transfert lointain"}, {"t": 6, "k": "a", "a": "Baldwin & Ford (1988)", "f": true, "i": "Fondateurs du modèle de transfert de formation : trois facteurs, caractéristiques de l'apprenant (aptitudes, motivation), design de la formation (principes d'apprentissage, contenus) et environnement de travail (soutien, occasion d'appliquer), qui conditionnent généralisation et maintien.", "m": "Apprenant ; design de formation ; environnement de travail ; généralisation ; maintien"}, {"t": 6, "k": "a", "a": "Tardif (1999)", "f": true, "i": "Le transfert est un processus enseignable et non spontané : il faut travailler la contextualisation, la décontextualisation et la recontextualisation, en variant les situations d'une même famille.", "m": "Transfert enseignable ; contextualisation / décontextualisation ; familles de situations"}, {"t": 6, "k": "a", "a": "Perkins & Salomon (1988-92)", "f": false, "i": "Voie basse : automatismes très exercés, déclenchés par une situation similaire. Voie haute : abstraction consciente et délibérée, par rapprochement (bridging) de principes entre situations différentes.", "m": "Voie basse / voie haute ; automatismes ; abstraction consciente"}, {"t": 6, "k": "a", "a": "Bransford & Schwartz (1999)", "f": false, "i": "Préparation à l'apprentissage futur : on évalue la capacité à apprendre dans une situation nouvelle (avec accès à des ressources), plutôt que la réutilisation directe de ce qui a été appris.", "m": "Préparation à l'apprentissage futur ; transfert dynamique"}, {"t": 6, "k": "a", "a": "Kirkpatrick (1959)", "f": false, "i": "Quatre niveaux d'évaluation : réaction, apprentissage, comportement, résultats. Le niveau 3 (comportement) correspond au transfert en situation de travail.", "m": "Réaction ; apprentissage ; comportement ; résultats ; niveau 3 = transfert"}, {"t": 6, "k": "a", "a": "Holton (1996)", "f": false, "i": "Climat de transfert : soutien des collègues et du supérieur, occasion d'appliquer, feedback sur le travail. Il est mesuré par le LTSI.", "m": "Climat de transfert ; soutien ; opportunité ; LTSI"}, {"t": 6, "k": "a", "a": "Lave & Wenger · Bandura", "f": false, "i": "Lave & Wenger : apprentissage situé, lié à son contexte d'usage. Bandura : l'auto- efficacité conditionne l'oser-faire sur le poste.", "m": "Apprentissage situé ; auto- efficacité ; contexte"}, {"t": 6, "k": "p", "a": "Piège QCM", "f": false, "i": "Transfert proche vs lointain ; voie basse vs voie haute. Évaluer s'arrête trop souvent aux niveaux 1-2 de Kirkpatrick.", "m": ""}, {"t": 6, "k": "x", "a": "Terrain topo", "f": false, "i": "Même implantation en station totale puis en GNSS RTK avec contrôle croisé : l'apprenant abstrait le principe.", "m": ""}, {"t": 7, "k": "a", "a": "Knowles (1970-84)", "f": true, "i": "Fondateur de l'andragogie. Six principes : besoin de savoir pourquoi apprendre, concept de soi autonome, expérience comme ressource, disposition à apprendre liée aux rôles sociaux, orientation vers la résolution de problèmes, motivation intrinsèque. Le formateur est facilitateur.", "m": "Andragogie ; autonomie ; expérience ; besoin de savoir ; rôles sociaux ; problèmes ; motivation interne"}, {"t": 7, "k": "a", "a": "Rogers (1969)", "f": false, "i": "Approche centrée sur l'apprenant : le formateur facilite par la congruence (authenticité), l'empathie et la considération positive inconditionnelle. L'apprentissage est significatif lorsqu'il est personnellement impliquant.", "m": "Congruence ; empathie ; considération positive ; apprentissage significatif"}, {"t": 7, "k": "a", "a": "Carré (2005)", "f": false, "i": "Apprenance : disposition durable à apprendre dans toutes les situations de vie. Il distingue des motifs d'engagement (épistémiques, socio-affectifs, hédoniques, identitaires, économiques…) que le formateur doit repérer.", "m": "Apprenance ; disposition durable ; motifs d'engagement"}, {"t": 7, "k": "a", "a": "Mezirow (1978-91)", "f": false, "i": "Apprentissage transformateur : un dilemme désorientant conduit l'adulte à une réflexion critique sur ses cadres de référence (perspectives de sens) et à leur révision.", "m": "Cadres de référence ; dilemme désorientant ; réflexion critique ; transformation"}, {"t": 7, "k": "a", "a": "Lindeman", "f": false, "i": "Précurseur de l'éducation des adultes (1926) : l'expérience est le « livre vivant » de l'adulte ; l'éducation part des situations de vie, pas de matières scolaires.", "m": "Expérience ; livre vivant ; situations de vie"}, {"t": 7, "k": "a", "a": "Bandura", "f": false, "i": "Auto-efficacité dégradée par un échec scolaire antérieur : l'adulte peut douter de sa capacité. Elle se reconstruit par expériences de réussite, modèles proches, encouragements.", "m": "Auto-efficacité ; échec antérieur ; expériences de maîtrise"}, {"t": 7, "k": "a", "a": "Deci & Ryan (1985)", "f": false, "i": "Autodétermination : la motivation intrinsèque est soutenue par trois besoins, autonomie (choix), compétence (réussite visible) et affiliation (lien aux autres).", "m": "Autodétermination ; autonomie ; compétence ; affiliation"}, {"t": 7, "k": "a", "a": "Meirieu · Dumazedier", "f": false, "i": "Dumazedier : éducation permanente et autoformation tout au long de la vie. Meirieu : le formateur ne peut pas apprendre à la place de l'autre ; l'apprenant doit s'engager, choisir d'apprendre.", "m": "Engagement ; autoformation ; éducation permanente"}, {"t": 7, "k": "p", "a": "Piège QCM", "f": false, "i": "Andragogie (adultes) ≠ pédagogie (enfants) ; l'expérience est ressource ET obstacle.", "m": ""}, {"t": 7, "k": "x", "a": "Terrain topo", "f": false, "i": "Séquence sur les tolérances construite à partir d'une litige de bornage rapporté par un stagiaire.", "m": ""}, {"t": 8, "k": "a", "a": "Perrenoud (1997)", "f": true, "i": "Pédagogie différenciée : différencier, c'est multiplier les situations d'apprentissage (variété de tâches, de supports, d'organisations), pas les niveaux d'exigence. Il rattache la différenciation à la lutte contre les inégalités et à une régulation continue des apprentissages.", "m": "Différenciation ; variété de situations ; régulation ; inégalités ; même exigence"}, {"t": 8, "k": "a", "a": "Bloom", "f": false, "i": "Pédagogie de maîtrise : faire varier le temps et l'aide, pas l'objectif. Évaluation formative, puis correctifs et enrichissements pour que la plupart des apprenants atteignent la maîtrise.", "m": "Pédagogie de maîtrise ; évaluation formative ; temps et aide ; remédiation"}, {"t": 8, "k": "a", "a": "Meirieu", "f": false, "i": "Différenciation successive (variée pour tous : on change de méthode au fil du temps) vs simultanée (des activités distinctes au même moment pour des groupes). La différenciation reste liée à un projet commun.", "m": "Différenciation successive / simultanée ; variété des méthodes ; groupes"}, {"t": 8, "k": "a", "a": "Vygotski · Bruner", "f": false, "i": "ZPD : l'écart entre ce que l'apprenant réussit seul et avec aide. Étayage différencié : le niveau d'aide s'ajuste à chacun, puis se réduit.", "m": "ZPD ; étayage différencié ; médiation"}, {"t": 8, "k": "a", "a": "Astolfi (1997)", "f": false, "i": "L'erreur est un outil de diagnostic : elle révèle les représentations et obstacles de l'apprenant. Il propose une typologie des erreurs pour décider de la remédiation.", "m": "Erreur ; diagnostic ; typologie des erreurs ; obstacle"}, {"t": 8, "k": "a", "a": "Rosenthal & Jacobson (1968)", "f": false, "i": "Effet Pygmalion : les attentes de l'enseignant influencent les résultats, par une prophétie auto-réalisatrice. Le formateur doit contrôler ses biais envers les stagiaires jugés faibles.", "m": "Effet Pygmalion ; attentes ; prophétie auto-réalisatrice"}, {"t": 8, "k": "a", "a": "Legrand · Przesmycki", "f": false, "i": "Pédagogie différenciée en France : Legrand en pose le cadre, Przesmycki propose une démarche (diagnostic, contrat, groupes de besoin, évaluation).", "m": "Pédagogie différenciée ; groupes de besoin ; contrat ; démarche"}, {"t": 8, "k": "a", "a": "Tomlinson", "f": false, "i": "Differentiated instruction : on différencie les contenus, les processus, les productions et l'environnement, selon le niveau de préparation, les intérêts et le profil des apprenants.", "m": "Contenus ; processus ; productions ; environnement"}, {"t": 8, "k": "p", "a": "Piège QCM", "f": false, "i": "Différenciation abaissante = baisser l'exigence ; équité ≠ égalité ; groupes de besoin temporaires.", "m": ""}, {"t": 8, "k": "x", "a": "Terrain topo", "f": false, "i": "Chantier-école : rôles (opérateur, carnetier, calculateur, contrôleur) avec rotation obligatoire.", "m": ""}, {"t": 9, "k": "a", "a": "Modèle social du handicap · CIF-OMS", "f": false, "i": "Le handicap n'est pas une propriété de la personne : il naît de l'interaction entre une déficience (altération d'une fonction) et un environnement non accessible (barrières physiques, pédagogiques, organisationnelles, attitudinales). Ce modèle, porté notamment par Oliver, s'oppose au modèle médical centré sur le « déficit à corriger ». La CIF de l'OMS (2001) en est la traduction institutionnelle : elle décrit fonctions, activités, participation et facteurs environnementaux. Pour le formateur : analyser d'abord la situation (supports, consignes, lieux, rythme) avant de chercher à normaliser l'apprenant.", "m": "Interaction déficience × environnement ; situation de handicap ; barrières / facilitateurs ; participation ; modèle médical vs modèle social"}, {"t": 9, "k": "a", "a": "CAST — UDL", "f": false, "i": "La Conception universelle de l'apprentissage (Rose & Meyer, CAST) part du constat que la variabilité entre apprenants est la règle. Plutôt que d'ajouter des aménagements après coup, on conçoit dès le départ des parcours flexibles reposant sur trois principes : multiples moyens d'engagement (le « pourquoi » d'apprendre), de représentation (le « quoi » : formats variés de l'information) et d'action / expression (le « comment » : manières de montrer ses acquis). L'objectif est de former des apprenants experts, motivés et autonomes.", "m": "Engagement ; représentation ; action et expression ; variabilité ; flexibilité ; apprenant expert ; barrières du curriculum"}, {"t": 9, "k": "a", "a": "Booth & Ainscow (2002)", "f": false, "i": "L'Index for Inclusion est un outil d'auto-évaluation et de développement des établissements. Il structure l'inclusion en trois dimensions : créer des cultures inclusives (valeurs, communauté), élaborer des politiques inclusives (organisation, soutien) et développer des pratiques inclusives (mobilisation des ressources, enseignement). L'inclusion y est un processus sans fin de réduction des obstacles à l'apprentissage et à la participation de tous, et pas seulement des élèves « à besoins particuliers ».", "m": "Index ; cultures – politiques – pratiques ; obstacles à l'apprentissage et à la participation ; processus continu ; valeurs partagées ; tous les apprenants"}, {"t": 9, "k": "a", "a": "Vygotski — défectologie", "f": false, "i": "Dans ses travaux sur la défectologie (années 1920-30), Vygotski distingue la déficience primaire (organique) et la déficience secondaire (conséquences sociales et culturelles, souvent plus handicapantes). L'enfant en situation de handicap se développe selon les mêmes lois que les autres, mais par des voies différentes : la compensation passe par des voies de contournement socialement médiatisées (langue des signes, braille, outils). Il faut donc s'appuyer sur les potentialités et la zone proximale de développement, et non sur le seul déficit ; il critique l'éducation séparée.", "m": "Compensation ; voies de contournement ; médiation sociale ; déficience primaire / secondaire ; potentialités ; ZPD"}, {"t": 9, "k": "a", "a": "Mace (Universal Design)", "f": false, "i": "Ronald Mace, architecte (Center for Universal Design, années 1980-90), est à l'origine du design universel : concevoir produits et environnements utilisables par le plus grand nombre, sans adaptation ni conception spécialisée. Sept principes : usage équitable, flexibilité d'usage, usage simple et intuitif, information perceptible, tolérance à l'erreur, effort physique minimal, dimensions et espace adaptés. Exemple type : la rampe ou le sous-titrage qui bénéficient à tous. C'est la racine architecturale de l'UDL pédagogique.", "m": "Conception universelle ; usage équitable ; flexibilité ; tolérance à l'erreur ; pour tous dès la conception ; architecture"}, {"t": 9, "k": "a", "a": "Wolfensberger", "f": false, "i": "Wolfensberger a diffusé en Amérique du Nord le principe de normalisation (issu des pays scandinaves) puis la valorisation des rôles sociaux : offrir aux personnes en situation de handicap des conditions de vie, des lieux et des rôles sociaux valorisés, proches de ceux du plus grand nombre. Il dénonce la ségrégation en institutions et la dévalorisation sociale. C'est la racine historique de l'intégration puis de l'inclusion, même si l'inclusion actuelle va plus loin en exigeant que ce soit le système qui change.", "m": "Normalisation ; valorisation des rôles sociaux ; désinstitutionnalisation ; intégration ; dignité"}, {"t": 9, "k": "p", "a": "Piège QCM", "f": false, "i": "Intégration (l'élève s'adapte) ≠ inclusion (le dispositif change). Repères : loi-cadre 97.13 ; CDPH ratifiée en 2009.", "m": ""}, {"t": 9, "k": "x", "a": "Terrain topo", "f": false, "i": "Malentendant, signes convenus opérateur / porte-prisme ; l'adaptation porte sur l'interface, pas sur l'exigence de précision.", "m": ""}, {"t": 10, "k": "a", "a": "Huizinga (1938)", "f": true, "i": "Dans Homo Ludens, le jeu précède la culture et en est un fondement : activité libre et volontaire, située hors de la vie courante, limitée dans le temps et l'espace, soumise à des règles acceptées, source de tension et de plaisir sans but utilitaire. Il introduit le « cercle magique » : l'espace-temps du jeu où les règles ordinaires sont suspendues et remplacées par celles du jeu. Pour le formateur, cela justifie de délimiter clairement la séquence ludique et d'en faire accepter les règles.", "m": "Homo ludens ; cercle magique ; liberté ; règles ; gratuité ; jeu et culture"}, {"t": 10, "k": "a", "a": "Caillois (1958)", "f": false, "i": "Dans Les jeux et les hommes, Caillois classe les jeux en quatre catégories : agôn (compétition), alea (hasard), mimicry (simulacre, jeu de rôle) et ilinx (vertige, sensations). Ces catégories s'inscrivent sur un axe entre paidia (jeu spontané, turbulent) et ludus (jeu réglé, discipliné). Utilité pédagogique : choisir le type de jeu selon l'objectif (mimicry pour une réunion de chantier simulée, agôn pour un défi chronométré).", "m": "Agôn ; alea ; mimicry ; ilinx ; paidia / ludus ; typologie des jeux"}, {"t": 10, "k": "a", "a": "Deterding et al. (2011)", "f": false, "i": "Ils définissent la gamification comme l'usage d'éléments de design de jeu dans des contextes non ludiques. Ils distinguent la gamification (éléments isolés : points, badges, classements) du serious game (jeu complet à finalité sérieuse). Une gamification superficielle, sans lien avec les objectifs, risque de n'activer que la motivation extrinsèque.", "m": "Gamification ; éléments de jeu ; contexte non ludique ; points – badges – classements ; serious game"}, {"t": 10, "k": "a", "a": "Csíkszentmihályi (1990)", "f": false, "i": "Théorie du flow : état d'absorption et de plaisir dans une activité, atteint lorsque le défi perçu est en équilibre avec l'habileté perçue. Trop de défi provoque anxiété, trop peu provoque ennui. Conditions : buts clairs, retour d'information immédiat, concentration. En formation : calibrer la difficulté et la faire évoluer avec la progression de l'apprenant.", "m": "Flow ; expérience optimale ; équilibre défi / habileté ; feedback immédiat ; buts clairs ; anxiété / ennui"}, {"t": 10, "k": "a", "a": "Deci & Ryan", "f": false, "i": "Théorie de l'autodétermination : la motivation intrinsèque se nourrit de trois besoins, l'autonomie, la compétence et l'affiliation. Les récompenses externes perçues comme contrôlantes peuvent la réduire : c'est l'effet de surjustification. Un jeu efficace soutient ces besoins (choix, progression visible, travail en équipe) plutôt que de reposer sur des récompenses seules.", "m": "Motivation intrinsèque / extrinsèque ; autodétermination ; autonomie – compétence – affiliation ; surjustification"}, {"t": 10, "k": "a", "a": "Vygotski", "f": false, "i": "Le jeu crée une zone proximale de développement : dans une situation ludique, avec règles et rôles, l'apprenant agit au-delà de son niveau habituel, soutenu par la situation imaginaire, les pairs et la médiation de l'adulte. Le jeu de rôle devient ainsi un moyen d'expérimenter des conduites professionnelles avant de les assumer en situation réelle.", "m": "ZPD ; jeu ; situation imaginaire ; règles ; médiation ; développement"}, {"t": 10, "k": "a", "a": "Bandura", "f": false, "i": "Théorie sociale cognitive : on apprend en observant des modèles (apprentissage vicariant). Le jeu de rôle et la simulation permettent d'observer, de reproduire et de renforcer des comportements, avec effet sur le sentiment d'auto-efficacité. Le formateur doit donc soigner la qualité du modèle montré et le retour fait après la scène.", "m": "Apprentissage vicariant ; modélisation ; observation ; jeu de rôle ; auto-efficacité"}, {"t": 10, "k": "a", "a": "Brougère", "f": false, "i": "Pour Brougère, le jeu est une activité de second degré, un cadre où les participants décident et où l'on fait « pour de faux » ; il produit une culture ludique. Il refuse l'idée d'un apprentissage automatique : l'effet éducatif dépend du cadre, de la médiation et du lien avec les objectifs (paradoxe du jeu éducatif). Ce qui est appris doit être explicité après le jeu.", "m": "Culture ludique ; second degré ; cadre de jeu ; décision ; jeu éducatif ; médiation"}, {"t": 10, "k": "p", "a": "Piège QCM", "f": false, "i": "Jeu sans débriefing = divertissement ; gamification superficielle (points, badges) = motivation extrinsèque.", "m": ""}, {"t": 10, "k": "x", "a": "Terrain topo", "f": false, "i": "Escape game d'implantation chronométré ; jeu de rôle « réunion de chantier » ; serious game sécurité.", "m": ""}, {"t": 11, "k": "a", "a": "Schön (1983)", "f": true, "i": "Dans The Reflective Practitioner, Schön critique la rationalité technique (appliquer des savoirs scientifiques à des problèmes bien définis). La pratique réelle comporte des zones indéterminées : incertitude, singularité, conflits de valeurs. Le praticien réflexif mobilise un savoir tacite dans l'action, dialogue avec la situation (réflexion dans l'action) et analyse ensuite ce qu'il a fait (réflexion sur l'action).", "m": "Praticien réflexif ; rationalité technique ; zones indéterminées ; réflexion dans / sur l'action ; savoir tacite"}, {"t": 11, "k": "a", "a": "Argyris & Schön", "f": false, "i": "Ils distinguent l'apprentissage en simple boucle (corriger l'action sans changer les valeurs qui la gouvernent) et en double boucle (interroger les finalités, les présupposés et les valeurs). Ils opposent aussi théories professées (ce que l'on dit faire) et théories d'usage (ce que l'on fait réellement). La réflexivité vise l'écart entre les deux.", "m": "Simple / double boucle ; théorie professée / théorie d'usage ; présupposés ; finalités ; routines défensives"}, {"t": 11, "k": "a", "a": "Perrenoud (2001)", "f": false, "i": "Dans Développer la pratique réflexive dans le métier d'enseignant, Perrenoud fait de la réflexivité une posture durable, un habitus professionnel, et non une réflexion occasionnelle après un échec. Elle s'apprend par l'analyse de pratiques et la formation, et suppose un cadre sûr. Il distingue réfléchir dans l'action et sur l'action et précise que ce n'est pas se critiquer soi-même.", "m": "Pratique réflexive ; habitus ; posture durable ; analyse de pratiques ; professionnalisation ; métier"}, {"t": 11, "k": "a", "a": "Kolb", "f": false, "i": "Le cycle de l'apprentissage expérientiel comprend quatre moments : expérience concrète, observation réfléchie, conceptualisation abstraite, expérimentation active. L'expérience seule n'apprend pas : elle doit être analysée puis réinvestie. La séance du formateur est une expérience à réfléchir, ce qui conduit à la reprendre avec un objectif d'amélioration.", "m": "Apprentissage expérientiel ; cycle de Kolb ; observation réfléchie ; conceptualisation ; expérimentation active"}, {"t": 11, "k": "a", "a": "Wenger (1998)", "f": false, "i": "Wenger voit l'apprentissage comme un phénomène social de participation à une communauté de pratique, définie par trois dimensions : engagement mutuel, entreprise commune et répertoire partagé (outils, routines, langage). Apprendre, c'est aussi devenir quelqu'un : la communauté soutient l'identité et le développement professionnel collectif, par exemple via l'échange entre pairs formateurs.", "m": "Communauté de pratique ; engagement mutuel ; entreprise commune ; répertoire partagé ; participation ; identité"}, {"t": 11, "k": "a", "a": "Wittorski", "f": false, "i": "Wittorski étudie la professionnalisation comme processus liant actions, apprentissages et construction de l'identité professionnelle. Il décrit plusieurs logiques de professionnalisation (logique de l'action, de la réflexion sur l'action, de l'intégration- assimilation) et montre que l'analyse des pratiques et la reconnaissance par le collectif transforment l'identité.", "m": "Professionnalisation ; identité professionnelle ; logiques de professionnalisation ; analyse de pratiques ; reconnaissance"}, {"t": 11, "k": "a", "a": "Paquay · Altet", "f": false, "i": "Dans la lignée de Former des enseignants professionnels (Paquay, Altet, Charlier, Perrenoud), ils défendent le paradigme du praticien réflexif et l'analyse de pratiques comme dispositif de formation du formateur professionnel, appuyé sur un référentiel de compétences et sur l'articulation entre théorie et terrain.", "m": "Formateur professionnel ; analyse de pratiques ; praticien réflexif ; référentiel de compétences ; professionnalité"}, {"t": 11, "k": "a", "a": "Dewey", "f": false, "i": "Racine de la pensée réflexive : pour Dewey (How We Think, 1910), réfléchir est un examen actif et persistant d'une croyance à la lumière de ses fondements et de ses conséquences. Elle naît d'une situation problématique ou d'un doute, et demande ouverture d'esprit et responsabilité. L'éducation relie expérience et réflexion (Expérience et éducation, 1938).", "m": "Pensée réflexive ; situation problématique ; doute ; enquête ; expérience ; ouverture d'esprit"}, {"t": 11, "k": "p", "a": "Piège QCM", "f": false, "i": "Réflexion DANS l'action (temps réel) ≠ SUR l'action (après coup). Réflexivité ≠ autodépréciation.", "m": ""}, {"t": 11, "k": "x", "a": "Terrain topo", "f": false, "i": "Journal de bord, auto-vidéoscopie, observation croisée entre pairs avec un focus unique.", "m": ""}, {"t": 12, "k": "a", "a": "Weber (1919)", "f": true, "i": "Dans Le savant et le politique, Weber oppose l'éthique de conviction (agir selon des principes, quelles que soient les conséquences) et l'éthique de responsabilité (assumer les conséquences prévisibles de ses actes). Les deux ne s'excluent pas : une personne mature les combine. Il défend aussi la neutralité axiologique de l'enseignant : ne pas imposer ses valeurs sous couvert de savoir.", "m": "Éthique de conviction ; éthique de responsabilité ; conséquences prévisibles ; neutralité axiologique ; vocation"}, {"t": 12, "k": "a", "a": "Ricœur (1990)", "f": false, "i": "Dans Soi-même comme un autre, Ricœur définit la visée éthique comme « la vie bonne, avec et pour autrui, dans des institutions justes » : estime de soi, sollicitude envers autrui et sens de la justice. Il distingue l'éthique (visée du bien) de la morale (normes, obligations). Quand les normes entrent en conflit, la sagesse pratique permet de juger en situation.", "m": "Visée éthique ; vie bonne ; sollicitude ; institutions justes ; estime de soi ; sagesse pratique"}, {"t": 12, "k": "a", "a": "Prairat", "f": false, "i": "Prairat distingue la déontologie, ensemble de devoirs et de règles professionnelles prescrites (codes, chartes), et l'éthique, qui relève de la délibération et du jugement face aux situations singulières. Les deux sont nécessaires : la règle protège et cadre, l'éthique interroge le sens et la juste manière d'agir dans le métier d'enseigner.", "m": "Déontologie enseignante ; éthique professionnelle ; devoirs ; règles ; délibération ; responsabilité"}, {"t": 12, "k": "a", "a": "Kohlberg", "f": false, "i": "Kohlberg décrit le développement du jugement moral en trois niveaux (préconventionnel, conventionnel, postconventionnel) et six stades. Le jugement progresse en discutant des dilemmes moraux (dilemme de Heinz) où des principes entrent en conflit. En formation : proposer des dilemmes de métier pour faire argumenter, plutôt que d'imposer une réponse.", "m": "Dilemme moral ; stades ; niveaux pré- / conventionnel / post-conventionnel ; jugement moral ; justice"}, {"t": 12, "k": "a", "a": "Jonas (1979)", "f": false, "i": "Dans Le principe responsabilité, Jonas propose une éthique adaptée à la civilisation technologique, dont les actions ont des effets durables et irréversibles. Il pose un devoir de responsabilité envers les générations futures et de la nature, avec une heuristique de la peur : en cas d'incertitude, donner priorité à la prévision du pire. Transposable aux enjeux fonciers et environnementaux.", "m": "Principe responsabilité ; générations futures ; heuristique de la peur ; civilisation technologique ; précaution"}, {"t": 12, "k": "a", "a": "Kant · Aristote", "f": false, "i": "Deux racines de l'éthique. Kant : éthique du devoir (déontologique), fondée sur l'impératif catégorique, c'est-à-dire une règle universalisable qui traite l'humanité comme une fin et jamais seulement comme un moyen. Aristote (Éthique à Nicomaque) : éthique de la vertu, où l'on vise le bonheur (eudaimonia) par l'habitude des vertus, guidée par la prudence (phronèsis) et le juste milieu.", "m": "Devoir ; impératif catégorique ; universalisation ; vertu ; phronèsis ; juste milieu ; eudaimonia"}, {"t": 12, "k": "a", "a": "Cadre juridique", "f": false, "i": "Repères marocains pour la posture éthique : la loi 54-19 (Charte des services publics, 2021) fixe des principes comme l'égalité, la neutralité, la transparence, l'intégrité et la reddition des comptes ; la Constitution de 2011 consacre la bonne gouvernance et l'obligation de rendre compte ; la loi 09-08 protège les données personnelles (consentement, finalité, confidentialité). Le formateur y applique neutralité, équité et confidentialité des données des stagiaires.", "m": "Service public ; neutralité ; égalité ; reddition des comptes ; données personnelles ; confidentialité (loi 09-08)"}, {"t": 12, "k": "p", "a": "Piège QCM", "f": false, "i": "La déontologie prescrit, l'éthique délibère. Neutralité ≠ indifférence : neutre sur les opinions, intransigeant sur les normes et la sécurité.", "m": ""}, {"t": 12, "k": "x", "a": "Terrain topo", "f": false, "i": "Dilemmes : « arrondir » une limite, sauter un contrôle de fermeture, valider une implantation non vérifiée.", "m": ""}], "themes": [{"n": 1, "titre": "Métacognition appliquée au geste professionnel", "bloc": "Bloc 1"}, {"n": 2, "titre": "Gestion de la charge cognitive (technique / gestuel)", "bloc": "Bloc 1"}, {"n": 3, "titre": "Questionnement pour l'analyse de pratique professionnelle", "bloc": "Bloc 1"}, {"n": 4, "titre": "Alignement pédagogique orienté compétences (APC)", "bloc": "Bloc 2"}, {"n": 5, "titre": "Scénarisation articulant théorie et pratique", "bloc": "Bloc 2"}, {"n": 6, "titre": "Transfert des apprentissages vers le poste de travail", "bloc": "Bloc 2"}, {"n": 7, "titre": "Andragogie et posture du formateur face aux adultes", "bloc": "Bloc 3"}, {"n": 8, "titre": "Différenciation pédagogique face à l'hétérogénéité", "bloc": "Bloc 3"}, {"n": 9, "titre": "Inclusion et accessibilité en formation professionnelle", "bloc": "Bloc 3"}, {"n": 10, "titre": "Ludopédagogie (compétences comportementales et techniques)", "bloc": "Bloc 3"}, {"n": 11, "titre": "Posture réflexive du formateur sur sa pratique", "bloc": "Bloc 4"}, {"n": 12, "titre": "Neutralité et posture éthique du formateur", "bloc": "Bloc 4"}]};
var CARDS=DATA.cards, THEMES=DATA.themes;
CARDS.forEach(function(c,i){c.id=c.t+"|"+c.k+"|"+c.a;});

var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function theme(n){return THEMES.filter(function(t){return t.n===n;})[0];}

/* Sauvegarde locale (facultative) */
var KEY="ofppt_flash_v1", SAVED={};
try{SAVED=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){SAVED={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVED));}catch(e){}}

var S={sel:0,mix:true,extra:true,reverse:false,onlyReview:false,deck:[],i:0,back:false,known:0,review:0,marks:{},view:"home"};

function setP(p){$("#pfill").style.width=p+"%";$("#pbar").setAttribute("aria-valuenow",Math.round(p));}
function setLive(on){var l=$("#live");l.classList.toggle("on",on);document.body.classList.toggle("inq",on);
  if(on){$("#lk").textContent="✓ "+S.known;$("#lr").textContent="↻ "+S.review;$("#lp").textContent=(S.i+1)+" / "+S.deck.length;}}

function counts(n){
  var a=CARDS.filter(function(c){return (n===0||c.t===n)&&c.k==="a";}).length;
  var e=CARDS.filter(function(c){return (n===0||c.t===n)&&c.k!=="a";}).length;
  return {a:a,e:e};
}
function nSaved(st){return CARDS.filter(function(c){return SAVED[c.id]===st;}).length;}

function home(){
  S.view="home";setP(0);setLive(false);
  var c=counts(0), kn=nSaved("k"), rv=nSaved("r");
  var h='<section class="panel"><span class="kicker">Concours de promotion interne · OFPPT</span>'+
   '<h1>Flashcards : tous les auteurs des 12 thématiques</h1>'+
   '<p class="sub">Une fiche par auteur, avec ses idées centrales et ses mots-clés, tirées du référentiel. Retournez la carte, puis dites si vous la saviez.</p>'+
   '<div class="stats"><div class="stat"><b>'+c.a+'</b><span>fiches auteurs</span></div><div class="stat"><b>'+c.e+'</b><span>cartes pièges et terrain</span></div>'+
   '<div class="stat"><b>'+kn+'</b><span>maîtrisées</span></div><div class="stat"><b>'+rv+'</b><span>à revoir</span></div></div>'+
   '<h2>1. Thématique</h2><div class="themes" role="radiogroup" aria-label="Thématique">'+tb(0,"Toutes les thématiques","Paquet complet",c.a+c.e,true);
  THEMES.forEach(function(t){var k=counts(t.n);h+=tb(t.n,"N°"+t.n+" — "+t.titre,t.bloc,k.a+k.e,false);});
  h+='</div><h2>2. Options</h2><div class="opts">'+
   '<label class="opt"><input type="checkbox" id="oMix"><span>Mélanger les cartes</span></label>'+
   '<label class="opt"><input type="checkbox" id="oExtra"><span>Inclure les cartes « Piège QCM » et « Terrain topo »</span></label>'+
   '<label class="opt"><input type="checkbox" id="oRev"><span>Mode inversé : lire les idées, retrouver l\'auteur<small>Plus difficile, plus proche d\'un QCM.</small></span></label>'+
   '<label class="opt"><input type="checkbox" id="oOnly"><span>Seulement les cartes « à revoir » ou jamais vues<small>Cache les cartes déjà maîtrisées.</small></span></label></div>'+
   '<div class="actions"><button class="btn btn-p btn-lg" id="go">Commencer</button></div>'+
   '<button class="muted-link" id="reset">Réinitialiser ma progression</button></section>';
  $("#app").innerHTML=h;
  $("#oMix").checked=S.mix;$("#oExtra").checked=S.extra;$("#oRev").checked=S.reverse;$("#oOnly").checked=S.onlyReview;
  document.querySelectorAll(".th").forEach(function(b){b.addEventListener("click",function(){
    S.sel=parseInt(b.getAttribute("data-n"),10);
    document.querySelectorAll(".th").forEach(function(x){var on=+x.getAttribute("data-n")===S.sel;x.setAttribute("aria-checked",on);x.querySelector(".c").textContent=on?"✓":"";});});});
  $("#oMix").onchange=function(e){S.mix=e.target.checked;};
  $("#oExtra").onchange=function(e){S.extra=e.target.checked;};
  $("#oRev").onchange=function(e){S.reverse=e.target.checked;};
  $("#oOnly").onchange=function(e){S.onlyReview=e.target.checked;};
  $("#go").onclick=start;
  $("#reset").onclick=function(){if(confirm("Effacer toute votre progression ?")){SAVED={};save();home();}};
  window.scrollTo(0,0);
}
function tb(n,t,sub,count,all){var on=S.sel===n;
  return '<button type="button" role="radio" class="th'+(all?' all':'')+'" data-n="'+n+'" aria-checked="'+on+'"><span class="c" aria-hidden="true">'+(on?"✓":"")+'</span><span class="b">'+esc(all?"Paquet complet":sub)+'</span><span class="t">'+esc(t)+'</span><span class="n">'+count+' cartes</span></button>';}

function start(){
  var d=CARDS.filter(function(c){
    if(S.sel!==0&&c.t!==S.sel)return false;
    if((S.reverse||!S.extra)&&c.k!=="a")return false;
    if(S.onlyReview&&SAVED[c.id]==="k")return false;
    return true;});
  if(!d.length){alert("Aucune carte ne correspond à ces options (tout est déjà maîtrisé ?). Décochez « Seulement à revoir ».");return;}
  begin(S.mix?shuffle(d):d);
}
function begin(d){S.deck=d;S.i=0;S.back=false;S.known=0;S.review=0;S.marks={};show();}

function chips(m){return m.split(/\s*;\s*/).filter(Boolean).map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("");}

function show(){
  S.view="card";S.back=false;
  var c=S.deck[S.i], th=theme(c.t), rev=S.reverse&&c.k==="a";
  setLive(true);setP(S.i/S.deck.length*100);
  var front,back;
  var tag='<div class="tag">Thématique '+th.n+' · '+esc(th.titre)+'</div>';
  if(c.k==="a"&&!rev){
    front='<div class="tag">N°'+th.n+' · '+esc(th.bloc)+'</div><div class="name">'+esc(c.a)+'</div>'+(c.f?'<span class="fond">★ Auteur fondateur</span>':'')+'<div class="hint">Que dit cet auteur ? Touchez la carte pour la retourner</div>';
    back=tag+'<h3>'+esc(c.a)+(c.f?' ★':'')+'</h3><div class="lbl">Idées centrales</div><p class="idees">'+esc(c.i)+'</p><div class="lbl">Mots-clés</div><div class="chips">'+chips(c.m)+'</div>';
  }else if(c.k==="a"&&rev){
    front='<div class="tag">N°'+th.n+' · Qui est-ce ?</div><p class="qtext">'+esc(c.i)+'</p><div class="hint">Retrouvez l\'auteur, puis retournez la carte</div>';
    back=tag+'<div class="lbl">Auteur</div><h3 style="font-size:1.6rem">'+esc(c.a)+(c.f?' ★':'')+'</h3><div class="lbl">Mots-clés</div><div class="chips">'+chips(c.m)+'</div>';
  }else{
    var lab=c.k==="p"?"Piège QCM":"Terrain topo";
    front='<div class="tag">Thématique '+th.n+' · '+esc(th.titre)+'</div><div class="name">'+lab+'</div><div class="hint">Touchez la carte pour la retourner</div>';
    back='<div class="tag">Thématique '+th.n+'</div><h3>'+lab+'</h3><p class="idees">'+esc(c.i)+'</p>';
  }
  var h='<div class="deckhead"><span class="badge">'+(rev?'Mode inversé':'Thématique '+th.n)+'</span><span class="cnt">Carte '+(S.i+1)+' sur '+S.deck.length+'</span></div>'+
   '<div class="scene"><button class="flip" id="flip" aria-label="Retourner la carte" aria-pressed="false"><div class="face front" aria-hidden="false">'+front+'</div><div class="face back" aria-hidden="true">'+back+'</div></button></div>'+
   '<div class="rate hidden" id="rate"><button class="btn btn-ko" id="bR">↻ À revoir</button><button class="btn btn-ok" id="bK">✓ Je savais</button></div>'+
   '<div class="nav"><button class="btn btn-g" id="bP"'+(S.i===0?' disabled':'')+'>← Précédente</button><button class="btn btn-g" id="bQ">Quitter</button><button class="btn btn-g" id="bN">Passer →</button></div>'+
   '<div class="kbd"><kbd>Espace</kbd> retourner · <kbd>1</kbd> à revoir · <kbd>2</kbd> je savais · <kbd>←</kbd> <kbd>→</kbd> naviguer</div>';
  $("#app").innerHTML=h;
  $("#flip").onclick=flip;$("#bK").onclick=function(){mark("k");};$("#bR").onclick=function(){mark("r");};
  $("#bP").onclick=prev;$("#bN").onclick=skip;$("#bQ").onclick=function(){if(confirm("Quitter ce paquet ?"))end();};
  var pr=S.marks[S.i]; if(pr){/* déjà noté */}
  window.scrollTo(0,0);
}
function flip(){
  S.back=!S.back;
  var f=$("#flip");f.classList.toggle("is-back",S.back);f.setAttribute("aria-pressed",S.back);
  f.querySelector(".front").setAttribute("aria-hidden",S.back);f.querySelector(".back").setAttribute("aria-hidden",!S.back);
  $("#rate").classList.toggle("hidden",!S.back);
}
function mark(st){
  var c=S.deck[S.i];SAVED[c.id]=st;save();
  var old=S.marks[S.i];
  if(old==="k")S.known--;if(old==="r")S.review--;
  S.marks[S.i]=st;if(st==="k")S.known++;else S.review++;
  advance();
}
function skip(){advance();}
function advance(){if(S.i+1<S.deck.length){S.i++;show();}else end();}
function prev(){if(S.i>0){S.i--;show();}}

function end(){
  S.view="end";setLive(false);setP(100);
  var done=S.known+S.review, pct=done?Math.round(S.known/done*100):0;
  var rv=S.deck.filter(function(c,i){return S.marks[i]==="r";});
  var skipped=S.deck.length-done;
  var h='<section class="panel res"><span class="kicker">Paquet terminé</span><div class="ring" style="--p:'+pct+'"><i><b>'+pct+'%</b><span>'+S.known+' / '+done+'</span></i></div>'+
   '<h1>'+S.known+' maîtrisée'+(S.known>1?'s':'')+', '+S.review+' à revoir</h1>'+
   '<p class="sub">'+(skipped>0?skipped+' carte'+(skipped>1?'s':'')+' passée'+(skipped>1?'s':'')+' sans notation. ':'')+(S.review?'Refaites les cartes difficiles jusqu\'à ce qu\'elles tombent à zéro.':'Excellent : tout ce paquet est maîtrisé.')+'</p>'+
   '<div class="actions">'+(rv.length?'<button class="btn btn-p" id="eR">Refaire les '+rv.length+' à revoir</button>':'')+'<button class="btn btn-g" id="eA">Recommencer ce paquet</button><button class="btn btn-g" id="eH">Accueil</button></div></section>';
  $("#app").innerHTML=h;
  var r=$("#eR");if(r)r.onclick=function(){begin(shuffle(rv));};
  $("#eA").onclick=function(){begin(S.mix?shuffle(S.deck):S.deck);};
  $("#eH").onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener("keydown",function(e){
  if(S.view!=="card"||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(k===" "||k==="Enter"){ if(e.target&&e.target.id==="flip")return; if(e.target&&e.target.tagName==="BUTTON"&&e.target.id!=="flip")return; e.preventDefault();flip();}
  else if(k==="ArrowRight"){e.preventDefault();skip();}
  else if(k==="ArrowLeft"){e.preventDefault();prev();}
  else if(k==="1"&&S.back){mark("r");}
  else if(k==="2"&&S.back){mark("k");}
});
/* Balayage tactile */
(function(){var x0=null;
  document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;},{passive:true});
  document.addEventListener("touchend",function(e){if(x0===null||S.view!=="card")return;var dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>80){dx<0?skip():prev();}},{passive:true});})();

home();
</script>
</body>
</html>
